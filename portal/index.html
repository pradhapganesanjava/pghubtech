<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
      connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.openai.azure.com https://*.cognitiveservices.azure.com;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: data:;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      frame-src 'self' blob: https://accounts.google.com https://pghubads.web.app https://pg-hub-ads.firebaseapp.com https://pradhapganesanjava.github.io;
      object-src 'none';
      base-uri 'self';
    " />
    <link rel="icon" type="image/svg+xml" href="/pghubtech/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PG Hub Tech</title>
    <!-- SPA decoder for the GitHub Pages 404.html redirect (rafgraph/spa-github-pages).
         When 404.html bounces /pghubtech/AdsHub → /pghubtech/?/AdsHub, this snippet
         rewrites the URL back to /pghubtech/AdsHub via replaceState BEFORE React mounts,
         so the routing code in App reads the original path. Inline + first so it runs
         before any other script. -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Sync theme before React mounts to avoid flash -->
    <script src="./theme-init.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
