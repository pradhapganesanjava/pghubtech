<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Graph Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f172a; --sur:#1e293b; --sur2:#243247; --bdr:#334155;
  --tx:#e2e8f0; --mt:#94a3b8; --pr:#3b82f6;
  --ok:#10b981; --warn:#f59e0b; --err:#ef4444; --pur:#8b5cf6;
}
/* ── Portal theme compliance ──────────────────────────────────────────────
   The portal sets data-theme on its <html>; AdsLineage forwards it to this
   iframe (kg-theme message → applyKgTheme sets data-theme here too). These
   blocks remap the graph's own vars (--bg/--sur/--sur2/--bdr/--tx/--mt/--pr)
   onto the portal palette so the Lineage window matches the chosen theme.
   Values mirror portal/src/App.css. (Accent literals like #60a5fa stay.) */
html[data-theme="dark"] {
  --bg:#0f0f13; --sur:#1a1a24; --sur2:#252535; --bdr:#2e2e42;
  --tx:#e2e2f0; --mt:#9090b0; --pr:#6366f1;
}
html[data-theme="light"] {
  --bg:#f5f5ff; --sur:#ffffff; --sur2:#eaeaf8; --bdr:#c8c8e8;
  --tx:#1a1a2e; --mt:#5252a0; --pr:#6366f1;
}
html[data-theme="soft"] {
  --bg:#1e1b34; --sur:#28244a; --sur2:#342f60; --bdr:#3d3870;
  --tx:#ddd8ff; --mt:#8880c8; --pr:#a78bfa; --pur:#a78bfa;
}
html[data-theme="contrast"] {
  --bg:#000000; --sur:#0f0f0f; --sur2:#1a1a1a; --bdr:#555555;
  --tx:#ffffff; --mt:#bbbbbb; --pr:#faff00; --ok:#00ff88; --warn:#ff9900; --err:#ff3344;
}
html[data-theme="glow"] {
  --bg:#050510; --sur:#0a0a28; --sur2:#0f0f3f; --bdr:#1e1e80;
  --tx:#d0e4ff; --mt:#5070d0; --pr:#00e5ff; --ok:#00ff99; --warn:#ffcc00; --err:#ff2266;
}
html[data-theme="cartoon"] {
  --bg:#fff9e6; --sur:#ffffff; --sur2:#fff3c8; --bdr:#f0c040;
  --tx:#2d2416; --mt:#786030; --pr:#7c3aed; --ok:#059669; --warn:#d97706; --err:#dc2626;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--tx); display:flex; height:100vh; overflow:hidden; }

/* Sidebar */
.sidebar { width:220px; flex-shrink:0; background:var(--sur); border-right:1px solid var(--bdr); display:flex; flex-direction:column; transition:width .15s ease; position:relative; overflow:hidden; }
.sidebar.collapsed { width:0 !important; border-right:none; }

/* Toggle button lives in the topbar (always visible) */
.topbar-toggle { background:transparent; border:1px solid var(--bdr); color:var(--mt); cursor:pointer; padding:4px 11px; border-radius:5px; font-size:14px; line-height:1; margin-right:10px; transition:all .12s; }
.topbar-toggle:hover { background:var(--sur2); color:var(--tx); border-color:var(--pr); }

/* Vertical resizer between sidebar and main */
.resizer { width:4px; flex-shrink:0; background:var(--bdr); cursor:col-resize; transition:background .12s; position:relative; z-index:10; }
.resizer:hover, .resizer.rz-active { background:var(--pr); }
.resizer::after { content:''; position:absolute; left:-3px; right:-3px; top:0; bottom:0; }
.sidebar.collapsed + .resizer { display:none; }

/* Collapsible cards (used in Lineage controls) */
.card.col-able .card-title { cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.card.col-able .card-title::before { content:'▾'; font-size:9px; color:var(--mt); transition:transform .12s; width:10px; display:inline-block; }
.card.col-able.collapsed .card-title::before { transform:rotate(-90deg); }
.card.col-able.collapsed { padding-bottom:13px !important; }
.card.col-able.collapsed > :not(.card-title) { display:none !important; }
.card.col-able .card-title:hover::before { color:var(--pr); }
.sb-hd { padding:16px 14px 12px; border-bottom:1px solid var(--bdr); }
.sb-hd h1 { font-size:14px; font-weight:700; }
.sb-hd p  { font-size:10px; color:var(--mt); margin-top:2px; }
.nav-grp  { padding:8px 0; }
.nav-lbl  { font-size:10px; font-weight:600; color:var(--mt); text-transform:uppercase; letter-spacing:.06em; padding:0 14px 5px; }
.nav-item { display:flex; align-items:center; gap:9px; padding:8px 14px; cursor:pointer; font-size:13px; color:var(--mt); border-left:3px solid transparent; transition:all .12s; user-select:none; }
.nav-item:hover { color:var(--tx); background:rgba(255,255,255,.04); }
.nav-item.active { color:var(--pr); border-left-color:var(--pr); background:rgba(59,130,246,.1); }
.sb-ft { margin-top:auto; padding:10px; border-top:1px solid var(--bdr); display:flex; gap:6px; flex-wrap:wrap; }

/* Main */
.main { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 22px; border-bottom:1px solid var(--bdr); background:var(--sur); flex-shrink:0; }
.topbar-title { font-size:16px; font-weight:600; }
.topbar-actions { display:flex; gap:8px; }
.content { flex:1; overflow-y:auto; padding:20px 22px; }

/* Buttons */
.btn { padding:6px 13px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:5px; transition:filter .12s; white-space:nowrap; }
.btn:hover { filter:brightness(1.1); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-pr  { background:var(--pr);  color:#fff; }
.btn-sec { background:var(--sur2); color:var(--tx); border:1px solid var(--bdr); }
.btn-err { background:var(--err); color:#fff; }
.btn-sm  { padding:3px 9px; font-size:11px; }
.btn-lbl { padding:6px 13px; border-radius:6px; border:1px solid var(--bdr); background:var(--sur2); cursor:pointer; font-size:13px; font-weight:500; color:var(--tx); display:inline-flex; align-items:center; gap:5px; }

/* Cards */
.card { background:var(--sur); border:1px solid var(--bdr); border-radius:10px; padding:18px; margin-bottom:14px; }
.card-title { font-size:13px; font-weight:600; margin-bottom:12px; }

/* Stats */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px; }
.stat-card { background:var(--sur); border:1px solid var(--bdr); border-radius:10px; padding:14px; }
.stat-val { font-size:28px; font-weight:700; line-height:1; }
.stat-lbl { font-size:11px; color:var(--mt); margin-top:3px; }

/* Table */
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:8px 11px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--mt); border-bottom:1px solid var(--bdr); white-space:nowrap; }
td { padding:8px 11px; border-bottom:1px solid rgba(51,65,85,.5); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(255,255,255,.02); }

/* Badges */
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
.b-as        { background:rgba(59,130,246,.15);  color:#60a5fa; }
.b-sb        { background:rgba(16,185,129,.15);  color:#34d399; }
.b-mo        { background:rgba(245,158,11,.15);  color:#fbbf24; }
.b-ex        { background:rgba(139,92,246,.15);  color:#a78bfa; }
.b-dp        { background:rgba(239,68,68,.15);   color:#f87171; }
.b-topic     { background:rgba(99,102,241,.15);  color:#818cf8; }
.b-algorithm { background:rgba(6,182,212,.15);   color:#22d3ee; }
.b-domain    { background:rgba(245,158,11,.15);  color:#fbbf24; }
.b-object    { background:rgba(59,130,246,.15);  color:#60a5fa; }
.b-skill     { background:rgba(16,185,129,.15);  color:#34d399; }
.b-idea      { background:rgba(139,92,246,.15);  color:#a78bfa; }
.b-fact      { background:rgba(156,163,175,.15); color:#9ca3af; }
.b-easy      { background:rgba(16,185,129,.15);  color:#34d399; }
.b-medium    { background:rgba(245,158,11,.15);  color:#fbbf24; }
.b-hard      { background:rgba(239,68,68,.15);   color:#f87171; }

/* Forms */
.fg   { margin-bottom:13px; }
.fl   { display:block; font-size:10px; font-weight:600; color:var(--mt); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.fc   { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--bdr); border-radius:6px; color:var(--tx); font-size:13px; outline:none; transition:border-color .12s; font-family:inherit; }
.fc:focus { border-color:var(--pr); }
.fmono { font-family:monospace; }
.fgrid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }

/* Validation */
.vmsg { padding:8px 11px; border-radius:6px; font-size:12px; margin-top:6px; }
.verr  { background:rgba(239,68,68,.1);  border:1px solid rgba(239,68,68,.3);  color:#f87171; }
.vwarn { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:#fbbf24; }
.vok   { background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:#34d399; }

/* Modal */
.modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:999; }
.modal-ov.open { display:flex; }
.modal { background:var(--sur); border:1px solid var(--bdr); border-radius:12px; width:540px; max-height:88vh; overflow-y:auto; }
.modal-hd { padding:14px 18px; border-bottom:1px solid var(--bdr); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--sur); z-index:1; }
.modal-title { font-size:15px; font-weight:600; }
.modal-x { cursor:pointer; color:var(--mt); font-size:22px; line-height:1; }
.modal-bd { padding:18px; }
.modal-ft { padding:13px 18px; border-top:1px solid var(--bdr); display:flex; gap:8px; justify-content:flex-end; position:sticky; bottom:0; background:var(--sur); }

/* Toast */
.toast-wrap { position:fixed; bottom:18px; right:18px; z-index:1999; display:flex; flex-direction:column; gap:7px; pointer-events:none; }
.toast { padding:10px 14px; border-radius:8px; font-size:13px; font-weight:500; animation:fadeup .2s ease; max-width:340px; }
.t-ok   { background:#064e3b; color:#34d399; border:1px solid rgba(16,185,129,.3); }
.t-err  { background:#7f1d1d; color:#f87171; border:1px solid rgba(239,68,68,.3); }
.t-warn { background:#78350f; color:#fbbf24; border:1px solid rgba(245,158,11,.3); }
@keyframes fadeup { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* Root search */
.root-search { position:relative; }
.root-input  { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--bdr); border-radius:6px; color:var(--tx); font-size:13px; outline:none; transition:border-color .12s; }
.root-input:focus { border-color:var(--pr); }
.root-results { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--sur2); border:1px solid var(--bdr); border-radius:8px; max-height:280px; overflow-y:auto; z-index:200; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.root-results.open { display:block; }
.sri { display:flex; align-items:center; gap:7px; padding:7px 10px; cursor:pointer; font-size:12px; border-bottom:1px solid rgba(51,65,85,.4); }
.sri:last-child { border-bottom:none; }
.sri:hover,.sri.focused { background:rgba(59,130,246,.12); }
.sri-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sri-path { font-family:monospace; font-size:10px; color:var(--mt); flex-shrink:0; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sri-diff { flex-shrink:0; }
.root-hint { font-size:10px; color:var(--mt); margin-top:5px; line-height:1.6; }
.root-hint b { color:var(--pr); }
.root-sel-badge { display:flex; align-items:center; gap:6px; padding:5px 8px; background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.3); border-radius:6px; font-size:12px; margin-top:6px; }
.root-clear { color:var(--mt); cursor:pointer; margin-left:auto; font-size:14px; }
.root-clear:hover { color:var(--tx); }
.sri-grp { padding:4px 10px; font-size:10px; font-weight:600; color:var(--mt); text-transform:uppercase; letter-spacing:.05em; background:rgba(0,0,0,.2); border-bottom:1px solid rgba(51,65,85,.4); }

/* ── Tag Navigator ── */
.tn-wrap      { display:flex; flex-direction:column; gap:14px; height:calc(100vh - 110px); overflow:hidden; }
.tn-top       { flex-shrink:0; display:flex; flex-direction:column; gap:10px; }
.tn-header    { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tn-crumbs    { display:flex; align-items:center; gap:3px; flex-wrap:wrap; flex:1; min-width:0; }
.tn-crumb     { padding:3px 9px; border-radius:4px; cursor:pointer; font-size:13px; color:var(--mt); white-space:nowrap; }
.tn-crumb:hover { color:var(--tx); background:rgba(255,255,255,.06); }
.tn-crumb.root { color:var(--pr); font-weight:600; }
.tn-crumb.active { color:var(--tx); background:rgba(255,255,255,.08); font-weight:600; }
.tn-csep      { color:var(--bdr); font-size:12px; }
.tn-ctrl      { display:flex; gap:6px; flex-shrink:0; }
.tn-jump-wrap { position:relative; }
.tn-jump      { width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--bdr); border-radius:6px; color:var(--tx); font-size:13px; outline:none; transition:border-color .12s; }
.tn-jump:focus { border-color:var(--pr); }
.tn-jump-res  { position:absolute; top:calc(100% + 3px); left:0; right:0; background:var(--sur2); border:1px solid var(--bdr); border-radius:8px; max-height:220px; overflow-y:auto; z-index:300; display:none; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.tn-jump-res.open { display:block; }
.tn-jr        { display:flex; align-items:center; gap:7px; padding:7px 11px; cursor:pointer; font-size:12px; border-bottom:1px solid rgba(51,65,85,.35); }
.tn-jr:last-child { border-bottom:none; }
.tn-jr:hover,.tn-jr.focused { background:rgba(59,130,246,.12); }
.tn-body      { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.tn-section   { background:var(--sur); border:1px solid var(--bdr); border-radius:10px; padding:14px 16px; flex-shrink:0; }
.tn-stitle    { font-size:12px; font-weight:600; color:var(--mt); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.tn-stitle b  { color:var(--tx); text-transform:none; letter-spacing:0; font-size:13px; }
.tn-nodes     { display:flex; flex-wrap:wrap; gap:7px; }
.tn-node      { display:flex; flex-direction:column; gap:3px; padding:9px 13px; border-radius:8px; border:2px solid var(--bdr); cursor:pointer; transition:all .12s; min-width:90px; }
.tn-node:hover { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.05); }
.tn-node.sel  { border-color:var(--pr); background:rgba(59,130,246,.12); }
.tn-node.dead { border-color:rgba(51,65,85,.4); cursor:default; }
.tn-node.dead:hover { border-color:rgba(51,65,85,.4); background:none; }
.tn-stale-warn { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:7px; padding:8px 12px; font-size:12px; color:var(--warn); display:flex; align-items:center; gap:10px; }
.ol-tree { font-size:13px; }
.ol-row  { display:flex; align-items:center; gap:6px; padding:4px 6px; line-height:1.6; white-space:nowrap; border-radius:4px; }
.ol-row:hover { background:rgba(255,255,255,.04); }
.ol-tog  { display:inline-block; width:16px; text-align:center; color:var(--mt); font-size:10px; user-select:none; flex-shrink:0; }
.ol-name { font-weight:600; cursor:pointer; }
.ol-name:hover { color:var(--pr); text-decoration:underline; }
.ol-rel  { font-size:9px; padding:1px 6px; border-radius:3px; border:1px solid; background:rgba(0,0,0,.2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }

/* ── Problem detail modal (iframe of local HTML) ── */
.pm-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:998; }
.prob-modal  { position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:90vw; height:88vh; max-width:1200px; background:var(--sur); border:1px solid var(--pr); border-radius:10px; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(0,0,0,.7); z-index:999; overflow:hidden; }
.prob-modal.pm-max { top:6px !important; left:6px !important; right:6px !important; bottom:6px !important; width:auto !important; height:auto !important; max-width:none; transform:none; }
.pm-hd       { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--bdr); background:var(--sur2); cursor:move; user-select:none; flex-shrink:0; }
.pm-title    { display:flex; gap:8px; align-items:center; flex:1; font-size:13px; min-width:0; flex-wrap:wrap; }
.pm-title b  { font-weight:700; color:var(--tx); font-size:14px; }
.pm-actions  { display:flex; gap:3px; flex-shrink:0; }
.pm-iframe   { flex:1; border:none; width:100%; background:#1a1a2e; display:block; }
.pm-loading  { position:absolute; inset:46px 0 0 0; display:flex; align-items:center; justify-content:center; color:var(--mt); font-size:13px; pointer-events:none; }
.pm-block    { flex:1; display:flex; align-items:center; justify-content:center; padding:30px; }
.pm-block code { background:var(--bg); padding:2px 6px; border-radius:3px; color:#60a5fa; font-family:monospace; font-size:12px; }
.pm-block pre  { line-height:1.5; }

/* ── ⊶+ Lineage Algo view ── */
.la-wrap        { display:flex; flex-direction:column; height:calc(100vh - 110px); gap:10px; }
.la-main        { display:flex; gap:10px; flex:1; min-height:0; }
.la-ctrl        { width:244px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding-bottom:8px; transition:width .15s ease, opacity .15s; }
.la-ctrl.collapsed { width:0 !important; padding:0; overflow:hidden; opacity:0; }
.la-ctrl .card  { margin-bottom:0; padding:13px 14px; }
.la-ctrl-section-hd { font-size:10px; font-weight:700; color:#60a5fa; text-transform:uppercase; letter-spacing:.06em; padding:6px 4px 2px; border-bottom:1px solid var(--bdr); margin-bottom:4px; }
.la-content     { flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
.la-ctrl-toggle { background:transparent; border:1px solid var(--bdr); color:var(--mt); cursor:pointer; padding:3px 9px; border-radius:5px; font-size:12px; line-height:1; flex-shrink:0; }
.la-ctrl-toggle:hover { background:var(--sur2); color:var(--tx); border-color:var(--pr); }
.la-modebar     { background:var(--sur); border:1px solid var(--bdr); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
.la-mode        { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:6px; background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.35); font-size:12px; font-weight:600; color:#60a5fa; }
.la-back        { background:transparent; border:1px solid var(--bdr); color:var(--mt); cursor:pointer; padding:5px 11px; border-radius:6px; font-size:12px; }
.la-back:hover  { color:var(--tx); background:var(--sur2); border-color:var(--pr); }
.la-crumb       { display:flex; align-items:center; gap:4px; flex:1; min-width:0; flex-wrap:wrap; font-size:12px; }
.la-body        { flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; }
.la-stage       { flex:1; background:var(--sur); border:1px solid var(--bdr); border-radius:10px; position:relative; overflow:hidden; min-height:0; }
.la-stage svg   { width:100%; height:100%; display:block; cursor:grab; }
/* Floating "Center / fit" action — bottom-right of the stage, sits below the
   per-mode zoom column (which is bumped up to bottom:52px to make room). */
.la-center-fab  { position:absolute; bottom:12px; right:12px; z-index:6; width:38px; height:38px; border-radius:50%; background:var(--pr); color:#fff; border:none; cursor:pointer; font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.35); transition:transform .12s, filter .12s; }
.la-center-fab:hover { transform:scale(1.1); filter:brightness(1.1); }
/* Make room for the FAB: lift the per-mode zoom columns inside the la-stage. */
.la-stage .graph-ctrl, .la-stage .sim-graph-ctrl { bottom:60px; }
.la-leaf-grid   { padding:18px; overflow-y:auto; height:100%; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; align-content:start; }
.la-algo-card   { background:var(--sur2); border:2px solid var(--bdr); border-radius:8px; padding:12px 14px; cursor:pointer; transition:all .12s; }
.la-algo-card:hover { border-color:var(--pr); background:rgba(59,130,246,.05); transform:translateY(-1px); }
.la-algo-name   { font-weight:700; font-size:13px; margin-bottom:4px; color:var(--tx); }
.la-algo-meta   { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11px; color:var(--mt); }
.la-algo-tags   { margin-top:6px; display:flex; flex-wrap:wrap; gap:3px; }
.la-algo-tag    { font-size:10px; padding:1px 7px; background:rgba(99,102,241,.15); color:#818cf8; border-radius:10px; cursor:pointer; }
.la-algo-tag:hover { background:rgba(99,102,241,.3); color:#fff; }
.la-leaf-hd     { padding:12px 16px; border-bottom:1px solid var(--bdr); background:var(--sur2); display:flex; align-items:center; gap:10px; flex-shrink:0; font-size:13px; }
.la-leaf-hd b   { color:var(--pr); }
/* Micro-pattern ⓘ info button + card (leaf mode, for pat_* nodes) */
.micro-i-btn    { background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.4); color:#60a5fa; border-radius:50%; width:20px; height:20px; line-height:1; font-size:12px; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; padding:0; transition:all .12s; }
.micro-i-btn:hover { background:rgba(59,130,246,.25); transform:scale(1.08); }
.la-micro-info  { margin:10px 16px 0; padding:12px 14px; background:var(--sur2); border:1px solid rgba(59,130,246,.3); border-left:3px solid var(--pr); border-radius:8px; font-size:12.5px; line-height:1.55; }
.la-micro-info .mi-hd { font-weight:700; color:#60a5fa; margin-bottom:8px; font-size:13px; }
.la-micro-info .mi-row { display:flex; gap:10px; margin:5px 0; }
.la-micro-info .mi-k { flex:0 0 64px; color:var(--mt); text-transform:uppercase; font-size:10px; letter-spacing:.05em; padding-top:2px; }
.la-micro-info .mi-v { flex:1; color:var(--tx); }
.la-sim-hd      { flex-direction:column; align-items:stretch; gap:10px; padding:11px 14px; }
.la-sim-title   { display:flex; align-items:center; gap:10px; font-size:13px; }
.la-jump-groups { display:flex; flex-direction:column; gap:6px; }
.la-jump-grp    { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.la-jump-lbl    { font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:2px 8px; border-radius:10px; flex-shrink:0; }
.la-jump-lbl-t  { background:rgba(59,130,246,.18); color:#60a5fa; }
.la-jump-lbl-g  { background:rgba(139,92,246,.18); color:#a78bfa; }
.la-jump-chip   { font-size:11px; padding:3px 10px; border-radius:11px; cursor:pointer; font-weight:600; transition:filter .12s; }
.la-jump-chip:hover { filter:brightness(1.4); }
.la-sim-diff-filter { margin-left:auto; display:flex; align-items:center; gap:5px; }
.la-sim-diff-lbl    { font-size:10px; color:var(--mt); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.la-diff-chip       { cursor:pointer; font-size:11px; font-weight:600; padding:3px 10px; border-radius:11px; transition:opacity .15s, filter .15s; user-select:none; }
.la-diff-chip:hover { filter:brightness(1.3); opacity:1 !important; }

/* ── ✦ Similar Problems view ── */
.sim-wrap   { display:flex; flex-direction:column; height:calc(100vh - 110px); gap:10px; }
.sim-hd     { background:var(--sur); border:1px solid var(--bdr); border-radius:10px; padding:12px 14px; flex-shrink:0; }
.sim-search { position:relative; }
.sim-sel    { display:flex; align-items:center; gap:10px; padding:10px 12px; background:rgba(59,130,246,.08); border:1px solid rgba(59,130,246,.3); border-radius:7px; margin-top:8px; }
.sim-sel-name { font-weight:700; font-size:14px; flex:1; }
.sim-sel-clr  { color:var(--mt); cursor:pointer; font-size:16px; padding:0 4px; }
.sim-sel-clr:hover { color:var(--err); }
.sim-empty  { display:flex; align-items:center; justify-content:center; height:100%; color:var(--mt); font-size:14px; flex-direction:column; gap:10px; padding:30px; text-align:center; }
.sim-body   { flex:1; display:flex; gap:10px; min-height:0; }
.sim-graph  { flex:1; background:var(--sur); border:1px solid var(--bdr); border-radius:10px; position:relative; overflow:hidden; min-width:0; }
.sim-graph svg { width:100%; height:100%; display:block; cursor:grab; }
.sim-side   { width:340px; background:var(--sur); border:1px solid var(--bdr); border-radius:10px; display:flex; flex-direction:column; flex-shrink:0; }
.sim-side-hd { padding:11px 13px; border-bottom:1px solid var(--bdr); font-size:12px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sim-side-list { flex:1; overflow-y:auto; padding:6px 8px; }
.sim-row    { display:flex; align-items:center; gap:7px; padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12px; border:1px solid transparent; margin-bottom:3px; }
.sim-row:hover { background:rgba(59,130,246,.08); border-color:rgba(59,130,246,.3); }
.sim-row-rank { width:22px; text-align:center; font-weight:700; color:var(--mt); font-size:11px; }
.sim-row-nm  { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sim-row-sc  { color:#60a5fa; font-size:10px; font-weight:700; min-width:24px; text-align:right; }
.sim-legend  { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--mt); margin-left:auto; }
.sim-leg-d   { display:inline-block; width:9px; height:9px; border-radius:50%; }
.diff-Easy   { background:var(--ok); }
.diff-Medium { background:var(--warn); }
.diff-Hard   { background:var(--err); }
.sim-tabs    { display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--bdr); }
.sim-tab     { padding:3px 9px; font-size:11px; border-radius:11px; background:rgba(255,255,255,.05); color:var(--mt); cursor:pointer; }
.sim-tab.active { background:var(--pr); color:white; }
.sim-graph-ctrl { position:absolute; bottom:12px; right:12px; display:flex; flex-direction:column; gap:4px; z-index:5; }
.sim-graph-ctrl .g-btn { width:30px; height:30px; background:var(--sur2); border:1px solid var(--bdr); border-radius:6px; cursor:pointer; color:var(--tx); font-size:14px; display:flex; align-items:center; justify-content:center; }
.sim-graph-ctrl .g-btn:hover { background:var(--bdr); border-color:var(--pr); }

/* ── Similarity hover tooltip ── */
.sim-tip { position:fixed; display:none; z-index:9000; background:var(--sur); border:1px solid var(--pr); border-radius:8px; padding:11px 13px; box-shadow:0 10px 32px rgba(0,0,0,.7); max-width:340px; pointer-events:none; font-size:12px; }
.sim-tip-hd  { display:flex; align-items:center; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--bdr); margin-bottom:8px; }
.sim-tip-score { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.sim-tip-num   { font-size:22px; font-weight:800; color:#60a5fa; line-height:1; }
.sim-tip-rows  { display:flex; flex-direction:column; gap:4px; padding:8px 10px; background:var(--bg); border-radius:6px; font-size:11px; }
.sim-tip-row   { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--mt); }
.sim-tip-row b { color:var(--tx); }
.sim-tip-shared    { margin-top:8px; padding-top:8px; border-top:1px solid var(--bdr); }
.sim-tip-shared-hd { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--tx); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:5px; }
.sim-tip-cnt       { font-size:9px; background:rgba(255,255,255,.08); color:var(--mt); padding:1px 6px; border-radius:8px; font-weight:600; margin-left:auto; }
.sim-tip-chips     { display:flex; flex-wrap:wrap; gap:3px; }
.sim-tip-ft    { margin-top:8px; padding-top:6px; border-top:1px solid var(--bdr); font-size:10px; color:var(--mt); text-align:center; }

/* ── File:// limited-mode banner ── */
.sv-banner { position:fixed; bottom:16px; right:16px; background:var(--sur); border:2px solid var(--pr); border-radius:10px; padding:14px 16px; z-index:9999; max-width:440px; font-size:13px; box-shadow:0 12px 40px rgba(0,0,0,.7); animation:fadeup .25s ease; }
.sv-hd     { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:600; color:#60a5fa; }
.sv-x      { margin-left:auto; cursor:pointer; color:var(--mt); font-size:18px; line-height:1; padding:0 4px; }
.sv-x:hover{ color:var(--err); }
.sv-cmd    { display:flex; align-items:stretch; gap:6px; margin:8px 0 6px; }
.sv-cmd code { flex:1; background:var(--bg); padding:8px 10px; border-radius:5px; color:#60a5fa; font-family:monospace; font-size:11px; border:1px solid var(--bdr); user-select:all; overflow-x:auto; white-space:nowrap; }
.sv-copy   { padding:0 12px; background:var(--sur2); border:1px solid var(--bdr); border-radius:5px; color:var(--tx); cursor:pointer; font-size:11px; white-space:nowrap; }
.sv-copy:hover { background:var(--pr); color:white; border-color:var(--pr); }
.sv-status { font-size:11px; color:var(--mt); margin-top:4px; display:flex; align-items:center; gap:6px; }
.sv-status.ready { color:var(--ok); font-weight:600; }
.sv-dot    { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warn); animation:pulse 1.4s infinite; }
.sv-status.ready .sv-dot { background:var(--ok); animation:none; }
@keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }

/* ── 🪟 Window system (popout / drag / max / min) ── */
.w-float       { position:fixed !important; z-index:500; background:var(--sur); border:1px solid var(--pr); border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.6); overflow:hidden; display:flex; flex-direction:column; resize:both; min-width:240px; min-height:100px; max-width:100vw; max-height:100vh; }
.w-float.w-max { top:8px !important; left:8px !important; right:8px !important; bottom:8px !important; width:auto !important; height:auto !important; }
.w-float.w-min > :not(.w-bar) { display:none !important; }
.w-float.w-min { height:auto !important; min-height:0 !important; resize:none; }
.w-bar         { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--sur2); border-bottom:1px solid rgba(59,130,246,.3); cursor:move; user-select:none; flex-shrink:0; }
.w-title       { font-size:12px; font-weight:600; color:var(--tx); }
.w-btns        { margin-left:auto; display:flex; gap:2px; }
.w-btn         { width:22px; height:20px; padding:0; background:transparent; border:none; color:var(--mt); cursor:pointer; font-size:10px; border-radius:3px; line-height:1; }
.w-btn:hover   { background:rgba(255,255,255,.1); color:var(--tx); }
.pop-trigger   { width:20px; height:18px; padding:0; background:transparent; border:1px solid transparent; color:var(--mt); cursor:pointer; font-size:11px; border-radius:3px; line-height:1; }
.pop-trigger:hover { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.4); color:#60a5fa; }
.w-float > .w-bar { border-bottom-color:rgba(59,130,246,.3); }

/* ── Graph workspace (search + breadcrumb + svg + drawer stacked) ── */
.lin-wrap   { display:flex; gap:12px; height:calc(100vh - 110px); position:relative; }
.lin-ctrl   { transition:width .15s ease, opacity .15s; }
.lin-ctrl.ctrl-collapsed { width:0 !important; padding:0; overflow:hidden; opacity:0; }
.lin-ctrl-toggle { background:transparent; border:1px solid var(--bdr); color:var(--mt); cursor:pointer; padding:3px 9px; border-radius:5px; font-size:12px; line-height:1; flex-shrink:0; }
.lin-ctrl-toggle:hover { background:var(--sur2); color:var(--tx); border-color:var(--pr); }
.lin-graph-wrap { flex:1; display:flex; flex-direction:column; background:var(--sur); border:1px solid var(--bdr); border-radius:10px; overflow:hidden; min-width:0; }
.graph-head     { padding:10px 12px; border-bottom:1px solid var(--bdr); background:var(--sur); flex-shrink:0; display:flex; flex-direction:column; gap:8px; }
.gh-search      { position:relative; }
.gh-crumb       { display:flex; align-items:center; gap:4px; flex-wrap:wrap; min-height:24px; font-size:12px; }
.bc-home        { cursor:pointer; color:var(--mt); font-size:14px; padding:0 4px; }
.bc-home:hover  { color:var(--pr); }
.bc-item        { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:4px; cursor:pointer; color:var(--mt); transition:all .12s; }
.bc-item:hover  { color:var(--tx); background:rgba(255,255,255,.05); }
.bc-item.bc-current { color:var(--tx); background:rgba(59,130,246,.15); font-weight:600; }
.bc-name        { font-size:12px; }
.bc-cnt         { font-size:10px; padding:1px 6px; border-radius:8px; background:rgba(59,130,246,.2); color:#60a5fa; font-weight:700; }
.bc-sep         { color:var(--bdr); font-size:10px; }
.la-trail       { display:flex; align-items:center; gap:3px; padding:5px 10px; overflow-x:auto; white-space:nowrap; border-bottom:1px solid var(--bdr); background:rgba(255,255,255,.02); font-size:12px; scrollbar-width:thin; }
.la-trail::-webkit-scrollbar { height:6px; }
.tr-label       { color:var(--mt); font-size:11px; font-weight:600; margin-right:4px; flex:none; }
.tr-item        { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:4px; cursor:pointer; color:var(--mt); flex:none; transition:all .12s; }
.tr-item:hover  { color:var(--tx); background:rgba(255,255,255,.06); }
.tr-item.tr-current { color:var(--tx); background:rgba(59,130,246,.15); font-weight:600; cursor:default; }
.tr-ic          { font-size:11px; opacity:.7; }
.tr-name        { max-width:220px; overflow:hidden; text-overflow:ellipsis; }

/* ── Problems drawer ── */
.lin-graph    { position:relative; flex:1; min-height:0; }
.prob-drawer  { background:var(--sur2); border-top:1px solid var(--bdr); display:flex; flex-direction:column; transition:max-height .2s; max-height:46px; overflow:hidden; flex-shrink:0; position:relative; }
.prob-drawer.open { max-height:340px; }
.prob-drawer.pd-resizing { transition:none !important; user-select:none; }
.pd-resize    { height:5px; cursor:row-resize; background:transparent; flex-shrink:0; position:relative; }
.pd-resize::before { content:''; position:absolute; left:50%; top:1px; transform:translateX(-50%); width:38px; height:3px; background:var(--bdr); border-radius:2px; transition:background .12s; }
.pd-resize:hover::before, .prob-drawer.pd-resizing .pd-resize::before { background:var(--pr); }
.pd-header    { display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; user-select:none; }
.pd-header:hover { background:rgba(255,255,255,.03); }
.pd-count     { color:var(--mt); font-size:12px; }
.pd-tabs      { display:flex; gap:4px; }
.pd-tab       { font-size:10px; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.05); color:var(--mt); cursor:pointer; }
.pd-tab.active{ background:rgba(59,130,246,.2); color:#60a5fa; }
.pd-tog       { color:var(--mt); font-size:14px; }
.prob-drawer.open .pd-tog { transform:rotate(180deg); display:inline-block; }
.pd-body      { overflow-y:auto; padding:0 14px 12px; flex:1; }
.pd-row       { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid rgba(51,65,85,.4); font-size:12px; cursor:pointer; border-radius:4px; }
.pd-row:hover { background:rgba(59,130,246,.08); }
.pd-name      { font-weight:600; flex:1; }
.pd-via       { font-size:10px; color:var(--mt); font-family:monospace; }
.pd-eye       { flex-shrink:0; font-size:13px; opacity:.45; cursor:pointer; transition:opacity .12s, transform .12s; line-height:1; }
.pd-eye:hover { opacity:1; transform:scale(1.15); }

/* 👁 Quick-peek popup — small, centered, in-window */
.peek-modal   { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(560px,92vw); max-height:82vh; background:var(--sur); border:1px solid var(--pr); border-radius:10px; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(0,0,0,.7); z-index:999; overflow:hidden; }
.peek-hd      { display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--bdr); background:var(--sur2); }
.peek-title   { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.peek-title b { font-size:15px; }
.peek-body    { padding:14px; overflow-y:auto; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
.peek-micros-hd { font-weight:700; color:#60a5fa; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
.peek-path    { font-family:monospace; font-size:11px; color:#60a5fa; background:var(--bg); border:1px solid var(--bdr); border-radius:6px; padding:6px 9px; word-break:break-all; }
.peek-micro   { background:var(--sur2); border:1px solid rgba(59,130,246,.3); border-left:3px solid var(--pr); border-radius:8px; padding:11px 13px; font-size:12.5px; line-height:1.55; }
.peek-micro .pk-mi-hd  { font-weight:700; color:#60a5fa; margin-bottom:7px; font-size:13px; }
.peek-micro .pk-mi-row { display:flex; gap:10px; margin:5px 0; }
.peek-micro .pk-mi-row span { flex:0 0 64px; color:var(--mt); text-transform:uppercase; font-size:10px; letter-spacing:.05em; padding-top:2px; }
.peek-grp     { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.peek-lbl     { font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin-right:2px; }
.peek-lbl-t   { color:#60a5fa; }
.peek-lbl-g   { color:#a78bfa; }
.peek-chip    { font-size:11px; padding:3px 8px; border-radius:12px; cursor:pointer; transition:transform .1s; }
.peek-chip:hover { transform:translateY(-1px); }
.peek-chip.pk-t { background:rgba(59,130,246,.12); color:#60a5fa; border:1px solid rgba(59,130,246,.25); }
.peek-chip.pk-g { background:rgba(139,92,246,.12); color:#a78bfa; border:1px solid rgba(139,92,246,.25); }
.peek-ft      { display:flex; gap:8px; padding:11px 14px; border-top:1px solid var(--bdr); background:var(--sur2); }
.pd-empty     { color:var(--mt); font-size:12px; padding:14px; text-align:center; }

/* ── Lineage Landing (atlas) ── */
.lin-landing  { max-width:1100px; margin:0 auto; }
.land-hero    { text-align:center; padding:24px 20px 16px; }
.land-hero h2 { color:var(--tx); font-size:22px; margin-bottom:8px; }
.land-hero p  { color:var(--mt); font-size:13px; max-width:680px; margin:0 auto 16px; line-height:1.6; }
.land-search-wrap { max-width:520px; margin:0 auto; position:relative; }
.land-sec     { background:var(--sur); border:1px solid var(--bdr); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
.land-sec-hd  { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.land-sec-hd h3 { font-size:14px; font-weight:600; }
.land-grid    { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
.land-tile    { background:var(--sur2); border:2px solid var(--bdr); border-radius:8px; padding:12px 14px; cursor:pointer; transition:all .12s; }
.land-tile:hover { border-color:var(--pr); background:rgba(59,130,246,.08); transform:translateY(-1px); }
.lt-name      { font-weight:600; font-size:13px; margin-bottom:3px; color:var(--tx); }
.lt-sub       { font-size:10px; color:var(--mt); margin-bottom:6px; }
.lt-stats     { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.tl-row   { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; cursor:pointer; font-size:12px; transition:background .1s; }
.tl-row:hover { background:rgba(59,130,246,.08); }
.tl-name  { font-weight:600; min-width:110px; }
.tl-path  { font-family:monospace; font-size:10px; color:var(--mt); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tl-counts { display:flex; gap:4px; align-items:center; flex-shrink:0; }
.rnd-btns { display:flex; gap:5px; flex-wrap:wrap; }
.tn-nname     { font-size:13px; font-weight:600; }
.tn-nmeta     { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.tn-nd        { font-size:11px; background:rgba(255,255,255,.07); padding:1px 6px; border-radius:10px; color:var(--mt); }
.tn-nt        { font-size:11px; color:#60a5fa; }
.tn-nk        { font-size:10px; color:var(--pr); }
.tn-prob-list { display:flex; flex-direction:column; gap:8px; }
.tn-prob      { background:var(--sur2); border:1px solid var(--bdr); border-radius:8px; padding:11px 13px; }
.tn-phd       { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:5px; }
.tn-pname     { font-weight:600; font-size:13px; flex:1; }
.tn-psrc      { color:var(--mt); font-size:11px; }
.tn-persp     { display:flex; flex-direction:column; gap:3px; }
.tn-persp-row { display:flex; align-items:flex-start; gap:6px; font-size:11px; }
