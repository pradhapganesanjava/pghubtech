// ══════════════════════════════════════════════════════════════
// TAG NAVIGATOR
// Drill-down navigation: level nodes + problems + breadcrumb
// +  → drill into selected node's children
// −  → go up one level
// Breadcrumb → jump to any ancestor
// ══════════════════════════════════════════════════════════════
const tagNav = {
  crumb:        [],
  nodeId:       null,
  showAll:      false,
  showTopicList: true,    // flat All Topics panel — always-on
  topicFilter:  '',       // shared search query (used by both top search + panel)
  topicSort:    'total',
  diffFilter:   '',
};

// Children of parentId via SUBSET_OF (from_id=child, to_id=parent)
function navKids(parentId) {
  if (!parentId) {
    const childIds = new Set(Store.relations.filter(r => r.rel_type === 'SUBSET_OF').map(r => r.from_id));
    const roots = Store.entities.filter(e => ['TOPIC','DOMAIN'].includes(e.concept_type) && !childIds.has(e.id));
    // Sort: topics with problems or children first, orphans (empty, no children) last
    return roots.sort((a, b) => {
      const ca = Counts.forNode(a.id), cb = Counts.forNode(b.id);
      const ha = ca.total > 0 || navKids(a.id).length > 0;
      const hb = cb.total > 0 || navKids(b.id).length > 0;
      if (ha !== hb) return ha ? -1 : 1;
      return cb.total - ca.total;
    });
  }
  return Store.relations
    .filter(r => r.to_id === parentId && r.rel_type === 'SUBSET_OF')
    .map(r => Store.getEntity(r.from_id)).filter(Boolean)
    .sort((a, b) => Counts.forNode(b.id).total - Counts.forNode(a.id).total);
}

// Remove orphan TOPIC entities that have no problems (direct or subtree) and no children
// These are stale simple-ID entities from old data format
function purgeOrphanTopics() {
  const childIds = new Set(Store.relations.filter(r => r.rel_type === 'SUBSET_OF').map(r => r.from_id));
  const roots    = Store.entities.filter(e => ['TOPIC','DOMAIN'].includes(e.concept_type) && !childIds.has(e.id));
  let   removed  = 0;
  // Remove ANY topic whose entire subtree has 0 algorithms
  // This cleans stale simple-ID entities from old data format
  const allTopics = Store.entities.filter(e => ['TOPIC','DOMAIN'].includes(e.concept_type));
  allTopics.forEach(e => {
    if (Counts.forNode(e.id).total === 0) {
      Store.removeEntity(e.id);
      removed++;
    }
  });
  if (removed > 0) { toast(`Removed ${removed} empty topics (stale from old data format)`, 'ok'); renderNavigator(); }
  else toast('No empty topics found — data is clean', 'ok');
}

// Navigate to any node directly (builds breadcrumb path automatically)
function navJumpTo(id) {
  const crumb = [];
  let cur = id;
  const seen = new Set();
  while (cur) {
    if (seen.has(cur)) break;
    seen.add(cur);
    const rel = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
    if (!rel) break;
    crumb.unshift(rel.to_id);
    cur = rel.to_id;
  }
  tagNav.crumb  = crumb;
  tagNav.nodeId = id;
  tagNav.showAll = false;
  navigate('navigate');
}

function navSelect(id) {
  tagNav.nodeId  = tagNav.nodeId === id ? null : id;
  tagNav.showAll = false;
  renderNavigator();
}

function navDrillIn() {
  if (!tagNav.nodeId) return;
  const kids = navKids(tagNav.nodeId);
  if (!kids.length) { toast(`No subtopics under "${Store.getEntity(tagNav.nodeId)?.name}"`, 'warn'); return; }
  tagNav.crumb.push(tagNav.nodeId);
  tagNav.nodeId  = null;
  tagNav.showAll = false;
  renderNavigator();
}

function navGoUp() {
  if (tagNav.nodeId) { tagNav.nodeId = null; tagNav.showAll = false; renderNavigator(); return; }
  if (tagNav.crumb.length) { tagNav.crumb.pop(); renderNavigator(); }
}

function navJumpCrumb(idx) {
  if (idx === -1) { tagNav.crumb = []; tagNav.nodeId = null; }
  else { tagNav.crumb = tagNav.crumb.slice(0, idx + 1); tagNav.nodeId = null; }
  tagNav.showAll = false;
  renderNavigator();
}

// ── RENDER ───────────────────────────────────────────────────
function renderNavigator() {
  const parentId  = tagNav.crumb.length ? tagNav.crumb[tagNav.crumb.length - 1] : null;
  const nodes     = navKids(parentId);
  const selEnt    = tagNav.nodeId ? Store.getEntity(tagNav.nodeId) : null;
  const selKids   = tagNav.nodeId ? navKids(tagNav.nodeId) : [];
  const crumbEnts = tagNav.crumb.map(id => Store.getEntity(id)).filter(Boolean);

  // breadcrumb
  const crumbHtml = [
    `<span class="tn-crumb root" onclick="navJumpCrumb(-1)">root</span>`,
    ...crumbEnts.map((e, i) =>
      `<span class="tn-csep">›</span><span class="tn-crumb ${i===crumbEnts.length-1&&!tagNav.nodeId?'active':''}" onclick="navJumpCrumb(${i})">${e.name}</span>`)
  ].join('') + (selEnt ? `<span class="tn-csep">›</span><span class="tn-crumb active">${selEnt.name}</span>` : '');

  // level nodes
  const nodesHtml = nodes.map(e => {
    const c    = Counts.forNode(e.id);
    const k    = navKids(e.id).length;
    const sel  = tagNav.nodeId === e.id;
    const dead = c.total === 0; // stale — no algorithms anywhere in subtree
    return `
      <div class="tn-node ${sel?'sel':''} ${dead?'dead':''}" onclick="navSelect('${e.id}')"
           title="${dead ? 'No algorithms — stale topic from old data (click 🧹 to clean)' : ''}">
        <div class="tn-nname" style="${dead?'opacity:.4':''}">${e.name}</div>
        <div class="tn-nmeta">
          ${dead
            ? `<span style="font-size:10px;color:#475569">empty</span>`
            : `${c.direct ? `<span class="tn-nd">${c.direct}</span>` : ''}
               ${c.total !== c.direct ? `<span class="tn-nt">/${c.total}</span>` : ''}`
          }
          ${k && !dead ? `<span class="tn-nk">⊕${k}</span>` : ''}
        </div>
      </div>`;
  }).join('') || `<div class="tn-empty">No topics at this level.</div>`;

  // problems list
  let probsHtml = '';
  if (selEnt) {
    const direct = Counts.directAlgos(tagNav.nodeId).length;
    const total  = Counts.forNode(tagNav.nodeId).total;

    // Auto-expand to subtree when no direct problems but subtree has some
    const effectiveShowAll = tagNav.showAll || (direct === 0 && total > 0);
    const algos = effectiveShowAll
      ? Counts.allAlgosIn(tagNav.nodeId).map(x => x.algo)
      : Counts.directAlgos(tagNav.nodeId);

    const probCards = algos.map(a => {
      // All topics this algo ASSOCIATES to → multiple perspectives
      const assocTopics = Store.relations
        .filter(r => r.from_id === a.id && r.rel_type === 'ASSOCIATES')
        .map(r => Store.getEntity(r.to_id)).filter(Boolean);

      // Full :: tag paths this problem is classified under
      const tagPaths = [...new Set(assocTopics.map(t => TagPath.pathOf(t.id)).filter(Boolean))];

      // LeetCode flat topics
      const lcTopics = (a.tags||'').split(',').filter(Boolean).slice(0, 6)
        .map(t => `<span class="tag-chip">${t.replace(/_/g,' ')}</span>`).join('');

      // Sibling perspective nodes (other topics this algo also lives in)
      const otherNodes = assocTopics
        .filter(t => t.id !== tagNav.nodeId)
        .slice(0, 5)
        .map(t => `<span class="tn-tagpath" title="${TagPath.pathOf(t.id)}">${t.name}</span>`).join('');

      return `
        <div class="tn-prob" onclick="showProblemModal('${a.id}')" style="cursor:pointer" title="Click for full details">
          <div class="tn-phd">
            <span class="tn-pname">${a.name}</span>
            ${a.difficulty?`<span class="badge b-${a.difficulty.toLowerCase()}">${a.difficulty}</span>`:''}
            ${a.source?`<span class="tn-psrc">#${a.source}</span>`:''}
          </div>
          <div class="tn-persp">
            ${tagPaths.length ? `
              <div class="tn-persp-row">
                <span class="tn-plbl">Tag path</span>
                <div class="tn-ptags">${tagPaths.map(p=>`<span class="tn-tagpath">${p}</span>`).join('')}</div>
              </div>` : ''}
            ${otherNodes ? `
              <div class="tn-persp-row">
                <span class="tn-plbl">Also in</span>
                <div class="tn-ptags">${otherNodes}</div>
              </div>` : ''}
            ${lcTopics ? `
              <div class="tn-persp-row">
                <span class="tn-plbl">LC topics</span>
                <div class="tn-ptags">${lcTopics}</div>
              </div>` : ''}
          </div>
        </div>`;
    }).join('');

    const emptyMsg = total === 0
      ? `<div class="tn-empty">No problems tagged at or below <b>${selEnt.name}</b>.
           ${selKids.length ? `Try drilling in with <b>+</b> to explore ${selKids.length} subtopics.` : ''}</div>`
      : '';

    const autoNote = (direct === 0 && total > 0 && !tagNav.showAll)
      ? `<span style="font-size:10px;color:var(--warn)">↓ auto-expanded (0 direct)</span>` : '';

    const toggleLabel = effectiveShowAll
      ? `Direct only (${direct})`
      : `All in subtree (${total})`;

    probsHtml = `
      <div class="tn-section" id="tn-prob-section">
        <div class="tn-stitle">
          Problems at <b>${selEnt.name}</b>
          <span style="color:var(--mt);font-size:11px">${algos.length} shown${effectiveShowAll&&direct!==total?` (${direct} direct + ${total-direct} from subtopics)`:''}</span>
          ${autoNote}
          ${total > 0 ? `<span class="tn-toggle" onclick="tagNav.showAll=${!effectiveShowAll};renderNavigator()">${toggleLabel}</span>` : ''}
          ${popBtnHtml('#tn-prob-section', 'λ Problems · ' + selEnt.name)}
        </div>
        <div class="tn-prob-list">${probCards || emptyMsg}</div>
      </div>`;
  }

  // Count stale (dead) nodes at current level
  const deadCount = nodes.filter(e => Counts.forNode(e.id).total === 0).length;
  const staleWarn = (!parentId && deadCount > 0)
    ? `<div class="tn-stale-warn">
        ⚠ ${deadCount} topics have 0 algorithms — stale from old data format.
        These show as greyed-out with "empty". Click <b>🧹</b> to remove them all.
       </div>` : '';

  const levelLabel = parentId
    ? `Children of <b>${Store.getEntity(parentId)?.name}</b>`
    : `Root topics`;

  document.getElementById('content').innerHTML = `
    <div class="tn-wrap">
      <div class="tn-top">
        <!-- Breadcrumb + controls -->
        <div class="tn-header">
          <div class="tn-crumbs">${crumbHtml}</div>
          <div class="tn-ctrl">
            <button class="btn btn-sec btn-sm" onclick="navGoUp()" ${!parentId&&!tagNav.nodeId?'disabled':''}>− Up</button>
            <button class="btn btn-pr  btn-sm" onclick="navDrillIn()" ${!tagNav.nodeId||!selKids.length?'disabled':''}>+ Drill in${selKids.length?` (${selKids.length})`:''}</button>
            <button class="btn btn-sec btn-sm" onclick="purgeOrphanTopics()" title="Remove empty orphan topics from old data format">🧹</button>
          </div>
          <!-- Random navigation -->
          <div class="rnd-btns">
            <button class="btn btn-sec btn-sm" onclick="navRandom()"          title="Jump to a random topic">🎲 Random</button>
            <button class="btn btn-sec btn-sm" onclick="navRandom('Easy')"    style="color:var(--ok)">🎲 Easy</button>
            <button class="btn btn-sec btn-sm" onclick="navRandom('Medium')"  style="color:var(--warn)">🎲 Medium</button>
            <button class="btn btn-sec btn-sm" onclick="navRandom('Hard')"    style="color:var(--err)">🎲 Hard</button>
          </div>
        </div>

        <!-- Single search box — filters the All Topics panel below (debounced) -->
        <div class="tn-jump-wrap">
          <input class="tn-jump" id="tn-jump-inp" autocomplete="off" spellcheck="false"
            value="${tagNav.topicFilter}"
            placeholder="Search:  partition  ·  tag:array hard  ·  name:dp >5"
            title="Syntax: plain text · tag:X · name:X · easy/medium/hard · >N · space = AND"
            oninput="navSearchInput(this.value)">
          <div style="font-size:10px;color:var(--mt);margin-top:4px">
            Syntax: <code>tag:partition</code> <code>name:dp</code> <code>hard</code> <code>&gt;10</code> &nbsp;·&nbsp; space = AND
          </div>
        </div>

        <!-- Stale data warning -->
        ${staleWarn}

        <!-- All Topics flat panel -->
        ${tagNav.showTopicList ? renderTopicListPanel() : ''}

        <!-- Level nodes -->
        <div class="tn-section">
          <div class="tn-stitle">${levelLabel}
            <span style="color:var(--mt);font-weight:400">(${nodes.length - deadCount} active${deadCount?` + ${deadCount} empty`:''} — click to select · ⊕N = subtopics · d/total)</span>
          </div>
          <div class="tn-nodes">${nodesHtml}</div>
        </div>
      </div>

      <!-- Problems (scrollable body) -->
      <div class="tn-body">
        ${probsHtml}
      </div>
    </div>`;
}

// ── Jump search inside Navigator ─────────────────────────────
let _tnHits = [], _tnFocIdx = -1;

function tnJumpSearch(raw) {
  const box = document.getElementById('tn-jump-res');
  if (!box) return;
  _tnFocIdx = -1;

  if (!raw.trim()) { box.classList.remove('open'); return; }

  const filters = parseSearchTokens(raw);

  _tnHits = Store.entities
    .filter(e => ['TOPIC','DOMAIN'].includes(e.concept_type))
    .map(e => ({ ent: e, path: TagPath.pathOf(e.id) || e.tag_path || '', c: Counts.forNode(e.id) }))
    .filter(({ ent, path, c }) => topicMatches(ent, path, c, filters))
    .sort((a, b) => b.c.total - a.c.total)
    .slice(0, 40)
    .map(o => o.ent);

  box.innerHTML = _tnHits.map((e, i) => {
    const c    = Counts.forNode(e.id);
    const path = TagPath.pathOf(e.id) || e.tag_path || '';
    return `<div class="tn-jr" id="tnr-${i}" onclick="tnJumpSelect('${e.id}')">
      <span style="flex:1;font-weight:600;font-size:12px">${e.name}</span>
      ${c.total?`<span class="tn-nt" style="flex-shrink:0">${c.direct}/${c.total}</span>`:''}
      <span style="font-family:monospace;font-size:10px;color:var(--mt);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${path}</span>
    </div>`;
  }).join('') || `<div style="padding:10px;color:var(--mt);font-size:12px">No topics match "${raw}"</div>`;

  box.classList.add('open');
}

function tnJumpKey(e) {
  const items = document.querySelectorAll('.tn-jr');
  if      (e.key === 'ArrowDown')  { e.preventDefault(); _tnFocIdx = Math.min(_tnFocIdx+1, items.length-1); }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); _tnFocIdx = Math.max(_tnFocIdx-1, 0); }
  else if (e.key === 'Enter')      { e.preventDefault(); if (_tnFocIdx>=0 && _tnHits[_tnFocIdx]) tnJumpSelect(_tnHits[_tnFocIdx].id); else if (_tnHits.length===1) tnJumpSelect(_tnHits[0].id); }
  else if (e.key === 'Escape')     { document.getElementById('tn-jump-res')?.classList.remove('open'); }
  items.forEach((el,i) => el.classList.toggle('focused', i===_tnFocIdx));
  items[_tnFocIdx]?.scrollIntoView({block:'nearest'});
}

function tnJumpSelect(id) {
  const inp = document.getElementById('tn-jump-inp');
  if (inp) inp.value = '';
  document.getElementById('tn-jump-res')?.classList.remove('open');
  navJumpTo(id);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.tn-jump-wrap')) document.getElementById('tn-jump-res')?.classList.remove('open');
});

// ══════════════════════════════════════════════════════════════
// ROOT NODE SEARCH
// Supports prefix filters:
//   topic:   → TOPIC entities only
//   algo:    → ALGORITHM entities only
//   easy:    medium:  hard:  → by difficulty
//   tag:     → filter by tag_path
//   #131     → filter by problem number
//   (plain)  → name match across all types
// ══════════════════════════════════════════════════════════════
let _rootTimer  = null;
let _rootFocIdx = -1;
let _rootHits   = [];

const TYPE_ICONS = { TOPIC:'⊞', ALGORITHM:'λ', DOMAIN:'◈', OBJECT:'○', SKILL:'⚡', IDEA:'💡', FACT:'·' };

function rootSearch(raw) {
  clearTimeout(_rootTimer);
  _rootTimer = setTimeout(() => _doRootSearch(raw), 120);
}

function _doRootSearch(raw) {
  const box = document.getElementById('root-results');
  if (!box) return;
  _rootFocIdx = -1;

  const q = raw.trim();

  // Close if empty and no current root
  if (!q) {
    box.classList.remove('open');
    _rootHits = [];
    return;
  }

  // ── Parse prefix filters ─────────────────────────────────
  let typeFilter = null, diffFilter = null, tagFilter = null, numFilter = null, nameQ = q.toLowerCase();

  if      (q.match(/^topic:/i))     { typeFilter = 'TOPIC';     nameQ = q.slice(6).trim().toLowerCase(); }
  else if (q.match(/^algo:/i))      { typeFilter = 'ALGORITHM'; nameQ = q.slice(5).trim().toLowerCase(); }
  else if (q.match(/^easy:/i))      { diffFilter = 'Easy';      nameQ = q.slice(5).trim().toLowerCase(); }
  else if (q.match(/^medium:/i))    { diffFilter = 'Medium';    nameQ = q.slice(7).trim().toLowerCase(); }
  else if (q.match(/^hard:/i))      { diffFilter = 'Hard';      nameQ = q.slice(5).trim().toLowerCase(); }
  else if (q.match(/^tag:/i))       { tagFilter  = q.slice(4).trim().toLowerCase(); nameQ = ''; }
  else if (q.match(/^#\d+/))        { numFilter  = q.slice(1);  nameQ = ''; }
  else if (q.match(/^\d+$/))        { numFilter  = q; nameQ = ''; }
  // convenience: bare keyword shortcuts
  else if (nameQ === 'topic')       { typeFilter = 'TOPIC';     nameQ = ''; }
  else if (nameQ === 'algorithm' || nameQ === 'algo') { typeFilter = 'ALGORITHM'; nameQ = ''; }
  else if (nameQ === 'easy')        { diffFilter = 'Easy';      nameQ = ''; }
  else if (nameQ === 'medium')      { diffFilter = 'Medium';    nameQ = ''; }
  else if (nameQ === 'hard')        { diffFilter = 'Hard';      nameQ = ''; }

  // ── Filter entities ───────────────────────────────────────
  _rootHits = Store.entities.filter(e => {
    if (typeFilter && e.concept_type !== typeFilter)                     return false;
    if (diffFilter && e.difficulty  !== diffFilter)                      return false;
    if (tagFilter  && !(e.tag_path||'').toLowerCase().includes(tagFilter)) return false;
    if (numFilter  && (e.source||'') !== numFilter)                      return false;
    if (!nameQ)                                                           return true;
    return (e.name      || '').toLowerCase().includes(nameQ)
        || (e.tag_path  || '').toLowerCase().includes(nameQ)
        || (e.source    || '').toLowerCase().includes(nameQ)
        || (e.concept_type||'').toLowerCase().includes(nameQ);
  });

  // ── Sort: Topics first, then by name ────────────────────
  _rootHits.sort((a, b) => {
    const ta = a.concept_type === 'TOPIC' ? 0 : 1;
    const tb = b.concept_type === 'TOPIC' ? 0 : 1;
    if (ta !== tb) return ta - tb;
    return a.name.localeCompare(b.name);
  });

  const total  = _rootHits.length;
  _rootHits    = _rootHits.slice(0, 60); // cap display at 60

  // ── Group and render ─────────────────────────────────────
  let html = '';
  let lastType = null;
  _rootHits.forEach((e, i) => {
    if (e.concept_type !== lastType) {
      html += `<div class="sri-grp">${e.concept_type}</div>`;
      lastType = e.concept_type;
    }
    const icon    = TYPE_ICONS[e.concept_type] || '·';
    const nameHl  = _hl(e.name, nameQ);
    const pathHl  = tagFilter ? _hl(e.tag_path || '', tagFilter) : (e.tag_path || '');
    const diffBdg = e.difficulty ? `<span class="badge b-${e.difficulty.toLowerCase()} sri-diff">${e.difficulty}</span>` : '';
    const srcTxt  = e.source     ? `<span style="color:var(--mt);font-size:10px;flex-shrink:0">#${e.source}</span>` : '';
    html += `<div class="sri" id="sri-${i}" onclick="selectRootNode('${e.id}')">
      <span style="flex-shrink:0;font-size:11px;color:var(--mt)">${icon}</span>
      <span class="sri-name">${nameHl}</span>
      ${srcTxt}
      ${pathHl ? `<span class="sri-path" title="${e.tag_path||''}">${pathHl}</span>` : ''}
      ${diffBdg}
    </div>`;
  });

  if (!_rootHits.length) {
    html = `<div style="padding:12px;color:var(--mt);font-size:12px">No matches for "${q}"</div>`;
  } else if (total > 60) {
    html += `<div class="sri-grp">+${total - 60} more — refine your search</div>`;
  }

  box.innerHTML = html;
  box.classList.add('open');
}

// Highlight matched substring
function _hl(text, q) {
  if (!q || !text) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx)
    + `<b style="color:var(--pr)">${text.slice(idx, idx + q.length)}</b>`
    + text.slice(idx + q.length);
}

// Keyboard navigation: ↑ ↓ Enter Escape
function rootKeyNav(e) {
  const items = document.querySelectorAll('.sri');
  if      (e.key === 'ArrowDown')  { e.preventDefault(); _rootFocIdx = Math.min(_rootFocIdx + 1, items.length - 1); }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); _rootFocIdx = Math.max(_rootFocIdx - 1, 0); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (_rootFocIdx >= 0 && _rootHits[_rootFocIdx]) selectRootNode(_rootHits[_rootFocIdx].id);
    else if (_rootHits.length === 1) selectRootNode(_rootHits[0].id);
  }
  else if (e.key === 'Escape') {
    document.getElementById('root-results')?.classList.remove('open');
  }
  items.forEach((el, i) => el.classList.toggle('focused', i === _rootFocIdx));
  items[_rootFocIdx]?.scrollIntoView({ block: 'nearest' });
}

// ══════════════════════════════════════════════════════════════
// 🪟 WINDOW SYSTEM — popout / drag / resize / maximize / minimize
// Any section can opt in via a ⛶ button calling Win.popout(el, title)
// ══════════════════════════════════════════════════════════════
const Win = {
  drag: null,
  zMax: 500,

  popout(el, title) {
    if (!el) return;
    if (el.classList.contains('w-float')) { this.front(el); return; }

    const r = el.getBoundingClientRect();
    el.classList.add('w-float');
    el.style.position = 'fixed';
    el.style.left   = Math.max(10, r.left) + 'px';
    el.style.top    = Math.max(10, r.top) + 'px';
    el.style.width  = Math.min(Math.max(r.width  || 380, 300), 800) + 'px';
    el.style.height = Math.min(Math.max(r.height || 320, 200), 700) + 'px';

    // Inject window title bar
    const bar = document.createElement('div');
    bar.className = 'w-bar';
    bar.innerHTML = `
      <span class="w-title">${title || '◇ Window'}</span>
      <span class="w-btns">
        <button class="w-btn" title="Minimize" onclick="event.stopPropagation();Win.toggleMin(this.closest('.w-float'))">▁</button>
        <button class="w-btn" title="Maximize" onclick="event.stopPropagation();Win.toggleMax(this.closest('.w-float'))">▢</button>
        <button class="w-btn" title="Re-dock"  onclick="event.stopPropagation();Win.dock(this.closest('.w-float'))">×</button>
      </span>
    `;
    el.insertBefore(bar, el.firstChild);

    bar.addEventListener('mousedown', e => {
      if (e.target.tagName === 'BUTTON') return;
      const rect = el.getBoundingClientRect();
      this.drag = { el, ox: e.clientX - rect.left, oy: e.clientY - rect.top };
      this.front(el);
    });

    this.front(el);
  },

  front(el)       { el.style.zIndex = ++this.zMax; },
  toggleMin(el)   { el.classList.toggle('w-min'); },
  toggleMax(el)   { el.classList.toggle('w-max'); },
  dock(el) {
    el.classList.remove('w-float','w-min','w-max');
    ['position','left','top','width','height','zIndex'].forEach(p => el.style[p] = '');
    el.querySelector(':scope > .w-bar')?.remove();
  },
};

document.addEventListener('mousemove', e => {
  if (!Win.drag) return;
  const el = Win.drag.el;
  el.style.left = Math.max(0, Math.min(window.innerWidth  - 100, e.clientX - Win.drag.ox)) + 'px';
  el.style.top  = Math.max(0, Math.min(window.innerHeight - 40,  e.clientY - Win.drag.oy)) + 'px';
});
document.addEventListener('mouseup', () => { Win.drag = null; });

// Helper: small "⛶" trigger button HTML for a section header
function popBtnHtml(selector, title) {
  return `<button class="pop-trigger" title="Pop out as floating window"
    onclick="event.stopPropagation();Win.popout(document.querySelector('${selector}'), '${title}')">⛶</button>`;
}

// ══════════════════════════════════════════════════════════════
// ✦ SIMILAR PROBLEMS  —  brand-new similarity-based lineage
//
// Pick a problem → see all problems sharing topics/tags, ranked by:
//   1. Depth of shared topic path (deeper = more specific = higher score)
//   2. Depth of shared user-tag path
//   3. Same difficulty bonus (Easy/Medium/Hard)
//
// Visual: concentric rings (closer = higher score)
//         color = difficulty · size = score · click = recenter
// ══════════════════════════════════════════════════════════════
const simState = {
  rootId: '', search: '',
  diffFilter: { Easy:true, Medium:true, Hard:true },
  limit: 120,
  scoreMode: 'balanced',
  layout:    'rings',
  level:     'all'         // 'all' | '1' | '2' | '3' | '1-2' | '1-3' | '2-3'
};

// Neighbor level → rank window (inclusive start, exclusive end)
const SIM_LEVELS = {
  '1':   { range: [0,   8],  label: 'Level 1 — closest 8' },
  '2':   { range: [8,  24],  label: 'Level 2 — next 16' },
  '3':   { range: [24, 56],  label: 'Level 3 — next 32' },
  '4':   { range: [56,120],  label: 'Level 4 — next 64' },
  '1-2': { range: [0,  24],  label: 'Levels 1-2 — closest 24' },
  '1-3': { range: [0,  56],  label: 'Levels 1-3 — closest 56' },
  '2-3': { range: [8,  56],  label: 'Levels 2-3 — outer 48' },
  'all': { range: null,      label: 'All neighbors' }
};

// Scoring weight presets — pick one to change what "close" means
const SIM_SCORE_MODES = {
  balanced:   { topic: 1.0, tag: 1.5, diff: 5,  label: 'Balanced (default)' },
  topic:      { topic: 3.0, tag: 0.5, diff: 2,  label: 'Topic match focus' },
  tag:        { topic: 0.5, tag: 3.0, diff: 2,  label: 'Tag (custom) focus' },
  difficulty: { topic: 0.5, tag: 0.5, diff:10, label: 'Difficulty focus' },
};

// Get all topic IDs an algorithm directly associates to
function _algoTopics(algoId) {
  return Store.relations
    .filter(r => r.from_id === algoId && r.rel_type === 'ASSOCIATES')
    .map(r => r.to_id);
}

// Depth of a topic from its root (root = 0, child = 1, grandchild = 2...)
const _depthCache = new Map();
function _topicDepth(topicId) {
  if (_depthCache.has(topicId)) return _depthCache.get(topicId);
  let depth = 0, cur = topicId; const seen = new Set();
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    const up = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
    if (!up) break;
    cur = up.to_id; depth++;
  }
  _depthCache.set(topicId, depth);
  return depth;
}

// Compute similarity score for all candidate algorithms vs the selected one.
// Score breakdown: topicMatchDepth + tagMatchDepth + sameDiffBonus
function computeSimilarity(selectedId) {
  const selected = Store.getEntity(selectedId);
  if (!selected) return [];

  const myTopics = _algoTopics(selectedId);
  if (!myTopics.length) return [];

  // Candidate set: all algos sharing ANY topic with selected (direct + subtree)
  const candidates = new Map(); // id → { algo, topicDepth, tagDepth, sameDiff }

  myTopics.forEach(myT => {
    // Direct algos to this topic (covers the 214 problems case)
    Counts.directAlgos(myT).forEach(a => {
      if (a.id === selectedId) return;
      const myT_depth = _topicDepth(myT);
      const myT_id    = myT;
      const isTagPath = (myT_id || '').startsWith('tp__');     // user tag (starts with _)
      const c = candidates.get(a.id) || { algo: a, topicDepth: 0, tagDepth: 0, sharedTopics: [] };
      if (isTagPath) c.tagDepth   = Math.max(c.tagDepth,   myT_depth + 1);
      else            c.topicDepth = Math.max(c.topicDepth, myT_depth + 1);
      c.sharedTopics.push(myT_id);
      candidates.set(a.id, c);
    });
  });

  // Score & rank
  const selDiff = selected.difficulty || '';
  const results = [...candidates.values()].map(c => {
    const sameDiff = (c.algo.difficulty === selDiff) ? 1 : 0;
    // Score formula: topic depth + tag depth (heavier) + 5 if same difficulty
    const w = SIM_SCORE_MODES[simState.scoreMode] || SIM_SCORE_MODES.balanced;
    const total = (c.topicDepth * w.topic) + (c.tagDepth * w.tag) + (sameDiff * w.diff);
    return { ...c, sameDiff, total };
  });

  results.sort((a, b) => b.total - a.total);
  return results;
}

function simRender() {

  simDrawGraph(selected, ranked);
}

// Pan/zoom state per render — persists across re-renders so layout switch keeps view
const _simView = { tx: { x:0, y:0, s:1 }, pan: null };

function simDrawGraph(selected, ranked) {
  const ct = document.getElementById('sim-graph');
  const NS = 'http://www.w3.org/2000/svg';
  const W = ct.clientWidth || 800, H = ct.clientHeight || 600;
  const cx = W / 2, cy = H / 2;

  ct.querySelectorAll('svg, .sim-graph-ctrl').forEach(s => s.remove());

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.cssText = 'cursor:grab;display:block';
  ct.appendChild(svg);

  // ── pan/zoom: wrap everything in a transform group ──
  const root = document.createElementNS(NS, 'g');
  svg.appendChild(root);
  const applyTx = () => root.setAttribute('transform',
    `translate(${_simView.tx.x},${_simView.tx.y}) scale(${_simView.tx.s})`);
  applyTx();

  // Pan: drag the background
  svg.addEventListener('mousedown', e => {
    if (e.target === svg || e.target === root) {
      _simView.pan = { sx: e.clientX - _simView.tx.x, sy: e.clientY - _simView.tx.y };
      svg.style.cursor = 'grabbing';
    }
  });
  const onMove = e => {
    // Node drag takes priority over pan
    if (_simView.drag) {
      const dx = (e.clientX - _simView.drag.startCX) / _simView.tx.s;
      const dy = (e.clientY - _simView.drag.startCY) / _simView.tx.s;
      const newX = _simView.drag.origX + dx;
      const newY = _simView.drag.origY + dy;
      // Move the dragged group via transform offset
      _simView.drag.nodeG.setAttribute('transform', `translate(${newX - _simView.drag.origX}, ${newY - _simView.drag.origY})`);

      if (_simView.drag.isCenter) {
        // Center moves → update every spoke's start endpoint (x1, y1) to track the hub
        document.querySelectorAll('.sim-spoke').forEach(spoke => {
          spoke.setAttribute('x1', newX);
          spoke.setAttribute('y1', newY);
        });
      } else if (_simView.drag.spoke) {
        // Neighbor drag → update its spoke's end endpoint (x2, y2)
        _simView.drag.spoke.setAttribute('x2', newX);
        _simView.drag.spoke.setAttribute('y2', newY);
      }

      _simView.drag.newX = newX; _simView.drag.newY = newY;
      _simView.drag.dragged = true;
      return;
    }
    if (!_simView.pan) return;
    _simView.tx.x = e.clientX - _simView.pan.sx;
    _simView.tx.y = e.clientY - _simView.pan.sy;
    applyTx();
  };
  const onUp = () => {
    // Commit node drag to positioned cache so re-renders preserve it
    if (_simView.drag?.dragged && _simView.positioned) {
      const idx = _simView.positioned.findIndex(p => p.cand.algo.id === _simView.drag.algoId);
      if (idx >= 0 && _simView.drag.newX !== undefined) {
        _simView.positioned[idx].x = _simView.drag.newX;
        _simView.positioned[idx].y = _simView.drag.newY;
      }
      // Suppress the click that fires after a drag-mouseup
      _simView._lastDragged = _simView.drag.algoId;
    }
    _simView.drag = null;
    _simView.pan = null;
    svg.style.cursor = 'grab';
  };
  // Avoid stacking duplicate window listeners on re-render
  if (_simView._mm) window.removeEventListener('mousemove', _simView._mm);
  if (_simView._mu) window.removeEventListener('mouseup',   _simView._mu);
  _simView._mm = onMove; _simView._mu = onUp;
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);

  // Zoom via wheel
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.15 : 0.87;
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    _simView.tx.x = mx - (mx - _simView.tx.x) * f;
    _simView.tx.y = my - (my - _simView.tx.y) * f;
    _simView.tx.s = Math.min(4, Math.max(0.15, _simView.tx.s * f));
    applyTx();
  }, { passive: false });

  // ── Compute positions per layout ──
  let positioned;
  switch (simState.layout) {
    case 'spiral':  positioned = simPosSpiral(ranked, cx, cy, W, H);  break;
    case 'cluster': positioned = simPosCluster(ranked, cx, cy, W, H); break;
    case 'force':   positioned = simPosForce(ranked, cx, cy, W, H);   break;
    case 'grid':    positioned = simPosGrid(ranked, cx, cy, W, H);    break;
    case 'tree-lr': positioned = simPosTreeLR(ranked, cx, cy, W, H);  break;
    case 'rings':
    default:        positioned = simPosRings(ranked, cx, cy, W, H, root, NS);
  }

  // Draw spokes + nodes into the pan/zoom group
  positioned.forEach(({ cand, x, y }) => simDrawNode(root, NS, cand, x, y, cx, cy));

  // Center node — selected problem
  const sColor = DIFF_COLOR[selected.difficulty] || '#3b82f6';
  const centerG = document.createElementNS(NS, 'g');
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', '34');
  ring.setAttribute('fill', sColor); ring.setAttribute('fill-opacity', '0.2');
  ring.setAttribute('stroke', sColor); ring.setAttribute('stroke-width', '3');
  centerG.appendChild(ring);
  const cTxt = document.createElementNS(NS, 'text');
  cTxt.setAttribute('x', cx); cTxt.setAttribute('y', cy - 2);
  cTxt.setAttribute('text-anchor', 'middle'); cTxt.setAttribute('dominant-baseline', 'middle');
  cTxt.setAttribute('fill', '#fff'); cTxt.setAttribute('font-size', '11'); cTxt.setAttribute('font-weight', '700');
  cTxt.textContent = selected.name.length > 14 ? selected.name.slice(0,12) + '…' : selected.name;
  centerG.appendChild(cTxt);
  if (selected.source) {
    const cSrc = document.createElementNS(NS, 'text');
    cSrc.setAttribute('x', cx); cSrc.setAttribute('y', cy + 11);
    cSrc.setAttribute('text-anchor', 'middle'); cSrc.setAttribute('fill', '#fff');
    cSrc.setAttribute('font-size', '9'); cSrc.setAttribute('opacity', '0.7');
    cSrc.textContent = `#${selected.source}`;
    centerG.appendChild(cSrc);
  }
  // Center goes inside the pan/zoom group too
  centerG.style.cursor = 'move';
  centerG.setAttribute('class', 'sim-center');
  root.appendChild(centerG);

  // Center drag — moves the whole hub. All spokes (tagged .sim-spoke) update their x1/y1 to follow.
  centerG.addEventListener('mousedown', e => {
    e.stopPropagation();
    _simView.drag = {
      isCenter: true,
      nodeG:  centerG,
      startCX: e.clientX, startCY: e.clientY,
      origX: cx, origY: cy,
      newX:  cx, newY:  cy,
      dragged: false
    };
    simHideTip();
  });
  centerG.addEventListener('dblclick', e => {
    e.stopPropagation();
    showProblemModal(selected.id);
  });

  // ── Zoom / fit controls (bottom-right of the graph) ──
  const ctrl = document.createElement('div');
  ctrl.className = 'sim-graph-ctrl';
  ctrl.innerHTML = `
    <button class="g-btn" onclick="simZoom(1.2)"  title="Zoom in">+</button>
    <button class="g-btn" onclick="simZoom(0.85)" title="Zoom out">−</button>
    <button class="g-btn" onclick="simFit()"      title="Fit all to view">⤢</button>
    <button class="g-btn" onclick="simResetView()" title="Reset zoom/pan">⊙</button>
  `;
  ct.appendChild(ctrl);

  // Stash positioned data + applyTx for zoom buttons
  _simView.applyTx = applyTx;
  _simView.positioned = positioned;
  _simView.W = W; _simView.H = H;

  // Auto-fit on initial layout render
  setTimeout(() => simFit(), 0);
}

function simZoom(f) {
  const cx = _simView.W / 2, cy = _simView.H / 2;
  _simView.tx.x = cx - (cx - _simView.tx.x) * f;
  _simView.tx.y = cy - (cy - _simView.tx.y) * f;
  _simView.tx.s = Math.min(4, Math.max(0.15, _simView.tx.s * f));
  _simView.applyTx?.();
}
function simResetView() {
  _simView.tx = { x:0, y:0, s:1 };
  _simView.applyTx?.();
}
function simFit() {
  const pos = _simView.positioned || [];
  if (!pos.length) return;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  pos.forEach(p => {
    if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  });
  // Include center
  const cx = _simView.W/2, cy = _simView.H/2;
  minX = Math.min(minX, cx); maxX = Math.max(maxX, cx);
  minY = Math.min(minY, cy); maxY = Math.max(maxY, cy);
  const w = (maxX - minX) || 1, h = (maxY - minY) || 1;
  const pad = 80;
  const scale = Math.min((_simView.W - 2*pad) / w, (_simView.H - 2*pad) / h, 2);
  _simView.tx.s = Math.max(0.2, scale);
  _simView.tx.x = _simView.W/2 - (minX + w/2) * _simView.tx.s;
  _simView.tx.y = _simView.H/2 - (minY + h/2) * _simView.tx.s;
  _simView.applyTx?.();
}

// ── Layout: Grid (compact rows/cols by rank) ──
function simPosGrid(ranked, cx, cy, W, H) {
  const N = ranked.length;
  if (!N) return [];
  const cellW = 150, cellH = 56;
  const cols = Math.max(1, Math.floor((W - 80) / cellW));
  const rows = Math.ceil(N / cols);
  const startX = cx - (cols * cellW) / 2 + cellW / 2;
  const startY = cy - (rows * cellH) / 2 + cellH / 2;
  return ranked.map((cand, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    return { cand, x: startX + col * cellW, y: startY + row * cellH };
  });
}

// ── Layout: Tree LR (selected on left, score-tiered columns to the right) ──
function simPosTreeLR(ranked, cx, cy, W, H) {
  const TIERS = [5, 10, 20, 40, 80, 160];
  const tiers = [];
  let cursor = 0;
  TIERS.forEach(sz => {
    if (cursor >= ranked.length) return;
    tiers.push(ranked.slice(cursor, cursor + sz));
    cursor += sz;
  });
  if (cursor < ranked.length) tiers.push(ranked.slice(cursor));
  const colW = 180;
  const out = [];
  tiers.forEach((items, ti) => {
    const x = 130 + (ti + 1) * colW;
    const yStep = Math.min(58, Math.max(30, (H - 120) / Math.max(items.length, 1)));
    const totalH = items.length * yStep;
    const startY = cy - totalH / 2 + yStep / 2;
    items.forEach((cand, i) => {
      out.push({ cand, x, y: startY + i * yStep });
    });
  });
  return out;
}

// ── Layout: Concentric Rings (default) ──
function simPosRings(ranked, cx, cy, W, H, svg, NS) {
  const RING_SIZES = [8, 16, 32, 60, 120];
  const rings = [];
  let cursor = 0;
  RING_SIZES.forEach(sz => {
    if (cursor >= ranked.length) return;
    rings.push(ranked.slice(cursor, cursor + sz));
    cursor += sz;
  });
  if (cursor < ranked.length) rings.push(ranked.slice(cursor));
  const maxR  = Math.min(W, H) * 0.42;
  const ringR = rings.length ? rings.map((_, i) => (i + 1) * (maxR / rings.length)) : [];
  ringR.forEach(r => {
    const g = document.createElementNS(NS, 'circle');
    g.setAttribute('cx', cx); g.setAttribute('cy', cy); g.setAttribute('r', r);
    g.setAttribute('fill', 'none'); g.setAttribute('stroke', 'rgba(255,255,255,.05)');
    g.setAttribute('stroke-dasharray', '3,4');
    svg.appendChild(g);
  });
  const out = [];
  rings.forEach((items, ringIdx) => {
    const r = ringR[ringIdx];
    items.forEach((cand, i) => {
      const angle = (i / items.length) * 2 * Math.PI - Math.PI / 2;
      out.push({ cand, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    });
  });
  return out;
}

// ── Layout: Spiral (continuous score-ordered curve) ──
function simPosSpiral(ranked, cx, cy, W, H) {
  const maxR = Math.min(W, H) * 0.42;
  const minR = 70;
  const N = ranked.length;
  const ANG_STEP = 0.45; // radians between consecutive nodes
  return ranked.map((cand, i) => {
    const t = i / Math.max(N - 1, 1);
    const r = minR + (maxR - minR) * t;
    const a = i * ANG_STEP - Math.PI / 2;
    return { cand, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });
}

// ── Layout: Cluster by difficulty (3 sectors) ──
function simPosCluster(ranked, cx, cy, W, H) {
  // Sectors: Easy = top, Medium = bottom-left, Hard = bottom-right
  const sectors = { Easy: -Math.PI/2, Medium: Math.PI*5/6, Hard: Math.PI/6, '': 0 };
  const groups = { Easy:[], Medium:[], Hard:[], '':[] };
  ranked.forEach(r => { (groups[r.algo.difficulty] || groups['']).push(r); });
  const maxR = Math.min(W, H) * 0.42;
  const out = [];
  Object.entries(groups).forEach(([diff, items]) => {
    if (!items.length) return;
    const centerAngle = sectors[diff] ?? 0;
    items.forEach((cand, i) => {
      const ringSize = 12;
      const ringIdx = Math.floor(i / ringSize);
      const rings = Math.ceil(items.length / ringSize);
      const r = 90 + (rings === 1 ? 0 : (maxR - 90) * (ringIdx / Math.max(rings - 1, 1)));
      const arc = Math.PI * 0.55;  // each sector spans ~100°
      const idxInRing = i % ringSize;
      const ringItems = Math.min(ringSize, items.length - ringIdx * ringSize);
      const a = centerAngle + ((idxInRing / Math.max(ringItems - 1, 1)) - 0.5) * arc;
      out.push({ cand, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    });
  });
  return out;
}

// ── Layout: Force-directed with spring-length = inverse score ──
function simPosForce(ranked, cx, cy, W, H) {
  const N = ranked.length;
  if (!N) return [];
  const maxScore = Math.max(...ranked.map(r => r.total)) || 1;
  // Initial positions on a circle
  const nodes = ranked.map((cand, i) => {
    const a = (i / N) * 2 * Math.PI;
    const r = 200;
    return { cand, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), vx: 0, vy: 0 };
  });
  // Run ~150 ticks of simulation
  const DAMP = 0.85, REP = 1800;
  const idealR = (cand) => {
    // Higher score → shorter spring (closer to center)
    const norm = cand.total / maxScore;
    return 80 + (1 - norm) * (Math.min(W, H) * 0.35);
  };
  for (let tick = 0; tick < 150; tick++) {
    // Mutual repulsion
    for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = REP / (d * d);
      const fx = f * dx/d, fy = f * dy/d;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    // Spring to center at ideal radius
    nodes.forEach(n => {
      const dx = cx - n.x, dy = cy - n.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const ir = idealR(n.cand);
      const f = (d - ir) * 0.05;
      n.vx += f * dx/d; n.vy += f * dy/d;
      n.vx *= DAMP; n.vy *= DAMP;
      n.x += n.vx; n.y += n.vy;
      if (!Number.isFinite(n.x)) { n.x = cx; n.vx = 0; }
      if (!Number.isFinite(n.y)) { n.y = cy; n.vy = 0; }
    });
  }
  return nodes.map(n => ({ cand: n.cand, x: n.x, y: n.y }));
}

// ── Draw a single neighbor node + its spoke to center ──
// Lineage-style: bigger circle, source # inside, name + difficulty below,
// score badge top-right, info icon top-left with custom tooltip on hover.
function simDrawNode(parent, NS, cand, x, y, cx, cy) {
  const color  = DIFF_COLOR[cand.algo.difficulty] || '#6b7280';
  const nodeR  = 22;
  const isSame = cand.sameDiff;

  // Spoke from center — tagged so center-drag can update all of them

  line.setAttribute('x2', x);  line.setAttribute('y2', y);

  line.setAttribute('opacity', isSame ? '0.35' : '0.1');

  c.setAttribute('stroke', color); c.setAttribute('stroke-width', isSame ? '3' : '2');

  // Source # inside — main identifier

  src.setAttribute('pointer-events', 'none');
  src.textContent = cand.algo.source ? `#${cand.algo.source}` : '?';
  g.appendChild(src);

  // Score badge — top-right colored bubble
  const sX = x + nodeR - 2, sY = y - nodeR + 2;

  sBg.setAttribute('cx', sX); sBg.setAttribute('cy', sY); sBg.setAttribute('r', '10');
  sBg.setAttribute('fill', '#3b82f6'); sBg.setAttribute('stroke', '#0f172a'); sBg.setAttribute('stroke-width', '1.5');
  g.appendChild(sBg);

  sTxt.setAttribute('x', sX); sTxt.setAttribute('y', sY + 0.5);
  sTxt.setAttribute('text-anchor', 'middle'); sTxt.setAttribute('dominant-baseline', 'middle');
  sTxt.setAttribute('fill', 'white'); sTxt.setAttribute('font-size', '9'); sTxt.setAttribute('font-weight', '700');
  sTxt.setAttribute('pointer-events', 'none');
  sTxt.textContent = cand.total.toFixed(0);
  g.appendChild(sTxt);

  // ⓘ Info icon — top-left
  const iX = x - nodeR + 2, iY = y - nodeR + 2;
  const iBg = document.createElementNS(NS, 'circle');
  iBg.setAttribute('cx', iX); iBg.setAttribute('cy', iY); iBg.setAttribute('r', '7');
  iBg.setAttribute('fill', '#475569'); iBg.setAttribute('stroke', '#0f172a'); iBg.setAttribute('stroke-width', '1');
  g.appendChild(iBg);
  const iTxt = document.createElementNS(NS, 'text');
  iTxt.setAttribute('x', iX); iTxt.setAttribute('y', iY + 0.5);
  iTxt.setAttribute('text-anchor', 'middle'); iTxt.setAttribute('dominant-baseline', 'middle');
  iTxt.setAttribute('fill', '#e2e8f0'); iTxt.setAttribute('font-size', '10'); iTxt.setAttribute('font-style', 'italic');
  iTxt.setAttribute('font-family', 'serif'); iTxt.setAttribute('pointer-events', 'none');
  iTxt.textContent = 'i';
  g.appendChild(iTxt);

  // Name below circle
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y + nodeR + 14);

  t.setAttribute('font-size', '11'); t.setAttribute('font-weight', '600');

  g.appendChild(t);

  // Difficulty below name
  if (cand.algo.difficulty) {
    const d = document.createElementNS(NS, 'text');

  // Click vs drag: only fire click if the node didn't move
  g.addEventListener('click', e => {
    if (_simView._lastDragged === cand.algo.id) { _simView._lastDragged = null; return; }
    simSetRoot(cand.algo.id);
  });
  g.addEventListener('dblclick', e => {
    if (_simView._lastDragged === cand.algo.id) { _simView._lastDragged = null; return; }
    showProblemModal(cand.algo.id);
  });

  parent.appendChild(g);
}

// ── Rich hover tooltip explaining score calculation ──
function simShowTip(cand) {
  let tip = document.getElementById('sim-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'sim-tip';
    tip.className = 'sim-tip';
    document.body.appendChild(tip);
  }
  const w = SIM_SCORE_MODES[simState.scoreMode] || SIM_SCORE_MODES.balanced;
  const selected = Store.getEntity(simState.rootId);
  const topicContrib = (cand.topicDepth * w.topic).toFixed(1);
  const tagContrib   = (cand.tagDepth   * w.tag).toFixed(1);
  const diffContrib  = cand.sameDiff ? w.diff : 0;

  // Split shared things into LC Topics (id starts with "tp_" but NOT "tp__")
  // vs user Tags (id starts with "tp__" — the double underscore from "_ds", "_sols", etc.)
  const shared = (cand.sharedTopics || [])
    .map(id => ({ id, ent: Store.getEntity(id) }))
    .filter(x => x.ent);
  const lcTopics = shared.filter(x => !x.id.startsWith('tp__'));
  const userTags = shared.filter(x =>  x.id.startsWith('tp__'));

  const renderChips = (arr, max, color, bg) => {
    const head = arr.slice(0, max).map(x =>
      `<span class="tag-chip" title="${x.ent.tag_path || x.ent.name}" style="background:${bg};color:${color}">${x.ent.name}</span>`
    ).join(' ');
    const more = arr.length > max ? `<span style="color:var(--mt);font-size:10px;margin-left:4px">+${arr.length - max} more</span>` : '';
    return head + more;
  };

  tip.innerHTML = `
    <div class="sim-tip-hd">
      ${cand.algo.source ? `<span style="color:var(--mt);font-size:11px">#${cand.algo.source}</span>` : ''}
      <b style="flex:1">${cand.algo.name}</b>
      ${cand.algo.difficulty ? `<span class="badge b-${cand.algo.difficulty.toLowerCase()}" style="font-size:10px">${cand.algo.difficulty}</span>` : ''}
    </div>
    <div class="sim-tip-score">
      <div class="sim-tip-num">${cand.total.toFixed(1)}</div>
      <div style="font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Similarity Score</div>
    </div>
    <div class="sim-tip-rows">
      <div class="sim-tip-row">
        <span>Topic depth match</span>
        <span><b>${cand.topicDepth}</b> × ${w.topic} = <b style="color:#60a5fa">${topicContrib}</b></span>
      </div>
      <div class="sim-tip-row">
        <span>Tag depth match</span>
        <span><b>${cand.tagDepth.toFixed(1)}</b> × ${w.tag} = <b style="color:#60a5fa">${tagContrib}</b></span>
      </div>
      <div class="sim-tip-row">
        <span>Same difficulty as <span style="color:${DIFF_COLOR[selected?.difficulty]||'#888'}">${selected?.difficulty || '?'}</span></span>
        <span>${cand.sameDiff ? `+<b style="color:#34d399">${diffContrib}</b>` : `<span style="color:var(--mt)">0</span>`}</span>
      </div>
    </div>
    ${(lcTopics.length || userTags.length) ? `
      <div class="sim-tip-shared">
        ${lcTopics.length ? `
          <div class="sim-tip-shared-hd">
            📚 <span>Topics</span>
            <span class="sim-tip-cnt">${lcTopics.length}</span>
          </div>
          <div class="sim-tip-chips">${renderChips(lcTopics, 6, '#60a5fa', 'rgba(59,130,246,.15)')}</div>
        ` : ''}
        ${userTags.length ? `
          <div class="sim-tip-shared-hd" style="margin-top:${lcTopics.length?'10px':'0'}">
            🏷 <span>Tags</span>
            <span class="sim-tip-cnt">${userTags.length}</span>
          </div>
          <div class="sim-tip-chips">${renderChips(userTags, 6, '#a78bfa', 'rgba(139,92,246,.15)')}</div>
        ` : ''}
      </div>` : ''}
    <div class="sim-tip-ft">Click = recenter · Double-click = open HTML</div>
  `;
  tip.style.display = 'block';
}

function simMoveTip(e) {
  const tip = document.getElementById('sim-tip');
  if (!tip) return;
  const pad = 16;
  let x = e.clientX + pad, y = e.clientY + pad;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > window.innerWidth)  x = e.clientX - tw - pad;
  if (y + th > window.innerHeight) y = e.clientY - th - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top  = Math.max(8, y) + 'px';
}
function simHideTip() {
  const tip = document.getElementById('sim-tip');
  if (tip) tip.style.display = 'none';
}

// Hook the existing rootSearch to pick algorithms for Similar view when active
const _origSelectRootNode = selectRootNode;
selectRootNode = function(id) {
  if (curView === 'similar') { simSetRoot(id); return; }
  _origSelectRootNode(id);
};

// ══════════════════════════════════════════════════════════════
// ⊶+ LINEAGE ALGO — unified topic ↔ algorithm ↔ similarity navigation
//
// One view, three auto-detected modes:
//   • TOPIC mode      → topic has SUBSET_OF children. Lineage-style graph.
//   • LEAF mode       → topic has no children, only algorithms. Grid of algos.
//   • SIMILAR mode    → focused entity is an ALGORITHM. Score-based neighbors.
//
// Transitions:
//   topic graph → dbl-click leaf topic  → leaf mode (algos grid)
//   leaf mode   → click algorithm card  → similar mode
//   similar     → click neighbor node   → similar (recenter)
//   similar     → click topic chip      → topic mode at that topic
//   any         → back button           → previous focus
// ══════════════════════════════════════════════════════════════
const laState = {
  rootId: '',
  history: [],
  // Topic-mode controls
  depth: 1, direction: 'both', layout: 'hierarchy',
  // ASSOCIATES off by default — keeps the topic graph clean (otherwise leaf topics
  // pull in hundreds of algorithm nodes). User can toggle ON to see those connections.
  relTypes: REL_TYPES.filter(t => t !== 'ASSOCIATES'),
  // Similar-mode controls — default to closest 8 (Level 1) for focused view
  scoreMode: 'balanced', level: '1',
  diffFilter: { Easy:true, Medium:true, Hard:true },
  // Pan/zoom state for SVG modes (shared across mode switches)
  tx: { x:0, y:0, s:1 }
};

function laMode() {
  const ent = Store.getEntity(laState.rootId);
  if (!ent) return 'landing';
  if (ent.concept_type === 'ALGORITHM') return 'similar';
  if (!['TOPIC','DOMAIN'].includes(ent.concept_type)) return 'topic';
  const hasTopicKids = Store.relations.some(r => r.to_id === ent.id && r.rel_type === 'SUBSET_OF');
  const hasAlgos     = Counts.directAlgos(ent.id).length > 0;
  // True leaf-with-algos: no topic children but has direct problems
  return (hasAlgos && !hasTopicKids) ? 'leaf' : 'topic';
}

function laGoTo(id) {
  if (id === laState.rootId) return;
  if (laState.rootId) laState.history.push(laState.rootId);
  laState.rootId = id;
  renderLineageAlgo();
}

function laBack() {
  if (laState.history.length) {
    laState.rootId = laState.history.pop();
  } else {
    laState.rootId = '';
  }
  renderLineageAlgo();
}

// ── Main render ──
function renderLineageAlgo() {
  // Landing — reuse the Lineage atlas but rewire tile clicks to laGoTo
  if (!laState.rootId) {
    document.getElementById('content').innerHTML = renderLineageLanding();
    setTimeout(() => {
      document.querySelectorAll('.land-tile').forEach(tile => {
        const oc = tile.getAttribute('onclick');
        const m  = oc?.match(/zoomTo\('([^']+)'/);
        if (m) tile.setAttribute('onclick', `laGoTo('${m[1]}')`);
      });
      // Also wire the search to use laGoTo via selectRootNode override below
      const inp = document.getElementById('land-search');
      if (inp) inp.id = 'la-land-search';  // distinguish so we don't double-handle
    }, 0);
    return;
  }

  const ent  = Store.getEntity(laState.rootId);
  if (!ent) { laState.rootId = ''; renderLineageAlgo(); return; }
  const mode = laMode();

  // Shell: header (mode badge + back + breadcrumb) → controls + body (search + stage + drawer)
  document.getElementById('content').innerHTML = `
    <div class="la-wrap">
      <!-- Mode bar + back + breadcrumb -->
      <div class="la-modebar">
        <button class="la-back" onclick="laBack()" title="${laState.history.length?'Back to '+(Store.getEntity(laState.history[laState.history.length-1])?.name||'previous'):'Back to atlas'}">← Back</button>
        <button class="la-back" onclick="laState.history=[];laState.rootId='';renderLineageAlgo()" title="Atlas">⌂</button>
        <span class="la-mode">${mode === 'topic' ? '⊶ Topic Graph'
                              : mode === 'leaf'  ? '⊞ Algorithms in Leaf'
                              :                    '✦ Similar Problems'}</span>
        <button class="la-ctrl-toggle" onclick="toggleLaCtrl()" title="Show/hide controls">⮜ Controls</button>
        <div class="la-crumb" id="la-crumb"></div>
      </div>

      <!-- Visit trail — the actual path of problems/topics navigated (history → current) -->
      <div class="la-trail" id="la-trail"></div>

      <div class="la-main">
        <!-- Controls panel — sections adapt to current mode -->
        <div class="la-ctrl" id="la-ctrl-panel">${laRenderControls(mode)}</div>

        <div class="la-content">
          <!-- Search bar (shared across all modes) -->
          <div class="gh-search" style="background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:8px 12px">
            <input class="root-input" id="graph-search" autocomplete="off" spellcheck="false"
              placeholder="🔍 Search anything — topic, algorithm name, #131, tag:array, hard:…"
              oninput="rootSearch(this.value)" onfocus="rootSearch(this.value)">
            <div class="root-results" id="root-results"></div>
          </div>

          <!-- Stage — changes per mode -->
          <div class="la-stage" id="la-stage"></div>

          <!-- Problems drawer (collapsed by default in Lineage Algo, click header to expand) -->
          <div class="prob-drawer" id="prob-drawer">
            <div class="pd-resize" title="Drag to resize"></div>
            <div class="pd-header" onclick="togglePD()">
              <span style="font-size:13px;font-weight:600">📋 Problems</span>
              <span class="pd-count" id="pd-count">— select a node to see its problems</span>
              <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
                <span class="pd-tabs" id="pd-tabs"></span>
                ${popBtnHtml('.prob-drawer', '📋 Problems')}
                <span class="pd-tog" id="pd-tog">▴</span>
              </span>
            </div>
            <div class="pd-body" id="pd-body"></div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Controls start collapsed by default (keeps the graph roomy on landing);
  // stay expanded only if the user explicitly opened them via ⮜ Controls.
  if (localStorage.getItem('kg_la_ctrl_collapsed') !== '0') {
    document.getElementById('la-ctrl-panel')?.classList.add('collapsed');
  }

  laRenderBreadcrumb(ent);
  laRenderTrail();
  laRenderStage(ent, mode);
  // Floating "Center" control — bottom-right of the stage, above any per-mode
  // zoom column. laRenderStage replaces #la-stage's content, so add it after.
  const stageEl = document.getElementById('la-stage');
  if (stageEl) {
    const fab = document.createElement('button');
    fab.className = 'la-center-fab';
    fab.title = 'Center / fit all nodes back into view';
    fab.textContent = '🎯';
    fab.onclick = laCenterView;
    stageEl.appendChild(fab);
  }
  // Drawer stays collapsed by default in Lineage Algo — user clicks header to expand
  updateProblemsDrawer(ent.concept_type === 'ALGORITHM' ? ent.id : laState.rootId, { noAutoOpen: true });
}

// Toggle the Lineage Algo controls panel
function toggleLaCtrl() {
  const p = document.getElementById('la-ctrl-panel');
  if (!p) return;
  const isCol = p.classList.toggle('collapsed');
  localStorage.setItem('kg_la_ctrl_collapsed', isCol ? '1' : '0');
}

// Bring every node back into view — fits the active mode's graph (topic uses
// the shared GR renderer, similar uses the sim renderer; leaf is a plain grid).
function laCenterView() {
  const mode = (typeof laMode === 'function') ? laMode() : 'topic';
  if (mode === 'similar') { if (typeof simFit === 'function') simFit(); }
  else if (mode === 'leaf') { const st = document.getElementById('la-stage'); if (st) st.scrollTop = 0; }
  else { GR.fit(); }
}

// ── Breadcrumb from root → current entity ──
function laRenderBreadcrumb(ent) {
  const ct = document.getElementById('la-crumb');
  if (!ct) return;
  const chain = [];
  let cur = ent.id;
  const seen = new Set();
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    const e = Store.getEntity(cur);
    if (!e) break;
    chain.unshift(e);
    const up = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
    cur = up?.to_id;
  }
  ct.innerHTML = chain.map((e, i) => {
    const c = Counts.forNode(e.id);
    const isLast = i === chain.length - 1;
    return `<span class="bc-item ${isLast?'bc-current':''}" onclick="laGoTo('${e.id}')">
      <span class="bc-name">${e.name}</span>
      ${c.total ? `<span class="bc-cnt">${c.total}</span>` : ''}
    </span>${!isLast ? '<span class="bc-sep">›</span>' : ''}`;
  }).join('');
}

// ── Visit trail — the ordered path actually navigated (history → current).
// Unlike the taxonomy breadcrumb above, this survives lateral hops (e.g.
// Similar-Problems), so you never lose where you started from. Each crumb
// jumps back to that point and trims the trail after it.
function laRenderTrail() {
  const ct = document.getElementById('la-trail');
  if (!ct) return;
  const ids = [...laState.history, laState.rootId].filter(Boolean);
  if (ids.length <= 1) { ct.innerHTML = ''; ct.style.display = 'none'; return; }  // nothing to retrace yet
  ct.style.display = '';
  const ICON = { ALGORITHM: 'λ', TOPIC: '⊞', DOMAIN: '◈' };
  ct.innerHTML = '<span class="tr-label">🧭 Path</span>' + ids.map((id, i) => {
    const e      = Store.getEntity(id);
    const name   = (e ? e.name : id).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const isLast = i === ids.length - 1;
    const icon   = e ? (ICON[e.concept_type] || '•') : '•';
    return `<span class="tr-item ${isLast ? 'tr-current' : ''}" title="${isLast ? 'Current' : 'Jump back to'} ${name.replace(/"/g, '&quot;')}" onclick="laTrailGoTo(${i})">
      <span class="tr-ic">${icon}</span><span class="tr-name">${name}</span>
    </span>${!isLast ? '<span class="bc-sep">›</span>' : ''}`;
  }).join('');
  ct.scrollLeft = ct.scrollWidth;   // keep the current (right-most) crumb in view
}

function laTrailGoTo(i) {
  const ids = [...laState.history, laState.rootId].filter(Boolean);
  if (i < 0 || i >= ids.length || ids[i] === undefined) return;
  if (i === ids.length - 1) return;          // already the current node
  laState.history = ids.slice(0, i);         // everything before the target becomes history
  laState.rootId  = ids[i];
  renderLineageAlgo();
}

// ── Stage dispatch by mode ──
function laRenderStage(ent, mode) {
  const stage = document.getElementById('la-stage');
  if (mode === 'topic')   laRenderTopicMode(ent, stage);
  if (mode === 'leaf')    laRenderLeafMode(ent, stage);
  if (mode === 'similar') laRenderSimilarMode(ent, stage);
}

// ── TOPIC mode — Lineage-style hub/spoke graph ──
function laRenderTopicMode(ent, stage) {
  // Build subgraph (similar to updateLineage but using laState)
  let { nodes, edges } = Lineage.subgraph(ent.id, laState.relTypes, laState.direction, laState.depth);
  const knownIds = new Set(nodes.map(n => n.id));

  // Auto-include direct algorithms (so topics show their problems)
  if (laState.relTypes.includes('ASSOCIATES')) {
    const algos = Counts.directAlgos(ent.id);
    algos.slice(0, 250).forEach(a => {
      if (!knownIds.has(a.id)) { nodes.push({ ...a, depth: 1, isRoot: false }); knownIds.add(a.id); }
    });
  }

  // Pull parent chain up so context is visible
  if (laState.relTypes.includes('SUBSET_OF')) {
    nodes.slice().forEach(n => {
      if (!['TOPIC','DOMAIN'].includes(n.concept_type)) return;
      let cur = n.id, hop = 0;
      while (cur && hop < 10) {
        const rel = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
        if (!rel) break;
        if (!knownIds.has(rel.to_id)) {
          const parent = Store.getEntity(rel.to_id);
          if (parent) { nodes.push({ ...parent, depth: (n.depth ?? 0) + 1, isRoot: false }); knownIds.add(parent.id); }
        }
        cur = rel.to_id; hop++;
      }
    });
  }

  edges = Store.relations.filter(r =>
    laState.relTypes.includes(r.rel_type) &&
    knownIds.has(r.from_id) && knownIds.has(r.to_id)
  );

  // Reuse GR — its dblclick calls zoomTo, which is now view-aware (routes to laGoTo).
  stage.innerHTML = `<div class="node-panel" id="node-panel"></div>
    <div class="graph-ctrl">
      <button class="g-btn" onclick="GR.zoom(1.2)">+</button>
      <button class="g-btn" onclick="GR.zoom(0.85)">−</button>
      <button class="g-btn" onclick="GR.fit()">⤢</button>
      <button class="g-btn" onclick="GR.reset()">⊙</button>
    </div>`;
  GR.init('la-stage');
  GR.render(nodes, edges, laState.layout);
}

      ${row('When',     micro.when)}

  const micro = microForEntity(ent);   // pat_* micro-pattern blurb, if this leaf is one

  stage.innerHTML = `
    <div class="la-leaf-hd">
      <span>Algorithms in</span>
      <b>${ent.name}</b>
      ${micro ? `<button class="micro-i-btn" onclick="toggleMicroInfo()" title="What is this pattern? (when / how / cost / contrast)">ⓘ</button>` : ''}
      <span style="color:var(--mt);font-size:11px">${algos.length} of ${Counts.directAlgos(ent.id).length} shown</span>
      <span style="margin-left:auto;display:flex;gap:5px;align-items:center">

        const topicChips = Store.relations
          .filter(r => r.from_id === a.id && r.rel_type === 'ASSOCIATES')
          .map(r => Store.getEntity(r.to_id)).filter(Boolean)
          .filter(t => t.id !== ent.id).slice(0, 4)
          .map(t => `<span class="la-algo-tag" onclick="event.stopPropagation();laGoTo('${t.id}')" title="Navigate to topic">${t.name}</span>`).join('');

          <div class="la-algo-card" onclick="laGoTo('${a.id}')" ondblclick="event.stopPropagation();showProblemModal('${a.id}')" title="Click = view similar neighbors · Double-click = open HTML">

// ── SIMILAR mode — similarity graph + topic chips for navigation ──
// Sets simState fields needed by simDrawGraph but driven by laState values.
// Single click on neighbor → laGoTo (via simSetRoot override) → chains navigation.
function laRenderSimilarMode(ent, stage) {
  // Drive shared simState from laState (so Similar view & Lineage Algo stay aligned)
  simState.rootId    = ent.id;
  simState.scoreMode = laState.scoreMode;
  simState.level     = laState.level;
  simState.diffFilter = laState.diffFilter;

  // Split associated nodes into LC Topics vs user Tags
  const assocAll = Store.relations
    .filter(r => r.from_id === ent.id && r.rel_type === 'ASSOCIATES')
    .map(r => Store.getEntity(r.to_id)).filter(Boolean);
  const lcTopics  = assocAll.filter(t => !(t.id || '').startsWith('tp__'));
  const userTags  = assocAll.filter(t =>  (t.id || '').startsWith('tp__'));

  const renderJumpChips = (arr, color, bg) =>
    arr.slice(0, 10).map(t =>
      `<span class="la-jump-chip" onclick="laGoTo('${t.id}')"
        title="${(t.tag_path || t.name)} — click to switch to Topic mode here"
        style="background:${bg};color:${color};border:1px solid ${color}40">${t.name}</span>`
    ).join('');

  stage.style.cssText = '';
  stage.innerHTML = `
    <div class="la-leaf-hd la-sim-hd">
      <div class="la-sim-title">
        <span>Similar to <b>${ent.name}</b>${ent.source?` <span style="color:var(--mt)">#${ent.source}</span>`:''}</span>
        ${ent.difficulty?`<span class="badge b-${ent.difficulty.toLowerCase()}" style="font-size:11px">${ent.difficulty}</span>`:''}
        <div class="la-sim-diff-filter" title="Filter neighbors by difficulty — synced with left panel">
          <span class="la-sim-diff-lbl">Filter:</span>
          ${['Easy','Medium','Hard'].map(d => `
            <span class="la-diff-chip b-${d.toLowerCase()}"
              style="opacity:${laState.diffFilter[d]?1:0.3}"
              onclick="laState.diffFilter['${d}']=!laState.diffFilter['${d}'];renderLineageAlgo()"
              title="Toggle ${d}">${d}</span>`).join('')}
        </div>
      </div>
      <div class="la-jump-groups">
        ${lcTopics.length ? `
          <div class="la-jump-grp">
            <span class="la-jump-lbl la-jump-lbl-t">📚 Topics ${lcTopics.length}</span>
            ${renderJumpChips(lcTopics, '#60a5fa', 'rgba(59,130,246,.12)')}
            ${lcTopics.length > 10 ? `<span style="color:var(--mt);font-size:10px;align-self:center">+${lcTopics.length-10}</span>` : ''}
          </div>` : ''}
        ${userTags.length ? `
          <div class="la-jump-grp">
            <span class="la-jump-lbl la-jump-lbl-g">🏷 Tags ${userTags.length}</span>
            ${renderJumpChips(userTags, '#a78bfa', 'rgba(139,92,246,.12)')}
            ${userTags.length > 10 ? `<span style="color:var(--mt);font-size:10px;align-self:center">+${userTags.length-10}</span>` : ''}
          </div>` : ''}
        ${!lcTopics.length && !userTags.length ? `<span style="color:var(--mt);font-size:11px">No topics or tags associated</span>` : ''}
      </div>
    </div>
    <div id="sim-graph" style="flex:1;position:relative;overflow:hidden;min-height:0"></div>
  `;
  stage.style.display = 'flex';
  stage.style.flexDirection = 'column';

  // Reset pan/zoom for the new render so we frame the new center
  _simView.tx = { x:0, y:0, s:1 };

  // Compute ranked neighbors with laState's filters
  let ranked = computeSimilarity(ent.id)
    .filter(r => !r.algo.difficulty || laState.diffFilter[r.algo.difficulty]);
  const lvl = SIM_LEVELS[laState.level];
  if (lvl?.range) ranked = ranked.slice(lvl.range[0], lvl.range[1]);

  simDrawGraph(ent, ranked);
  // simSetRoot is already overridden to call laGoTo when curView==='lineage-algo'
  // (single click on neighbor → recenter via laGoTo)
}

// Hook search/select for Lineage Algo view
const _origSelectRootNode_LA = (typeof selectRootNode === 'function') ? selectRootNode : null;
if (_origSelectRootNode_LA) {
  selectRootNode = function(id) {

      document.getElementById('root-results')?.classList.remove('open');
