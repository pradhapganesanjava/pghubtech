<!-- Shared micro-pattern catalog (also used by ../patterns.html). Defines window.PG_PATTERNS. -->
<script src="../patterns-catalog.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════════════════════════
// 🧩 MICRO-PATTERN CATALOG LOOKUP
// window.PG_PATTERNS (../patterns-catalog.js) carries the when/how/cost/
// contrast blurbs for every micro-pattern. A pat_* lineage tag's LAST
// `::` segment IS the micro id, e.g.
//   pat_ds::array::core::two-sum-hash  →  micro id "two-sum-hash".
// We expose microForEntity() so leaf nodes built from pat_* tags can show
// an ⓘ info card. Falls back gracefully if the catalog failed to load.
// ══════════════════════════════════════════════════════════════
const MICRO_BY_ID = (() => {
  const map = new Map();
  try {
    (window.PG_PATTERNS || []).forEach(cat =>
      (cat.micros || []).forEach(m => { if (m && m.id && !map.has(m.id)) map.set(m.id, m); }));
  } catch (_) {}
  return map;
})();

// The micro-pattern for a lineage entity, or null. Derived from the last
// segment of its tag_path (only pat_* paths can match a catalog micro).
function microForEntity(ent) {
  if (!ent) return null;
  const path = ent.tag_path || '';
  if (!path.startsWith('pat_')) return null;
  const last = path.split('::').pop();
  return MICRO_BY_ID.get(last) || null;
}

// ══════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════
const REL_TYPES  = ['ASSOCIATES','SUBSET_OF','MADE_OF','EXTENDS','DEPENDS_ON'];
const CON_TYPES  = ['TOPIC','ALGORITHM','DOMAIN','OBJECT','SKILL','IDEA','FACT'];
const DIFFICULTY = ['Easy','Medium','Hard'];

const REL_META = {
  ASSOCIATES: { color:'#3b82f6', notation:'A ———> B',  badgeCls:'b-as', uml:'Association'    },
  SUBSET_OF:  { color:'#10b981', notation:'A ◇——— B',  badgeCls:'b-sb', uml:'Aggregation'    },
  MADE_OF:    { color:'#f59e0b', notation:'A ◆——— B',  badgeCls:'b-mo', uml:'Composition'    },
  EXTENDS:    { color:'#8b5cf6', notation:'A ———▷ B',  badgeCls:'b-ex', uml:'Generalization' },
  DEPENDS_ON: { color:'#ef4444', notation:'A ·····> B', badgeCls:'b-dp', uml:'Dependency'    },
};

const CON_COLORS = {
  TOPIC:'#6366f1', ALGORITHM:'#06b6d4', DOMAIN:'#f59e0b',
  OBJECT:'#3b82f6', SKILL:'#10b981', IDEA:'#8b5cf6', FACT:'#6b7280'
};

// ══════════════════════════════════════════════════════════════
// STORE  (localStorage + CSV)
// ══════════════════════════════════════════════════════════════
const Store = {
  entities: [], relations: [],

  init() {
    this.entities  = JSON.parse(localStorage.getItem('kg_e') || '[]');
    this.relations = JSON.parse(localStorage.getItem('kg_r') || '[]');
  },
  save() {
    localStorage.setItem('kg_e', JSON.stringify(this.entities));
    localStorage.setItem('kg_r', JSON.stringify(this.relations));
  },
  _bust() { if (typeof Counts !== 'undefined') Counts.bust(); },
  addEntity(e)   { this.entities.push(e);  this._bust(); this.save(); },
  addRelation(r) { this.relations.push(r); this._bust(); this.save(); },
  removeEntity(id) {
    this.entities  = this.entities.filter(e => e.id !== id);
    this.relations = this.relations.filter(r => r.from_id !== id && r.to_id !== id);
    this._bust(); this.save();
  },
  removeRelation(id) { this.relations = this.relations.filter(r => r.id !== id); this._bust(); this.save(); },
  getEntity(id)  { return this.entities.find(e => e.id === id); },

  toCSV(rows, cols) {
    const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    return [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\n');
  },
  parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];
    const hdrs = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
    return lines.slice(1).filter(Boolean).map(line => {
      const vals = []; let cur = '', inQ = false;
      for (const ch of line) {
        if (ch === '"') inQ = !inQ;
        else if (ch === ',' && !inQ) { vals.push(cur); cur = ''; }
        else cur += ch;
      }
      vals.push(cur);
      const obj = {};
      hdrs.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, ''); });
      return obj;
    });
  },
  exportCSV() {
    const eC = ['id','name','description','concept_type','tags','tag_path','difficulty','source','created_at'];
    const rC = ['id','from_id','to_id','rel_type','label','multiplicity','created_at'];
    return { entities: this.toCSV(this.entities, eC), relations: this.toCSV(this.relations, rC) };
  },
  // Import CSVs — new entities/relations OVERWRITE existing by ID (re-import always refreshes)
  importCSV(eText, rText) {
    if (eText) {
      const byId = new Map(this.entities.map(e => [e.id, e]));
      this.parseCSV(eText).forEach(e => { if (e.id) byId.set(e.id, e); });
      this.entities = [...byId.values()];
    }
    if (rText) {
      const byId = new Map(this.relations.map(r => [r.id, r]));
      this.parseCSV(rText).forEach(r => { if (r.id) byId.set(r.id, r); });
      this.relations = [...byId.values()];
    }
    this._bust(); this.save();
  },

  // Wipe everything — fresh start
  clearAll() {
    this.entities = [];
    this.relations = [];
    this._bust();
    this.save();
  }
};

// ══════════════════════════════════════════════════════════════
// TAG PATH ENGINE
// "array::subarray::partition" → TOPIC chain + SUBSET_OF rels
// ══════════════════════════════════════════════════════════════
const TagPath = {
  // Parse without writing — returns [{name, rawName, exists, entity}]
  // Path-scoped ID: matches import_lc.js so both sources use same entity IDs
  // "array::subarray::dp" → segment 'dp' gets id "tp_array__subarray__dp"
  _segId(parts, i) {
    return 'tp_' + parts.slice(0, i + 1).join('__').replace(/\W+/g, '_');
  },

  preview(tagPath) {
    const parts = tagPath.split('::').map(p => p.trim().toLowerCase()).filter(Boolean);
    return parts.map((raw, i) => {
      const name    = raw.charAt(0).toUpperCase() + raw.slice(1);
      const pathId  = this._segId(parts, i);
      const ent     = Store.entities.find(e => e.id === pathId);
      return { name, raw, exists: !!ent, entity: ent };
    });
  },

  // Idempotent: create TOPIC entities + SUBSET_OF chain; return entity array root→leaf
  // Uses path-scoped IDs (same as import_lc.js) so manual adds and CSV imports share nodes.
  apply(tagPath) {
    const parts = tagPath.split('::').map(p => p.trim().toLowerCase()).filter(Boolean);
    if (!parts.length) return [];
    const chain = [];

    parts.forEach((raw, i) => {
      const name    = raw.charAt(0).toUpperCase() + raw.slice(1);
      const pathId  = this._segId(parts, i);          // e.g. "tp_array__subarray__dp"
      let   ent     = Store.entities.find(e => e.id === pathId);
      if (!ent) {
        ent = { id: pathId, name, concept_type: 'TOPIC', description: '',
                tags: 'taxonomy', tag_path: parts.slice(0, i + 1).join('::'),
                created_at: new Date().toISOString() };
        Store.addEntity(ent);
      }
      chain.push(ent);

      // SUBSET_OF: child → parent
      if (i > 0) {
        const parent = chain[i - 1];
        const relId  = 'tr_' + pathId + '__' + parent.id;
        if (!Store.relations.find(r => r.id === relId)) {
          Store.addRelation({ id: relId, from_id: pathId, to_id: parent.id,
            rel_type: 'SUBSET_OF', label: 'has subsets', multiplicity: '0..*',
            created_at: new Date().toISOString() });
        }
      }
    });

    return chain; // last = leaf topic
  },

  // Get :: path for entity. Prefers entity.tag_path field (authoritative — preserves
  // exact original casing like "_ds::array"). Falls back to walking SUBSET_OF chain
  // when tag_path is empty (e.g. manually-created entities pre-tagpath).
  pathOf(entityId) {
    const ent0 = Store.getEntity(entityId);
    if (ent0?.tag_path) return ent0.tag_path;
    const parts = []; let cur = entityId; const seen = new Set();
    while (cur) {
      if (seen.has(cur)) break;
      seen.add(cur);
      const ent = Store.getEntity(cur);
      if (!ent) break;
      parts.unshift(ent.name.toLowerCase());
      const up = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
      cur = up?.to_id;
    }
    return parts.join('::');
  }
};

// ══════════════════════════════════════════════════════════════
// COUNT AGGREGATION
// partition(10) + subarray(50) = array sees 60 in subtree
// ══════════════════════════════════════════════════════════════
const Counts = {
  // Per-render caches — cleared whenever Store mutates.
  // Without these, each keystroke does O(entities × relations) work.
  _cDesc:   new Map(),
  _cDirect: new Map(),
  _cNode:   new Map(),
  _cAll:    new Map(),

  // Index: parent_id → [child_id…]  built lazily on first use per cache window
  _childIdx: null,
  _assocIdx: null, // topic_id → [algo entities directly tagged]

  bust() {
    this._cDesc.clear();   this._cDirect.clear();
    this._cNode.clear();   this._cAll.clear();
    this._childIdx = null; this._assocIdx = null;
  },

  _buildIdx() {
    if (this._childIdx && this._assocIdx) return;
    this._childIdx = new Map();
    this._assocIdx = new Map();
    for (const r of Store.relations) {
      if (r.rel_type === 'SUBSET_OF') {
        const arr = this._childIdx.get(r.to_id);
        if (arr) arr.push(r.from_id); else this._childIdx.set(r.to_id, [r.from_id]);
      } else if (r.rel_type === 'ASSOCIATES') {
        const algo = Store.getEntity(r.from_id);
        if (algo?.concept_type === 'ALGORITHM') {
          const arr = this._assocIdx.get(r.to_id);
          if (arr) arr.push(algo); else this._assocIdx.set(r.to_id, [algo]);
        }
      }
    }
  },

  descendants(entityId) {
    if (this._cDesc.has(entityId)) return this._cDesc.get(entityId);
    this._buildIdx();
    const out = [], seen = new Set([entityId]), q = [entityId];
    while (q.length) {
      const cur = q.shift();
      const kids = this._childIdx.get(cur);
      if (!kids) continue;
      for (const k of kids) {
        if (!seen.has(k)) { seen.add(k); out.push(k); q.push(k); }
      }
    }
    this._cDesc.set(entityId, out);
    return out;
  },

  directAlgos(entityId) {
    if (this._cDirect.has(entityId)) return this._cDirect.get(entityId);
    this._buildIdx();
    const result = this._assocIdx.get(entityId) || [];
    this._cDirect.set(entityId, result);
    return result;
  },

  forNode(entityId) {
    if (this._cNode.has(entityId)) return this._cNode.get(entityId);
    const direct = this.directAlgos(entityId).length;
    const total  = direct + this.descendants(entityId).reduce((s, id) => s + this.directAlgos(id).length, 0);
    const r = { direct, total };
    this._cNode.set(entityId, r);
    return r;
  },

  allAlgosIn(entityId) {
    if (this._cAll.has(entityId)) return this._cAll.get(entityId);
    const ids = [entityId, ...this.descendants(entityId)];
    const algos = [];
    ids.forEach(id => this.directAlgos(id).forEach(a => algos.push({ algo: a, topicId: id })));
    this._cAll.set(entityId, algos);
    return algos;
  }
};

// ══════════════════════════════════════════════════════════════
// VALIDATOR
// ══════════════════════════════════════════════════════════════
const Validator = {
  hasCycle(fromId, toId, relType) {
    const seen = new Set(), q = [toId];
    while (q.length) {
      const cur = q.shift();
      if (cur === fromId) return true;
      if (seen.has(cur)) continue;
      seen.add(cur);
      Store.relations.filter(r => r.from_id === cur && r.rel_type === relType).forEach(r => q.push(r.to_id));
    }
    return false;
  },
  entity(name) {
    const errors = [];
    if (!name?.trim()) errors.push('Name is required');
    else if (Store.entities.find(e => e.name.toLowerCase() === name.toLowerCase()))
      errors.push(`"${name}" already exists`);
    return { valid: !errors.length, errors };
  },
  relation(fromId, toId, relType) {
    const errors = [], warnings = [];
    if (!fromId || !toId || !relType) { errors.push('All fields required'); return { valid: false, errors, warnings }; }
    if (fromId === toId) errors.push('Self-reference not allowed');
    const from = Store.getEntity(fromId), to = Store.getEntity(toId);
    if (!from) errors.push('Source entity not found');
    if (!to)   errors.push('Target entity not found');
    if (Store.relations.find(r => r.from_id === fromId && r.to_id === toId && r.rel_type === relType))
      errors.push('Relationship already exists');
    if (['EXTENDS','MADE_OF','SUBSET_OF'].includes(relType) && this.hasCycle(fromId, toId, relType))
      errors.push(`Circular ${relType}: "${from?.name}" already reaches "${to?.name}"`);
    if (relType === 'EXTENDS' && from && to && from.concept_type !== to.concept_type)
      warnings.push(`EXTENDS usually connects same-type concepts (${from.concept_type}→${to.concept_type})`);
    return { valid: !errors.length, errors, warnings };
  }
};

// ══════════════════════════════════════════════════════════════
// LINEAGE ENGINE
// ══════════════════════════════════════════════════════════════
const Lineage = {
  traverse(rootId, relTypes, direction, maxDepth) {
    const visited = new Map(), result = [], q = [{ id: rootId, depth: 0 }];
    while (q.length) {
      const { id, depth } = q.shift();
      if (visited.has(id)) continue;
      visited.set(id, depth);
      const ent = Store.getEntity(id);
      if (ent) result.push({ entity: ent, depth });
      if (depth >= maxDepth) continue;
      Store.relations.forEach(r => {
        if (!relTypes.includes(r.rel_type)) return;
        let next = null;
        if      (direction === 'down' && r.from_id === id) next = r.to_id;
        else if (direction === 'up'   && r.to_id   === id) next = r.from_id;
        else if (direction === 'both') { if (r.from_id === id) next = r.to_id; else if (r.to_id === id) next = r.from_id; }
        if (next && !visited.has(next)) q.push({ id: next, depth: depth + 1 });
      });
    }
    return result;
  },
  subgraph(rootId, relTypes, direction, maxDepth) {
    const trav  = this.traverse(rootId, relTypes, direction, maxDepth);
    const ids   = new Set(trav.map(t => t.entity.id));
    const nodes = trav.map(t => ({ ...t.entity, depth: t.depth, isRoot: t.entity.id === rootId }));
    const edges = Store.relations.filter(r => relTypes.includes(r.rel_type) && ids.has(r.from_id) && ids.has(r.to_id));
    return { nodes, edges };
  }
};

// ══════════════════════════════════════════════════════════════
// GRAPH RENDERER  (force-directed SVG)
// ══════════════════════════════════════════════════════════════
const GR = {
  svg: null, g: null, nodes: [], edges: [],
  tx: { x:0, y:0, s:1 }, drag: null, pan: null,
  running: false, alpha: 1, selNode: null,
  W: 800, H: 600, _mm: null, _mu: null,

  init(cid) {
    this.running = false; this.selNode = null;
    this.cid = cid;                 // remember container so layouts (e.g. outline) target the right view
    const ct = document.getElementById(cid);
    const panel = ct.querySelector('.node-panel');
    ct.innerHTML = '';
    if (panel) ct.appendChild(panel);

    const NS = 'http://www.w3.org/2000/svg';
    this.svg = document.createElementNS(NS, 'svg');
    this.svg.style.cssText = 'width:100%;height:100%;cursor:grab;display:block';
    ct.appendChild(this.svg);

    const defs = document.createElementNS(NS, 'defs');
    Object.entries(REL_META).forEach(([type, m]) => {
      const mk = document.createElementNS(NS, 'marker');
      mk.setAttribute('id', `arr-${type}`); mk.setAttribute('markerWidth', '10');
      mk.setAttribute('markerHeight', '7'); mk.setAttribute('refX', '9');
      mk.setAttribute('refY', '3.5');       mk.setAttribute('orient', 'auto');
      const poly = document.createElementNS(NS, 'polygon');
      poly.setAttribute('points', '0 0, 10 3.5, 0 7');
      if (type === 'EXTENDS') { poly.setAttribute('fill', '#1e293b'); poly.setAttribute('stroke', m.color); poly.setAttribute('stroke-width', '1.5'); }
      else poly.setAttribute('fill', m.color);
      mk.appendChild(poly); defs.appendChild(mk);
    });
    this.svg.appendChild(defs);
    this.g = document.createElementNS(NS, 'g');
    this.svg.appendChild(this.g);

    const r = ct.getBoundingClientRect();
    this.W = r.width || 800; this.H = r.height || 600;
    this.tx = { x:0, y:0, s:1 };

    this.svg.addEventListener('mousedown', e => {
      if (e.target === this.svg || e.target === this.g) {
        this.pan = { sx: e.clientX - this.tx.x, sy: e.clientY - this.tx.y };
        this.svg.style.cursor = 'grabbing';
      }
    });
    this.svg.addEventListener('wheel', e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.12 : 0.9;
      const r2 = this.svg.getBoundingClientRect();
      const mx = e.clientX - r2.left, my = e.clientY - r2.top;
      this.tx.x = mx - (mx - this.tx.x) * f; this.tx.y = my - (my - this.tx.y) * f;
      this.tx.s = Math.min(4, Math.max(0.15, this.tx.s * f));
      this._applyTx();
    }, { passive: false });

    if (this._mm) window.removeEventListener('mousemove', this._mm);
    if (this._mu) window.removeEventListener('mouseup',   this._mu);
    this._mm = e => {
      if (this.pan) { this.tx.x = e.clientX - this.pan.sx; this.tx.y = e.clientY - this.pan.sy; this._applyTx(); }
      if (this.drag) {
        const r2 = this.svg.getBoundingClientRect();
        this.drag.x = (e.clientX - r2.left - this.tx.x) / this.tx.s;
        this.drag.y = (e.clientY - r2.top  - this.tx.y) / this.tx.s;
        this.drag.vx = this.drag.vy = 0; this._frame();
      }
    };
    this._mu = () => { this.pan = null; this.drag = null; this.svg.style.cursor = 'grab'; };
    window.addEventListener('mousemove', this._mm);
    window.addEventListener('mouseup',   this._mu);
  },

  _applyTx() { this.g.setAttribute('transform', `translate(${this.tx.x},${this.tx.y}) scale(${this.tx.s})`); },

  render(nodes, edges, layoutArg) {
    this.running = false;
    // Layout is driven by the calling view: Lineage passes linState.layout,
    // Lineage Algo passes laState.layout. Fall back to linState then 'force'.
    const layout = layoutArg || (typeof linState !== 'undefined' && linState.layout) || 'force';

    // Outline = pure HTML tree (no SVG)
    if (layout === 'outline') {
      this._renderOutline(nodes, edges);
      return;
    }

    // Initial radial positioning (used by all SVG layouts)
    const cx = this.W / 2, cy = this.H / 2;
    const depths = [...new Set(nodes.map(n => n.depth))].sort((a, b) => a - b);
    const groups = {};
    depths.forEach(d => { groups[d] = nodes.filter(n => n.depth === d); });

    this.nodes = nodes.map(n => {
      const grp = groups[n.depth], idx = grp.indexOf(n);
      const rad = n.depth === 0 ? 0 : n.depth * 120;
      const ang = (idx / grp.length) * 2 * Math.PI - Math.PI / 2;
      return { ...n, x: cx + rad * Math.cos(ang) + (Math.random() - .5) * 20, y: cy + rad * Math.sin(ang) + (Math.random() - .5) * 20, vx: 0, vy: 0 };
    });
    this.edges = edges;

    // Apply static layouts (radial / tree-td / tree-lr / hierarchy) — no simulation
    if (layout === 'radial')        { this._layoutRadial();        this._frame(); setTimeout(() => this.fit(), 0); return; }
    if (layout === 'tree-td')       { this._layoutTree(false);     this._frame(); setTimeout(() => this.fit(), 0); return; }
    if (layout === 'tree-lr')       { this._layoutTree(true);      this._frame(); setTimeout(() => this.fit(), 0); return; }
    if (layout === 'hierarchy')     { this._layoutHierarchy(false); this._frame(); setTimeout(() => this.fit(), 0); return; }
    if (layout === 'hierarchy-lr')  { this._layoutHierarchy(true);  this._frame(); setTimeout(() => this.fit(), 0); return; }

    // Force-directed (default) — run physics, fit when simulation cools
    this.alpha = 1; this.running = true;
    requestAnimationFrame(() => this._tick());
  },

  // ── Layout: Radial concentric circles ──
  _layoutRadial() {
    const cx = this.W / 2, cy = this.H / 2;
    const depths = [...new Set(this.nodes.map(n => n.depth))].sort((a, b) => a - b);
    const groups = {};
    depths.forEach(d => { groups[d] = this.nodes.filter(n => n.depth === d); });
    const maxR = Math.min(this.W, this.H) * 0.42;
    const step = depths.length > 1 ? maxR / (depths.length - 1) : maxR;
    depths.forEach((d, di) => {
      const grp = groups[d];
      grp.forEach((n, i) => {
        const r = di * step;
        const a = (i / Math.max(grp.length, 1)) * 2 * Math.PI - Math.PI / 2;
        n.x = cx + r * Math.cos(a);
        n.y = cy + r * Math.sin(a);
      });
    });
  },

  // ── Layout: Hierarchical tree (horizontal = LR, else top-down) ──
  _layoutTree(horizontal) {
    const depths = [...new Set(this.nodes.map(n => n.depth))].sort((a, b) => a - b);
    const groups = {};
    depths.forEach(d => { groups[d] = this.nodes.filter(n => n.depth === d); });
    const W = this.W, H = this.H, pad = 50;
    depths.forEach((d, di) => {
      const grp = groups[d];
      const main = pad + ((horizontal ? W : H) - 2 * pad) * (di / Math.max(1, depths.length - 1));
      grp.forEach((n, i) => {
        const cross = pad + ((horizontal ? H : W) - 2 * pad) * ((i + 0.5) / grp.length);
        if (horizontal) { n.x = main; n.y = cross; }
        else            { n.x = cross; n.y = main; }
      });
    });
  },

  // ── Layout: Tidy hierarchy (true parent → child → children tree) ──
  // Unlike _layoutTree (which spreads each depth band evenly and so
  // interleaves siblings from different parents), this groups every node
  // directly under its parent and centers parents over their children —
  // so the SUBSET_OF flow (e.g. Pat DS → array → core → micro) reads as a
  // proper tree. horizontal=true puts the root on the left, children to
  // the right; otherwise root on top, children below.
  _layoutHierarchy(horizontal) {
    const idTo = new Map(this.nodes.map(n => [n.id, n]));
    // Use the SEMANTIC edge direction, NOT BFS depth — with Direction="Both"
    // an ancestor can be pulled in at a higher BFS depth than the focused
    // node, which would invert the tree. SUBSET_OF: from_id=child, to_id=parent.
    // ASSOCIATES: from_id=algo, to_id=topic → the topic is the parent.
    const childrenOf = new Map();   // parentId → [childId]
    const parentOf   = new Map();   // childId  → parentId (each child keeps one)
    const link = (parentId, childId) => {
      if (!idTo.has(parentId) || !idTo.has(childId) || parentId === childId) return;
      if (!childrenOf.has(parentId)) childrenOf.set(parentId, []);
      if (!childrenOf.get(parentId).includes(childId)) childrenOf.get(parentId).push(childId);
      if (!parentOf.has(childId)) parentOf.set(childId, parentId);
    };
    this.edges.forEach(e => {
      if (e.rel_type === 'SUBSET_OF' || e.rel_type === 'ASSOCIATES') link(e.to_id, e.from_id);
      else link(e.from_id, e.to_id);
    });

    // Layout roots: climb the focused node to its topmost ancestor (so its full
    // lineage shows from the real top), plus any parentless node (orphans / extra trees).
    const climbTop = id => { let cur = id, guard = new Set(); while (parentOf.has(cur) && !guard.has(cur)) { guard.add(cur); cur = parentOf.get(cur); } return cur; };
    const rootSet  = new Set();
    const focused  = this.nodes.find(n => n.isRoot);
    if (focused) rootSet.add(climbTop(focused.id));
    this.nodes.forEach(n => { if (!parentOf.has(n.id)) rootSet.add(n.id); });

    const LEVEL = 170;   // main-axis gap between depths
    const LEAF  = 64;    // cross-axis gap between adjacent leaves
    const pad   = 60;
    const pos   = new Map();   // id → { main, cross }
    const seen  = new Set();
    let cursor  = 0;

    // Post-order: leaves take the next cursor slot; parents center over their kids.
    const walk = (id, depth) => {
      if (seen.has(id)) return pos.get(id)?.cross ?? 0;
      seen.add(id);
      const kids = (childrenOf.get(id) || []).filter(k => !seen.has(k));
      let cross;
      if (!kids.length) {
        cross = cursor * LEAF; cursor++;
      } else {
        const cs = kids.map(k => walk(k, depth + 1));
        cross = (cs[0] + cs[cs.length - 1]) / 2;
      }
      pos.set(id, { main: depth * LEVEL, cross });
      return cross;
    };

    [...rootSet].forEach(r => walk(r, 0));
    this.nodes.forEach(n => { if (!seen.has(n.id)) walk(n.id, 0); });   // safety net

    this.nodes.forEach(n => {
      const p = pos.get(n.id) || { main: 0, cross: 0 };
      if (horizontal) { n.x = pad + p.main;  n.y = pad + p.cross; }
      else            { n.x = pad + p.cross; n.y = pad + p.main; }
    });
  },

  // ── Layout: HTML outline tree ──
  _renderOutline(nodes, edges) {
    const ct = document.getElementById(this.cid || 'lin-graph-ct');
    if (!ct) return;
    // Preserve panel + graph-ctrl, replace SVG with HTML tree
    const panel = ct.querySelector('.node-panel');
    const ctrl  = ct.querySelector('.graph-ctrl');
    ct.innerHTML = '';
    if (panel) ct.appendChild(panel);
    if (ctrl)  ct.appendChild(ctrl);

    // Build adjacency from edges: parent → [child]
    // For SUBSET_OF: from_id=child, to_id=parent → use to_id as parent for tree
    // For ASSOCIATES: from_id=algo, to_id=topic → algo is parent of topic from algo's view
    const root = nodes.find(n => n.isRoot);
    if (!root) { ct.appendChild(Object.assign(document.createElement('div'), { style:'padding:20px;color:#94a3b8', textContent:'No root selected' })); return; }

    const idTo = new Map(nodes.map(n => [n.id, n]));
    const childMap = new Map(); // entityId → [{ child, edge }]
    edges.forEach(e => {
      // Parent = the node "closer" to root (lower depth)
      const a = idTo.get(e.from_id), b = idTo.get(e.to_id);
      if (!a || !b) return;
      const parent = (a.depth <= b.depth) ? a : b;
      const child  = (a.depth <= b.depth) ? b : a;
      if (!childMap.has(parent.id)) childMap.set(parent.id, []);
      childMap.get(parent.id).push({ child, edge: e });
    });

    const tree = document.createElement('div');
    tree.className = 'ol-tree';
    tree.style.cssText = 'padding:14px 18px;overflow-y:auto;height:100%;';

    const seen = new Set();
    const renderNode = (node, depth, edge) => {
      if (seen.has(node.id)) return null;
      seen.add(node.id);

      const m       = edge ? REL_META[edge.rel_type] : null;
      const c       = Counts.forNode(node.id);
      const colors  = CON_COLORS[node.concept_type] || '#6b7280';
      const kids    = (childMap.get(node.id) || []).sort((a,b)=>(a.child.depth||0)-(b.child.depth||0));

      const row = document.createElement('div');
      row.className = 'ol-row';
      row.style.cssText = `padding-left:${depth*22}px`;
      row.innerHTML = `
        <span class="ol-tog" data-id="${node.id}">${kids.length?'▾':'•'}</span>
        ${edge ? `<span class="ol-rel" style="color:${m.color};border-color:${m.color}40">${edge.rel_type.replace('_',' ')}</span>` : ''}
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${colors};margin-right:2px"></span>
        <span class="ol-name" style="${node.isRoot?'color:#60a5fa;font-weight:700':''}">${node.name}</span>
        <span class="badge b-${(node.concept_type||'').toLowerCase()}" style="font-size:9px">${node.concept_type}</span>
        ${node.difficulty?`<span class="badge b-${node.difficulty.toLowerCase()}" style="font-size:9px">${node.difficulty}</span>`:''}
        ${node.source?`<span style="color:var(--mt);font-size:11px">#${node.source}</span>`:''}
        ${c.total?`<span style="color:#60a5fa;font-size:11px;margin-left:4px">${c.direct===c.total?`(${c.total})`:`(${c.direct}/${c.total})`}</span>`:''}
      `;
      row.querySelector('.ol-name').onclick = () => zoomTo(node.id);  // view-aware: routes to laGoTo in Lineage Algo
      tree.appendChild(row);

      const kidWrap = document.createElement('div');
      kidWrap.className = 'ol-kids';
      kids.forEach(({ child, edge }) => renderNode(child, depth + 1, edge));

      const tog = row.querySelector('.ol-tog');
      if (kids.length) {
        tog.style.cursor = 'pointer';
        tog.onclick = () => {
          // toggle visibility of subsequent rows that are deeper than this depth, until same/less depth
          const allRows = [...tree.querySelectorAll('.ol-row')];
          const idx = allRows.indexOf(row);
          let collapsed = tog.textContent === '▸';
          tog.textContent = collapsed ? '▾' : '▸';
          for (let i = idx + 1; i < allRows.length; i++) {
            const r = allRows[i];
            const d = parseInt(r.style.paddingLeft) / 22;
            if (d <= depth) break;
            r.style.display = collapsed ? '' : 'none';
          }
        };
      }
    };
    renderNode(root, 0, null);

    ct.appendChild(tree);
    this.nodes = nodes; this.edges = edges;
  },

  _tick() {
    if (!this.running) return;
    if (this.alpha < 0.003) { this.running = false; this._frame(); this.fit(); return; }
    this._simulate(); this._frame(); this.alpha *= 0.975;
    requestAnimationFrame(() => this._tick());
  },

  _simulate() {
    const REP = 3500, SPRING = 0.04, REST = 140, DAMP = 0.88, GRAV = 0.012;
    const cx = this.W / 2, cy = this.H / 2;
    for (let i = 0; i < this.nodes.length; i++) for (let j = i + 1; j < this.nodes.length; j++) {
      const a = this.nodes[i], b = this.nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = REP / (d * d), fx = f * dx/d, fy = f * dy/d;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    this.edges.forEach(e => {
      const a = this.nodes.find(n => n.id === e.from_id), b = this.nodes.find(n => n.id === e.to_id);
      if (!a || !b) return;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - REST) * SPRING, fx = f * dx/d, fy = f * dy/d;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });
    this.nodes.forEach(n => {
      if (this.drag && n.id === this.drag.id) return;
      n.vx += (cx - n.x) * GRAV; n.vy += (cy - n.y) * GRAV;
      n.vx *= DAMP; n.vy *= DAMP; n.x += n.vx; n.y += n.vy;
      // Guard against NaN/Infinity from numerical drift in dense graphs
      if (!Number.isFinite(n.x)) { n.x = cx; n.vx = 0; }
      if (!Number.isFinite(n.y)) { n.y = cy; n.vy = 0; }
    });
  },

  _frame() {
    const NS = 'http://www.w3.org/2000/svg';
    this.g.innerHTML = '';
    const NR = 28;
    // Format numbers for SVG attributes — prevents scientific notation (1e-300) and NaN
    const f = n => (Number.isFinite(n) ? n.toFixed(2) : '0');

    // Edges
    this.edges.forEach(edge => {
      const a = this.nodes.find(n => n.id === edge.from_id), b = this.nodes.find(n => n.id === edge.to_id);
      if (!a || !b) return;
      const m = REL_META[edge.rel_type];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
      const sx = a.x + dx/d * NR, sy = a.y + dy/d * NR;
      const ex = b.x - dx/d * (NR + 13), ey = b.y - dy/d * (NR + 13);
      const active = !this.selNode || a.id === this.selNode || b.id === this.selNode;
      const op = active ? 1 : 0.1;

      if (['SUBSET_OF','MADE_OF'].includes(edge.rel_type)) {
        const ox = a.x + dx/d * (NR + 9), oy = a.y + dy/d * (NR + 9), ds = 7;
        const dm = document.createElementNS(NS, 'polygon');
        dm.setAttribute('points', `${f(ox)},${f(oy-ds)} ${f(ox+ds*.6)},${f(oy)} ${f(ox)},${f(oy+ds)} ${f(ox-ds*.6)},${f(oy)}`);
        dm.setAttribute('fill', edge.rel_type === 'MADE_OF' ? m.color : '#1e293b');
        dm.setAttribute('stroke', m.color); dm.setAttribute('stroke-width', '1.5');
        dm.setAttribute('opacity', op); this.g.appendChild(dm);
      }

      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', f(sx)); line.setAttribute('y1', f(sy));
      line.setAttribute('x2', f(ex)); line.setAttribute('y2', f(ey));
      line.setAttribute('stroke', m.color); line.setAttribute('stroke-width', active ? '2' : '1.5');
      line.setAttribute('opacity', op);
      if (edge.rel_type === 'DEPENDS_ON') line.setAttribute('stroke-dasharray', '5,4');
      line.setAttribute('marker-end', `url(#arr-${edge.rel_type})`);
      this.g.appendChild(line);

      const lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('x', f((sx+ex)/2)); lbl.setAttribute('y', f((sy+ey)/2 - 6));
      lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('fill', m.color);
      lbl.setAttribute('font-size', '9'); lbl.setAttribute('font-weight', '600');
      lbl.setAttribute('opacity', op); lbl.setAttribute('pointer-events', 'none');
      lbl.textContent = edge.label || edge.rel_type.replace('_', ' ');
      this.g.appendChild(lbl);
    });

    // Nodes
    this.nodes.forEach(node => {
      const grp = document.createElementNS(NS, 'g');
      grp.style.cursor = 'pointer';
      const isSel = this.selNode === node.id, isRoot = node.isRoot;
      const dimmed = this.selNode && !isSel && !this.edges.some(e =>
        (e.from_id === this.selNode && e.to_id === node.id) || (e.to_id === this.selNode && e.from_id === node.id));
      const nc = CON_COLORS[node.concept_type] || '#6b7280';
      const r  = isRoot ? 34 : NR;
      const counts = Counts.forNode(node.id);

      // Defensive: if simulation produced NaN/Infinity, reset to center to avoid SVG errors
      if (!Number.isFinite(node.x) || !Number.isFinite(node.y)) { node.x = this.W/2; node.y = this.H/2; node.vx = node.vy = 0; }

      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', f(node.x)); circle.setAttribute('cy', f(node.y)); circle.setAttribute('r', r);
      circle.setAttribute('fill', isRoot ? '#1e3a6e' : '#1e293b');
      circle.setAttribute('stroke', isSel ? '#fff' : nc); circle.setAttribute('stroke-width', isSel ? '3' : '2');
      circle.setAttribute('opacity', dimmed ? '0.15' : '1');
      grp.appendChild(circle);

      // Name — shift up if count label visible
      const nameY = counts.total > 0 ? node.y - 7 : node.y;
      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('x', f(node.x)); txt.setAttribute('y', f(nameY));
      txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('dominant-baseline', 'middle');
      txt.setAttribute('fill', '#e2e8f0'); txt.setAttribute('font-size', node.name.length > 10 ? '9' : '11');
      txt.setAttribute('font-weight', '600'); txt.setAttribute('opacity', dimmed ? '0.15' : '1');
      txt.setAttribute('pointer-events', 'none');
      txt.textContent = node.name.length > 13 ? node.name.slice(0,11)+'…' : node.name;
      grp.appendChild(txt);

      // Algorithm count badge inside node  — (direct/total) or (total) when equal
      if (counts.total > 0) {
        const ct = document.createElementNS(NS, 'text');
        ct.setAttribute('x', f(node.x)); ct.setAttribute('y', f(node.y + 8));
        ct.setAttribute('text-anchor', 'middle'); ct.setAttribute('dominant-baseline', 'middle');
        ct.setAttribute('fill', nc); ct.setAttribute('font-size', '9'); ct.setAttribute('font-weight', '700');
        ct.setAttribute('opacity', dimmed ? '0.15' : '0.9'); ct.setAttribute('pointer-events', 'none');
        ct.textContent = counts.direct === counts.total ? `(${counts.total})` : `(${counts.direct}/${counts.total})`;
        grp.appendChild(ct);
      }

      // Depth badge
      if (node.depth > 0) {
        const bc = document.createElementNS(NS, 'circle');
        bc.setAttribute('cx', f(node.x + r - 3)); bc.setAttribute('cy', f(node.y - r + 3));
        bc.setAttribute('r', '9'); bc.setAttribute('fill', '#334155');
        bc.setAttribute('stroke', '#475569'); bc.setAttribute('stroke-width', '1');
        grp.appendChild(bc);
        const bt = document.createElementNS(NS, 'text');
        bt.setAttribute('x', f(node.x + r - 3)); bt.setAttribute('y', f(node.y - r + 3));
        bt.setAttribute('text-anchor', 'middle'); bt.setAttribute('dominant-baseline', 'middle');
        bt.setAttribute('fill', '#94a3b8'); bt.setAttribute('font-size', '8'); bt.setAttribute('font-weight', '700');
        bt.setAttribute('pointer-events', 'none'); bt.textContent = node.depth;
        grp.appendChild(bt);
      }

      grp.addEventListener('click',     e => { e.stopPropagation(); this._select(node.id); });
      grp.addEventListener('dblclick',  e => { e.stopPropagation(); zoomTo(node.id, linState.depth); });
      grp.addEventListener('mousedown', e => { e.stopPropagation(); this.drag = node; this.running = false; });
      this.g.appendChild(grp);
    });
  },

  _select(nodeId) {
    this.selNode = this.selNode === nodeId ? null : nodeId;
    this._frame();
    // Sync the Problems drawer + breadcrumb to the selected (or root when deselected) node
    if (typeof updateProblemsDrawer === 'function') updateProblemsDrawer(this.selNode || linState.rootId);
    if (typeof renderBreadcrumb === 'function')     renderBreadcrumb(this.selNode || linState.rootId);
    const panel = document.querySelector('.node-panel');
    if (!panel) return;
    if (!this.selNode) { panel.classList.remove('vis'); return; }
    const ent    = Store.getEntity(nodeId);
    const node   = this.nodes.find(n => n.id === nodeId);
    const counts = Counts.forNode(nodeId);
    const path   = TagPath.pathOf(nodeId);
    const out    = Store.relations.filter(r => r.from_id === nodeId).length;
    const inn    = Store.relations.filter(r => r.to_id   === nodeId).length;
    const algos  = Counts.directAlgos(nodeId);
    panel.innerHTML = `
      <div style="font-weight:700;font-size:13px;margin-bottom:5px">${ent.name}</div>
      <span class="badge b-${ent.concept_type?.toLowerCase()}">${ent.concept_type}</span>
      ${path ? `<div style="font-size:10px;color:var(--mt);font-family:monospace;margin:5px 0">${path}</div>` : ''}
      ${ent.description ? `<div style="font-size:11px;color:#cbd5e1;margin:5px 0">${ent.description}</div>` : ''}
      <div class="sep"></div>
      <div style="font-size:11px;color:var(--mt)">Depth <b style="color:var(--tx)">${node?.depth ?? '—'}</b> &nbsp;·&nbsp; Out <b style="color:var(--tx)">${out}</b> · In <b style="color:var(--tx)">${inn}</b></div>
      ${counts.total > 0 ? `
        <div style="margin-top:5px;font-size:11px">
          <span style="color:var(--mt)">Algorithms: </span>
          <b style="color:#60a5fa">${counts.total} total</b>
          ${counts.direct !== counts.total ? `<span style="color:var(--mt)"> (${counts.direct} direct)</span>` : ''}
        </div>
        ${algos.length ? `<div style="margin-top:4px">${algos.slice(0,3).map(a=>`<div style="font-size:10px;color:var(--mt)">λ ${a.name}</div>`).join('')}${algos.length>3?`<div style="font-size:10px;color:var(--bdr)">+${algos.length-3} more</div>`:''}</div>` : ''}
      ` : ''}
      <button class="btn btn-pr btn-sm" style="margin-top:8px;width:100%" onclick="zoomTo('${nodeId}', linState.depth)">→ Zoom into ${ent.name}</button>
      <div style="font-size:10px;color:var(--mt);margin-top:4px;text-align:center">or double-click any node</div>`;
    panel.classList.add('vis');
  },

  zoom(f) { const cx=this.W/2,cy=this.H/2; this.tx.x=cx-(cx-this.tx.x)*f; this.tx.y=cy-(cy-this.tx.y)*f; this.tx.s=Math.min(4,Math.max(0.15,this.tx.s*f)); this._applyTx(); },
  reset()  { this.tx={x:0,y:0,s:1}; this._applyTx(); },

  // Fit all visible nodes to viewport — "best possible view" under current layout
  fit() {
    if (!this.nodes.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    this.nodes.forEach(n => {
      if (typeof n.x !== 'number' || typeof n.y !== 'number') return;
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
    });
    if (minX === Infinity) return;
    const w = (maxX - minX) || 1, h = (maxY - minY) || 1;
    const pad = 70; // pixels of margin around content
    const scale = Math.min(
      (this.W - 2 * pad) / w,
      (this.H - 2 * pad) / h,
      2.0
    );
    this.tx.s = Math.max(0.2, scale);
    this.tx.x = this.W / 2 - (minX + w / 2) * this.tx.s;
    this.tx.y = this.H / 2 - (minY + h / 2) * this.tx.s;
    this._applyTx();
  }
};

function topicNode(entity, depth) {
  const counts   = Counts.forNode(entity.id);
  const children = Store.relations
    .filter(r => r.to_id === entity.id && r.rel_type === 'SUBSET_OF')
    .map(r => Store.getEntity(r.from_id)).filter(Boolean);
  const algos    = Counts.directAlgos(entity.id);
  const isOpen   = expanded.has(entity.id);
  const hasKids  = children.length > 0 || algos.length > 0;
  const path     = TagPath.pathOf(entity.id);

  return `
    <div>
      <div class="topic-row" style="padding-left:${12 + depth * 18}px" onclick="toggleExpand('${entity.id}')">
        <span class="exbtn">${hasKids ? (isOpen ? '▾' : '▸') : '•'}</span>
        <div style="flex:1;min-width:0">
          <div class="t-name">${entity.name}</div>
          ${path ? `<div class="t-path">${path}</div>` : ''}
        </div>
        <div style="width:80px;text-align:center"><span class="cnt-d">${counts.direct}</span></div>
        <div style="width:80px;text-align:center"><span class="cnt-t">${counts.total}</span></div>
        <div style="width:100px;display:flex;gap:4px;justify-content:flex-end">
          <button class="btn btn-sec btn-sm" onclick="event.stopPropagation();goLineage('${entity.id}')">Lineage</button>
        </div>
      </div>
      ${isOpen && hasKids ? `
        <div class="t-children">
          ${children.map(c => topicNode(c, depth + 1)).join('')}
          ${algos.map(a => `
            <div class="algo-row" style="padding-left:${12 + (depth+1)*18}px">
              <span style="color:#334155">λ</span>
              <span style="color:var(--tx);font-weight:500">${a.name}</span>
              ${a.difficulty ? `<span class="badge b-${a.difficulty.toLowerCase()}">${a.difficulty}</span>` : ''}
              ${a.source ? `<span style="color:var(--mt);font-size:11px">#${a.source}</span>` : ''}
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

function toggleExpand(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  renderTopics();
}

function renderLineageLanding() {
  // Find all entities that are roots in the SUBSET_OF hierarchy
  const childIds = new Set(Store.relations.filter(r => r.rel_type === 'SUBSET_OF').map(r => r.from_id));
  const allRoots = Store.entities.filter(e =>
    ['TOPIC','DOMAIN'].includes(e.concept_type) && !childIds.has(e.id) && Counts.forNode(e.id).total > 0
  );

  // Categorize roots
  const dsRoot     = Store.entities.find(e => e.id === 'tp_data_structure');
  const algoRoot   = Store.entities.find(e => e.id === 'tp_algorithm');
  const mathRoot   = Store.entities.find(e => e.id === 'tp_math');
  const designRoot = Store.entities.find(e => e.id === 'tp_design');
  const otherRoot  = Store.entities.find(e => e.id === 'tp_other');

  const standardIds = new Set(['tp_data_structure','tp_algorithm','tp_math','tp_design','tp_other']);
  const stdRoots    = [dsRoot, algoRoot, mathRoot, designRoot, otherRoot].filter(Boolean);
  const customRoots = allRoots.filter(e => !standardIds.has(e.id));

  const dsKids   = dsRoot   ? navKids(dsRoot.id)   : [];
  const algoKids = algoRoot ? navKids(algoRoot.id) : [];
  const mathKids = mathRoot ? navKids(mathRoot.id) : [];

  const tileCard = (e, sub) => {
    const c = Counts.forNode(e.id);
    // From atlas: start with depth=1 for focused view; user can adjust then it sticks
    return `<div class="land-tile" onclick="zoomTo('${e.id}', 1)">
      <div class="lt-name">${e.name}</div>
      ${sub ? `<div class="lt-sub">${sub}</div>` : ''}
      <div class="lt-stats">
        ${c.direct ? `<span class="cnt-d">${c.direct}</span>` : ''}
        <span class="cnt-t">${c.total}</span>
        ${navKids(e.id).length ? `<span class="tn-nk">⊕${navKids(e.id).length}</span>` : ''}
      </div>
    </div>`;
  };

  const section = (title, icon, items, sub) => items.length ? `
    <div class="land-sec">

// 🍞 BREADCRUMB — SUBSET_OF chain to current/selected node with counts
// Click any segment to navigate there
// ══════════════════════════════════════════════════════════════
function renderBreadcrumb(nodeId) {
  const ct = document.getElementById('gh-crumb');
  if (!ct) return;
  if (!nodeId) { ct.innerHTML = ''; return; }

  const chain = [];
  let cur = nodeId;
  const seen = new Set();
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    const ent = Store.getEntity(cur);
    if (!ent) break;
    chain.unshift(ent);
    const rel = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
    cur = rel?.to_id;
  }

  if (chain.length === 0) { ct.innerHTML = ''; return; }

  ct.innerHTML = `
    <span class="bc-home" title="Back to atlas" onclick="goHomeLineage()">⌂</span>
    <span class="bc-sep">›</span>
    ${chain.map((ent, i) => {
      const c = Counts.forNode(ent.id);
      const isLast = i === chain.length - 1;
      return `
        <span class="bc-item ${isLast?'bc-current':''}" onclick="zoomTo('${ent.id}', linState.depth)" title="${ent.tag_path || ent.name}">
          <span class="bc-name">${ent.name}</span>
          <span class="bc-cnt">${c.total}</span>
        </span>
        ${!isLast ? '<span class="bc-sep">›</span>' : ''}
      `;
    }).join('')}
  `;
}

let _pdDiff = '';   // difficulty filter in drawer

function togglePD() {
  const d = document.getElementById('prob-drawer');
  if (!d) return;
  d.classList.toggle('open');
  // Restore saved height when opening
  if (d.classList.contains('open')) {
    const saved = localStorage.getItem('kg_pd_height');
    if (saved) d.style.maxHeight = saved;
  } else {
    d.style.maxHeight = '';  // back to closed-height from CSS
  }
}

// Drag-to-resize handler for the Problems drawer (works for all views)
(function initPDResize() {
  let pdResizing = null;
  document.addEventListener('mousedown', e => {
    if (!e.target.classList || !e.target.classList.contains('pd-resize')) return;
    const drawer = e.target.closest('.prob-drawer');
    if (!drawer) return;
    pdResizing = { drawer, startY: e.clientY, startH: drawer.offsetHeight };
    drawer.classList.add('pd-resizing');
    drawer.classList.add('open');   // ensure visible while resizing
    document.body.style.cursor = 'row-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!pdResizing) return;
    const newH = Math.max(46, Math.min(window.innerHeight - 120, pdResizing.startH - (e.clientY - pdResizing.startY)));
    pdResizing.drawer.style.maxHeight = newH + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!pdResizing) return;
    pdResizing.drawer.classList.remove('pd-resizing');
    localStorage.setItem('kg_pd_height', pdResizing.drawer.style.maxHeight);
    pdResizing = null;
    document.body.style.cursor = '';
  });
})();

function setPDDiff(d) { _pdDiff = (_pdDiff === d ? '' : d); updateProblemsDrawer(_pdNodeId); }

let _pdNodeId = '';
function updateProblemsDrawer(nodeId, opts = {}) {
  _pdNodeId = nodeId || '';
  const drawer = document.getElementById('prob-drawer');
  const body   = document.getElementById('pd-body');
  const count  = document.getElementById('pd-count');
  const tabs   = document.getElementById('pd-tabs');
  if (!drawer || !body || !count) return;

  if (!nodeId) {
    count.textContent = '— click any node in the graph to see its problems here';
    body.innerHTML = '';
    if (tabs) tabs.innerHTML = '';
    return;
  }

  const ent = Store.getEntity(nodeId);
  if (!ent) return;

  let problems;
  if (ent.concept_type === 'ALGORITHM') {
    problems = [{ algo: ent, topicId: null }];
  } else {
    problems = Counts.allAlgosIn(nodeId);
  }

  // Difficulty filter
  const byDiff = { Easy:0, Medium:0, Hard:0 };
  problems.forEach(({algo}) => { if (algo.difficulty) byDiff[algo.difficulty]++; });
  const shown = _pdDiff ? problems.filter(({algo}) => algo.difficulty === _pdDiff) : problems;

  count.innerHTML = `<b style="color:var(--tx)">${ent.name}</b> — <b style="color:#60a5fa">${problems.length}</b> total${_pdDiff?` · ${shown.length} ${_pdDiff}`:''}`;

  if (tabs) {
    tabs.innerHTML = DIFFICULTY.map(d => `<span class="pd-tab ${_pdDiff===d?'active':''}" onclick="event.stopPropagation();setPDDiff('${d}')">${d} ${byDiff[d]}</span>`).join('')
      + (_pdDiff ? `<span class="pd-tab" onclick="event.stopPropagation();setPDDiff('')">All</span>` : '');
  }

  body.innerHTML = shown.length ? shown.slice(0, 250).map(({algo, topicId}) => {
    const via = topicId ? Store.getEntity(topicId)?.name : '';
    return `<div class="pd-row" onclick="showProblemModal('${algo.id}')" ondblclick="zoomTo('${algo.id}', linState.depth)" title="Click to open in AdsHub · Double-click to zoom into this problem">
      <span class="pd-eye" onclick="event.stopPropagation();peekProblem('${algo.id}')" title="Quick peek — preview here without leaving">👁</span>
      <span class="pd-name">${algo.name}</span>
      ${algo.difficulty?`<span class="badge b-${algo.difficulty.toLowerCase()}" style="font-size:10px">${algo.difficulty}</span>`:''}
      ${algo.source?`<span style="color:var(--mt);font-size:11px">#${algo.source}</span>`:''}
      ${via && via !== ent.name ? `<span class="pd-via">via ${via}</span>` : ''}
    </div>`;
  }).join('') + (shown.length > 250 ? `<div class="pd-empty">+${shown.length-250} more — narrow with difficulty filter</div>` : '')
    : '<div class="pd-empty">No problems found for this filter</div>';

  // Auto-open the drawer when there are problems to show (unless caller opts out)
  if (problems.length > 0 && !opts.noAutoOpen && !drawer.classList.contains('open')) drawer.classList.add('open');
}

function toggleRelType(t, on) { linState.relTypes = on ? [...linState.relTypes, t] : linState.relTypes.filter(x => x !== t); updateLineage(); }

function updateLineage() {
  if (!linState.rootId) return;
  const empty = document.getElementById('lin-empty');
  if (empty) empty.style.display = 'none';
  GR.init('lin-graph-ct');

  // Core subgraph from root
  let { nodes, edges } = Lineage.subgraph(linState.rootId, linState.relTypes, linState.direction, linState.depth);
  const knownIds = new Set(nodes.map(n => n.id));

  // 🎯 When ROOT is a TOPIC: always include its direct algorithms (ignoring direction).
  // Double-clicking a topic should show all its problems around it like a hub-spoke.
  const rootEnt = Store.getEntity(linState.rootId);
  const ALGO_CAP = 250;
  if (rootEnt && ['TOPIC','DOMAIN'].includes(rootEnt.concept_type) && linState.relTypes.includes('ASSOCIATES')) {
    const algos = Counts.directAlgos(linState.rootId);
    algos.slice(0, ALGO_CAP).forEach(a => {
      if (!knownIds.has(a.id)) {
        nodes.push({ ...a, depth: 1, isRoot: false });
        knownIds.add(a.id);
      }
    });
    if (algos.length > ALGO_CAP) {
      toast(`Showing first ${ALGO_CAP} of ${algos.length} algorithms — use Problems drawer or filters for the rest`, 'warn');
    }
  }

  // 🎯 When ROOT is an ALGORITHM: always include its directly-associated topics
  // (so context is visible regardless of direction filter) + sibling algorithms from those topics.
  if (rootEnt && rootEnt.concept_type === 'ALGORITHM' && linState.relTypes.includes('ASSOCIATES')) {
    const myTopics = Store.relations
      .filter(r => r.from_id === linState.rootId && r.rel_type === 'ASSOCIATES')
      .map(r => Store.getEntity(r.to_id)).filter(Boolean);
    myTopics.forEach(t => {
      if (!knownIds.has(t.id)) {
        nodes.push({ ...t, depth: 1, isRoot: false });
        knownIds.add(t.id);
      }
    });
    // At depth ≥ 2, also pull in sibling algorithms (other algos sharing same topics) — capped
    if (linState.depth >= 2) {
      const SIB_CAP_PER_TOPIC = 8;
      myTopics.forEach(t => {
        Counts.directAlgos(t.id).slice(0, SIB_CAP_PER_TOPIC).forEach(a => {
          if (a.id !== linState.rootId && !knownIds.has(a.id)) {
            nodes.push({ ...a, depth: 2, isRoot: false });
            knownIds.add(a.id);
          }
        });
      });
    }
  }

  // ── Expand SUBSET_OF chain upward for ANY topic in the result ──
  // For ALGORITHM root: at depth=1 we see topics it tags into; we want their
  // parent topics too so the lineage tree reads top→bottom.
  if (linState.relTypes.includes('SUBSET_OF')) {
    const toAdd = [];
    nodes.forEach(n => {
      if (!['TOPIC','DOMAIN'].includes(n.concept_type)) return;
      let cur = n.id, hop = 0;
      while (cur && hop < 10) {
        const rel = Store.relations.find(r => r.from_id === cur && r.rel_type === 'SUBSET_OF');
        if (!rel) break;
        if (!knownIds.has(rel.to_id)) {
          const parent = Store.getEntity(rel.to_id);
          if (parent) {
            toAdd.push({ ...parent, depth: (n.depth ?? 0) + 1, isRoot: false });
            knownIds.add(rel.to_id);
          }
        }
        cur = rel.to_id;
        hop++;
      }
    });
    nodes.push(...toAdd);
  }

  // For TOPIC roots: also pull siblings (other children of same parent)
  // (rootEnt already declared above)
  if (rootEnt && ['TOPIC','DOMAIN'].includes(rootEnt.concept_type) && linState.relTypes.includes('SUBSET_OF')) {
    const parentRel = Store.relations.find(r => r.from_id === linState.rootId && r.rel_type === 'SUBSET_OF');
    if (parentRel) {
      const siblings = Store.relations
        .filter(r => r.to_id === parentRel.to_id && r.rel_type === 'SUBSET_OF' && r.from_id !== linState.rootId)
        .map(r => Store.getEntity(r.from_id)).filter(Boolean);
      siblings.forEach(s => {
        if (!knownIds.has(s.id)) {
          nodes.push({ ...s, depth: 0, isRoot: false, isSibling: true });
          knownIds.add(s.id);
        }
      });
    }
  }

  // Re-collect ALL edges between any nodes now in the graph
  edges = Store.relations.filter(r =>
    linState.relTypes.includes(r.rel_type) &&
    knownIds.has(r.from_id) && knownIds.has(r.to_id)
  );

  if (!nodes.length) { toast('No connections found', 'warn'); return; }
  GR.render(nodes, edges, linState.layout);

  // Sync breadcrumb + Problems drawer to the new root
  renderBreadcrumb(linState.rootId);
  updateProblemsDrawer(linState.rootId);
}

function submitAlgo() {
  const name = document.getElementById('a-name').value.trim();
  const path = document.getElementById('a-path').value.trim();
  if (!name) { document.getElementById('a-val').innerHTML = `<div class="vmsg verr">✗ Algorithm name is required</div>`; return; }
  if (!path) { document.getElementById('a-val').innerHTML = `<div class="vmsg verr">✗ Tag path is required (e.g. array::subarray::partition)</div>`; return; }
  if (Store.entities.find(e => e.name.toLowerCase() === name.toLowerCase() && e.concept_type === 'ALGORITHM'))
    { document.getElementById('a-val').innerHTML = `<div class="vmsg verr">✗ Algorithm "${name}" already exists</div>`; return; }

  const chain = TagPath.apply(path);
  if (!chain.length) { document.getElementById('a-val').innerHTML = `<div class="vmsg verr">✗ Invalid tag path</div>`; return; }
  const leaf = chain[chain.length - 1];

  const algo = {

function importCSV(event) {
  const files = [...event.target.files];
  const before = { e: Store.entities.length, r: Store.relations.length };
  const read = f => new Promise(res => { const r = new FileReader(); r.onload = e => res({ name: f.name.toLowerCase(), text: e.target.result }); r.readAsText(f); });
  Promise.all(files.map(read)).then(results => {
    Store.importCSV(results.find(r => r.name.includes('entit'))?.text, results.find(r => r.name.includes('relat'))?.text);
    const after = { e: Store.entities.length, r: Store.relations.length };
    const dE = after.e - before.e, dR = after.r - before.r;
    toast(`✓ Now ${after.e} entities · ${after.r} relations  (${dE>=0?'+':''}${dE} ent · ${dR>=0?'+':''}${dR} rel)`, 'ok');
    navigate(curView); event.target.value = '';
  });
}

// Wipe localStorage; auto-reload from server CSVs if served via HTTP;
// otherwise fall back to manual file picker.
async function resetAndReimport() {
  const total = Store.entities.length + Store.relations.length;
  const isHttp = (location.protocol === 'http:' || location.protocol === 'https:');
  const msg = isHttp
    ? `Wipe ${Store.entities.length} entities + ${Store.relations.length} relations?\n\nThe app will auto-reload kg_entities.csv + kg_relations.csv from the server.`
    : `Wipe ${Store.entities.length} entities + ${Store.relations.length} relations from localStorage?\n\nAfter clearing, you'll be prompted to pick the new CSVs.`;
  if (!confirm(msg)) return;
  Store.clearAll();
  toast(`Cleared ${total} records`, 'ok');

  if (isHttp) {
    const loaded = await autoLoadCSVs(true);     // force-reload (don't bail on existing data)
    navigate(curView);
    if (!loaded) toast('Auto-load failed — pick the CSVs manually via ↑ Import', 'warn');
  } else {
    const input = document.querySelector('.sb-ft input[type=file]');
    if (input) { input.value = ''; input.click(); }
    navigate(curView);
  }
}

// Rebuild from current lc_store tags: server regenerates the CSVs, then we reload.
// Server-side (serve.py POST /lineage/refresh → refresh.sh) does:
//   1. build_export_csv.py → leetcode-export-<today>.csv (tags from lc-data blocks)
//   2. node import_lc.js    → kg_entities.csv + kg_relations.csv
// then this reloads them into the graph (step 3). One click = the whole 4-step refresh.
async function rebuildFromTags() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    alert('Rebuild needs the local server. Open this page via http://localhost:8000/ (run serve.py).');
    return;
  }
  if (!confirm('Rebuild lineage from the current problem tags?\n\n'
    + '1) generate a fresh CSV from lc_store\n'
    + '2) regenerate kg_entities.csv + kg_relations.csv\n'
    + '3) reload the graph\n\nTakes ~10–30s.')) return;

  toast('Rebuilding… generating CSV + lineage (~10–30s)', 'ok');
  try {
    const res = await fetch('/lineage/refresh', { method: 'POST' });
    let out = {}; try { out = await res.json(); } catch (_) {}
    if (out.stdout) console.log('[rebuild stdout]\n' + out.stdout);
    if (out.stderr) console.log('[rebuild stderr]\n' + out.stderr);
    if (!res.ok || out.ok === false) {
      toast('Rebuild failed — see console', 'err');
      return;
    }
    const loaded = await autoLoadCSVs(true);   // step 3: reload regenerated CSVs
    navigate(curView);
    toast(loaded
      ? `✓ Rebuilt → ${Store.entities.length} entities · ${Store.relations.length} relations`
      : 'CSVs rebuilt, but auto-reload failed — use ↑ Import', loaded ? 'ok' : 'warn');
  } catch (e) {
    console.error(e);
    toast('Rebuild error: ' + e.message, 'err');
  }
}

// Fetch kg_entities.csv + kg_relations.csv from the server (HTTP mode only).
// Returns true on success, false if not http-mode or fetch fails.
async function autoLoadCSVs(force = false) {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  if (!force && Store.entities.length > 0) return false;  // don't overwrite existing
  try {
    const base = (location.pathname.split('/').slice(0, -1).join('/') || '/') + '/';
    const [eRes, rRes] = await Promise.all([
      fetch(base + 'kg_entities.csv',  { cache: 'no-store' }),
      fetch(base + 'kg_relations.csv', { cache: 'no-store' })
    ]);
    if (!eRes.ok || !rRes.ok) return false;
    const [eText, rText] = await Promise.all([eRes.text(), rRes.text()]);
    if (force) Store.clearAll();
    Store.importCSV(eText, rText);
    toast(`✓ Auto-loaded ${Store.entities.length} entities · ${Store.relations.length} relations from server`, 'ok');
    return true;
  } catch (e) {
    console.warn('CSV auto-load failed:', e);
    return false;
  }
}

// ══════════════════════════════════════════════════════════════
// TOKEN-BASED SEARCH PARSER
// Supports:
//   plain term     → matches name OR path (substring)
//   tag:X          → path contains X
//   name:X         → name contains X
//   easy/medium/hard → difficulty filter
//   >N             → topic has > N total problems
//   multiple terms → ALL must match (AND)
//   "tag: X" with space → normalized to "tag:X"
// ══════════════════════════════════════════════════════════════
function parseSearchTokens(raw) {
  // Normalize "key: value" → "key:value" so spaces after colon work
  const norm = raw.trim().replace(/(\w+):\s+/g, '$1:');
  const tokens = norm.split(/\s+/).filter(Boolean);

  const f = { name: [], path: [], plain: [], diff: null, minCount: 0 };

  tokens.forEach(t => {
    const m = t.match(/^(\w+):(.+)$/);
    if (m) {
      const key = m[1].toLowerCase();
      const val = m[2].toLowerCase();
      switch (key) {
        case 'tag': case 'path':       f.path.push(val); break;
        case 'name':                   f.name.push(val); break;
        case 'easy':                   f.diff = 'Easy';   break;
        case 'medium': case 'med':     f.diff = 'Medium'; break;
        case 'hard':                   f.diff = 'Hard';   break;
        case 'count':                  { const n = parseInt(val.replace(/[^\d]/g,'')); if(!isNaN(n)) f.minCount = n; } break;
        default:                       f.plain.push(t.toLowerCase());
      }
    } else {
      const lo = t.toLowerCase();
      if      (lo === 'easy')                    f.diff = 'Easy';
      else if (lo === 'medium' || lo === 'med')  f.diff = 'Medium';
      else if (lo === 'hard')                    f.diff = 'Hard';
      else if (/^>\d+$/.test(lo))                f.minCount = parseInt(lo.slice(1));
      else                                        f.plain.push(lo);
    }
  });

  return f;
}

// Test whether a topic entity matches the parsed filters
function topicMatches(ent, path, counts, f) {
  const pathLow = (path || '').toLowerCase();
  const nameLow = (ent.name || '').toLowerCase();
  const idLow   = (ent.id || '').toLowerCase();
  // For `tag:` matching: try path, then name, then id (path-scoped IDs contain segments too)
  if (f.path.some(p => !pathLow.includes(p) && !nameLow.includes(p) && !idLow.includes(p))) return false;
  if (f.name.some(n => !nameLow.includes(n))) return false;
  if (f.plain.some(p => !nameLow.includes(p) && !pathLow.includes(p) && !idLow.includes(p))) return false;
  if (f.minCount && counts.total < f.minCount) return false;
  if (f.diff) {
    const has = Counts.allAlgosIn(ent.id).map(x => x.algo).some(a => a.difficulty === f.diff);
    if (!has) return false;
  }
  return true;
}

// All non-empty TOPIC entities, optionally filtered by difficulty
function allActiveTopics(diffFilter) {
  return Store.entities.filter(e => {
    if (!['TOPIC','DOMAIN'].includes(e.concept_type)) return false;
    const c = Counts.forNode(e.id);
    if (c.total === 0) return false;
    if (!diffFilter) return true;
    // Check if this topic has any algorithms of that difficulty
    const algos = Counts.allAlgosIn(e.id).map(x => x.algo);
    return algos.some(a => a.difficulty === diffFilter);
  });
}

// Pick a random topic and navigate to it
function navRandom(diff) {
  const pool = allActiveTopics(diff || tagNav.diffFilter);
  if (!pool.length) { toast('No topics found for that filter', 'warn'); return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const c    = Counts.forNode(pick.id);
  toast(`🎲 ${pick.name}  (${c.total} problems${diff ? ' · ' + diff : ''})`, 'ok');
  navJumpTo(pick.id);
}

// Render the flat All Topics panel
function renderTopicListPanel() {
  const raw  = tagNav.topicFilter;

  // Dropdown still narrows further if set

  let topics = allActiveTopics('')
    .map(e => ({
      ent:  e,
      // Prefer entity.tag_path field (set by import_lc.js and TagPath.apply),
      // fall back to SUBSET_OF walk only if missing
      path: e.tag_path || TagPath.pathOf(e.id) || e.name.toLowerCase(),
      c:    Counts.forNode(e.id)

    .filter(({ ent, path, c }) => topicMatches(ent, path, c, filters));

  topics.sort((a, b) =>
    sort === 'name'   ? a.ent.name.localeCompare(b.ent.name) :

          const fullPath  = path;
          return `
            <div onclick="tnJumpSelect('${ent.id}')" class="tl-row" title="${fullPath}">
              <span class="tl-name">${ent.name}</span>
              <span class="tl-path">${pathShort}</span>
              <div class="tl-counts">
                ${c.direct ? `<span class="tn-nd">${c.direct}</span>` : ''}
                ${c.total !== c.direct ? `<span class="tn-nt">/${c.total}</span>` : ''}
              </div>
            </div>`;
        }).join('') : `<div class="tn-empty">No topics match the filter.</div>`}
      </div>
    </div>`;
}
