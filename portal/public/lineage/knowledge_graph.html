}

// Hook simSetRoot for Lineage Algo view — when user clicks a sim node, chain via laGoTo
const _origSimSetRoot = (typeof simSetRoot === 'function') ? simSetRoot : null;
if (_origSimSetRoot) {
  simSetRoot = function(id) {
    if (curView === 'lineage-algo') { laGoTo(id); return; }
    _origSimSetRoot(id);
  };
}

// ══════════════════════════════════════════════════════════════
// 🌐 FILE:// LIMITED-MODE BANNER
// Detects file:// origin, shows one-command setup, auto-reloads on server up
// ══════════════════════════════════════════════════════════════
(function initServerBanner() {
  if (location.protocol !== 'file:') return;
  if (localStorage.getItem('kg_sv_dismissed') === '1') return;

  const SERVER_URL = 'http://localhost:8000/lineage/knowledge_graph.html';
  const CMD        = 'cd /Users/pradhapganesan/_ADS && python3 -m http.server 8000';

  const banner = document.createElement('div');
  banner.className = 'sv-banner';
  banner.id        = 'sv-banner';
  banner.innerHTML = `
    <div class="sv-hd">
      <span>🌐 Enable embedded problem pages</span>
      <span class="sv-x" onclick="document.getElementById('sv-banner').remove();localStorage.setItem('kg_sv_dismissed','1')" title="Dismiss for this session">×</span>
    </div>
    <div style="color:var(--mt);font-size:12px;line-height:1.5">
      Browser blocks <code style="color:#60a5fa">file://</code> iframes. Run this once in Terminal:
    </div>
    <div class="sv-cmd">
      <code id="sv-cmd-text">${CMD}</code>
      <button class="sv-copy" onclick="navigator.clipboard.writeText(document.getElementById('sv-cmd-text').textContent).then(()=>{this.textContent='✓ Copied';setTimeout(()=>this.textContent='📋 Copy',1500)})">📋 Copy</button>
    </div>
    <div class="sv-status" id="sv-status">
      <span class="sv-dot"></span> Polling http://localhost:8000 …
    </div>
  `;
  document.body.appendChild(banner);

  // Poll for server every 2s. When up, auto-reload to http://localhost:8000
  let polling = true;
  async function poll() {
    if (!polling || !document.getElementById('sv-banner')) return;
    try {
      await fetch(SERVER_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
      // Server up! (fetch resolves even for opaque cross-origin)
      polling = false;
      const st = document.getElementById('sv-status');
      if (st) {
        st.classList.add('ready');
        st.innerHTML = '<span class="sv-dot"></span> ✓ Server up — reloading in 1s…';
      }
      setTimeout(() => { location.href = SERVER_URL; }, 1000);
    } catch (e) {
      setTimeout(poll, 2000);
    }
  }
  poll();
})();

// ══════════════════════════════════════════════════════════════
// 🪟 PROBLEM DETAIL MODAL — click any problem to see full details
// Maximizable, draggable, shows topics + related problems + external links
// ══════════════════════════════════════════════════════════════
function showProblemModal(algoId) {
  const algo = Store.getEntity(algoId);
  if (!algo || algo.concept_type !== 'ALGORITHM') return;

  // Embedded in pghubtech AdsHub → hand the problem back to the portal instead
  // of opening the lc_store iframe (which doesn't exist here).
  if (typeof EMBED !== 'undefined' && EMBED) {
    parent.postMessage({ type: 'kg-open-problem', num: algo.source, name: algo.name }, '*');
    return;
  }

  closeProblemModal(); // close any existing modal first

  const slug = algo.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  // Relative path works when served via HTTP; absolute file:// is fallback for new-tab link
  const relUrl   = `../lc_store/problems/${slug}.html`;
  const fileUrl  = `file:///Users/pradhapganesan/_ADS/lc_store/problems/${slug}.html`;
  const isFile   = location.protocol === 'file:';
  // Iframes can't load file:// pages from a file:// parent (cross-origin block).
  // When served via HTTP, the relative URL just works.
  const iframeUrl = isFile ? fileUrl : relUrl;
  const openUrl   = isFile ? fileUrl : relUrl;

  // Primary tag path (for header display)
  const tagRel  = Store.relations.find(r => r.from_id === algo.id && r.rel_type === 'ASSOCIATES');
  const tagPath = tagRel ? (TagPath.pathOf(tagRel.to_id) || '') : '';

  const iframeBlockNote = isFile ? `
    <div class="pm-block">
      <div style="font-size:14px;font-weight:600;color:var(--warn);margin-bottom:8px">⚠ Iframe blocked by browser security</div>
      <div style="color:var(--mt);font-size:13px;line-height:1.7;max-width:540px">
        You're viewing the app via <code>file://</code>. Browsers block iframes loading other <code>file://</code> pages
        (each is treated as a separate origin). To see the embedded HTML, run a local server:
        <pre style="margin-top:10px;padding:12px;background:var(--bg);border-radius:6px;color:#60a5fa;font-size:12px;overflow-x:auto">cd /Users/pradhapganesan/_ADS && python3 -m http.server 8000</pre>
        Then open: <code style="color:#60a5fa">http://localhost:8000/lineage/knowledge_graph.html</code>
        <div style="margin-top:14px">
          <a href="${fileUrl}" target="_blank" rel="noopener" class="btn btn-pr btn-sm">↗ Or open this problem in a new tab</a>
        </div>
      </div>
    </div>` : '';

  const html = `
    <div class="pm-backdrop" onclick="closeProblemModal()"></div>
    <div class="prob-modal pm-max" id="prob-modal-el">
      <div class="pm-hd" id="pm-drag-hd">
        <span class="pm-title">
          ${algo.source ? `<span style="color:var(--mt);font-size:12px">#${algo.source}</span>` : ''}
          <b>${algo.name}</b>
          ${algo.difficulty ? `<span class="badge b-${algo.difficulty.toLowerCase()}">${algo.difficulty}</span>` : ''}
          ${tagPath ? `<span class="tn-tagpath" style="margin-left:6px;font-size:10px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tagPath}</span>` : ''}
        </span>
        <span class="pm-actions">
          <a class="w-btn" href="${openUrl}" target="_blank" rel="noopener" title="Open the HTML page in a new tab" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">↗</a>
          <button class="w-btn" title="Maximize / Restore" onclick="document.getElementById('prob-modal-el').classList.toggle('pm-max')">▢</button>
          <button class="w-btn" title="Close (Esc)" onclick="closeProblemModal()">×</button>
        </span>
      </div>
      ${isFile ? iframeBlockNote : `
        <iframe class="pm-iframe" src="${iframeUrl}" id="pm-iframe"
          onload="document.getElementById('pm-loading')?.remove()"></iframe>
        <div id="pm-loading" class="pm-loading">Loading ${slug}.html…</div>
      `}
    </div>
  `;

  const wrap = document.createElement('div');
  wrap.id = 'pm-wrap';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);

  // Make the modal draggable by the header
  const modal = document.getElementById('prob-modal-el');
  const hd    = document.getElementById('pm-drag-hd');
  if (modal && hd) {
    let dragging = false, ox = 0, oy = 0;
    hd.addEventListener('mousedown', e => {
      if (e.target.closest('.pm-actions')) return;
      if (modal.classList.contains('pm-max')) return;
      const r = modal.getBoundingClientRect();
      modal.style.transform = 'none';
      modal.style.left = r.left + 'px';
      modal.style.top  = r.top  + 'px';
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      dragging = true;
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      modal.style.left = Math.max(0, e.clientX - ox) + 'px';
      modal.style.top  = Math.max(0, e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', () => {
      dragging = false; document.body.style.userSelect = '';
    });
  }
}

function closeProblemModal() {
  document.getElementById('pm-wrap')?.remove();
}
// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeProblemModal(); closePeek(); }
});

// ══════════════════════════════════════════════════════════════
// 👁 QUICK PEEK — preview a problem in-window without leaving the graph.
// Shows only what the graph already knows (no portal round-trip):
//   #, title, difficulty, primary tag path, associated topics + pat_* tags,
//   and the micro-pattern blurb when a pat_* tag matches the catalog.
// "Open in AdsHub" hands off to the portal (same as a normal row click).
// ══════════════════════════════════════════════════════════════
function closePeek() { document.getElementById('peek-wrap')?.remove(); }

// Hand the problem off to the portal (Browse), mirroring showProblemModal's EMBED path.
function openInBrowse(algoId) {
  const algo = Store.getEntity(algoId);
  if (!algo) return;
  closePeek();
  if (typeof EMBED !== 'undefined' && EMBED) {
    parent.postMessage({ type: 'kg-open-problem', num: algo.source, name: algo.name }, '*');
  } else {
    showProblemModal(algoId);
  }
}

function peekProblem(algoId) {
  const algo = Store.getEntity(algoId);
  if (!algo || algo.concept_type !== 'ALGORITHM') return;
  closePeek();

  // Associated nodes → split LC topics vs pat_* tags
  const assoc = Store.relations
    .filter(r => r.from_id === algo.id && r.rel_type === 'ASSOCIATES')
    .map(r => Store.getEntity(r.to_id)).filter(Boolean);
  const isPat  = t => (t.tag_path || '').startsWith('pat_') || (t.id || '').startsWith('tp_pat_');
  const tags   = assoc.filter(isPat);
  const topics = assoc.filter(t => !isPat(t));

  // ALL micro-pattern notes for this problem (one per matching pat_* tag),
  // deduped. Pulled from the SAME shared catalog (window.PG_PATTERNS via
  // microForEntity) that the Patterns tab renders, so edits there show here too.
  const micros = [];
  const seenMicro = new Set();
  for (const t of tags) {
    const m = microForEntity(t);
    if (m && !seenMicro.has(m.id)) { seenMicro.add(m.id); micros.push(m); }
  }

  const goFn = (typeof curView !== 'undefined' && curView === 'lineage-algo') ? 'laGoTo' : 'zoomTo';
  const chip = (t, cls) =>
    `<span class="peek-chip ${cls}" onclick="closePeek();${goFn}('${t.id}')" title="${(t.tag_path || t.name)} — go here">${t.name}</span>`;

  const microHtml = micros.length ? `
    <div class="peek-micros-hd">🧩 Micro-pattern note${micros.length > 1 ? `s · ${micros.length}` : ''}</div>
    ${micros.map(m => `
    <div class="peek-micro">
      <div class="pk-mi-hd">${m.name || m.id}</div>
      ${m.when     ? `<div class="pk-mi-row"><span>When</span><div>${m.when}</div></div>`     : ''}
      ${m.how      ? `<div class="pk-mi-row"><span>How</span><div>${m.how}</div></div>`       : ''}
      ${m.cost     ? `<div class="pk-mi-row"><span>Cost</span><div>${m.cost}</div></div>`     : ''}
      ${m.contrast ? `<div class="pk-mi-row"><span>Contrast</span><div>${m.contrast}</div></div>` : ''}
    </div>`).join('')}` : '';

  const html = `
    <div class="pm-backdrop" onclick="closePeek()"></div>
    <div class="peek-modal" id="peek-modal-el">
      <div class="peek-hd">
        <span class="peek-title">
          ${algo.source ? `<span style="color:var(--mt);font-size:12px">#${algo.source}</span>` : ''}
          <b>${algo.name}</b>
          ${algo.difficulty ? `<span class="badge b-${algo.difficulty.toLowerCase()}">${algo.difficulty}</span>` : ''}
        </span>
        <button class="w-btn" title="Close (Esc)" onclick="closePeek()">×</button>
      </div>
      <div class="peek-body">
        ${algo.tag_path ? `<div class="peek-path" title="Primary tag path">${algo.tag_path}</div>` : ''}
        ${microHtml}
        ${topics.length ? `<div class="peek-grp"><span class="peek-lbl peek-lbl-t">📚 Topics ${topics.length}</span>${topics.slice(0,20).map(t=>chip(t,'pk-t')).join('')}</div>` : ''}
        ${tags.length   ? `<div class="peek-grp"><span class="peek-lbl peek-lbl-g">🏷 Tags ${tags.length}</span>${tags.slice(0,20).map(t=>chip(t,'pk-g')).join('')}</div>` : ''}
        ${!topics.length && !tags.length ? `<div style="color:var(--mt);font-size:12px">No topics or tags associated.</div>` : ''}
      </div>
      <div class="peek-ft">
        <button class="btn btn-pr btn-sm" onclick="openInBrowse('${algo.id}')">Open in AdsHub ↗</button>
        <button class="btn btn-sec btn-sm" onclick="closePeek();${goFn}('${algo.id}')">Similar problems →</button>
      </div>
    </div>`;

  const wrap = document.createElement('div');
  wrap.id = 'peek-wrap';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}

// ══════════════════════════════════════════════════════════════
// SIDEBAR RESIZER + TOGGLE
// Drag the middle bar to resize · click ◀ to collapse · ▶ to expand
// ══════════════════════════════════════════════════════════════
(function initResizer() {
  const sb = document.querySelector('.sidebar');
  const rz = document.getElementById('resizer');
  if (!sb || !rz) return;

  // Restore saved width
  const saved = localStorage.getItem('kg_sb_w');
  if (saved) sb.style.width = saved;
  // In the portal (embedded) the iframe's own "Knowledge Graph" nav is
  // redundant — collapse it by default unless the user explicitly expanded it.
  const embedded = (() => { try { return window.parent && window.parent !== window; } catch { return true; } })();
  const sbPref = localStorage.getItem('kg_sb_collapsed');
  if (sbPref === '1' || (sbPref === null && embedded)) sb.classList.add('collapsed');

  let dragging = false;
  rz.addEventListener('mousedown', e => {
    if (sb.classList.contains('collapsed')) return;
    dragging = true; rz.classList.add('rz-active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(140, Math.min(500, e.clientX));
    sb.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; rz.classList.remove('rz-active');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
    localStorage.setItem('kg_sb_w', sb.style.width);
  });
  // Double-click resizer to toggle collapse
  rz.addEventListener('dblclick', toggleSidebar);
})();

function toggleSidebar() {
  const sb = document.querySelector('.sidebar');
  if (!sb) return;
  const isCol = sb.classList.toggle('collapsed');
  localStorage.setItem('kg_sb_collapsed', isCol ? '1' : '0');
}

// Toggle the Lineage Explorer's inner controls panel (left of graph)
function toggleLinCtrl() {
  const ctrl = document.querySelector('.lin-ctrl');
  const btn  = document.getElementById('lin-ctrl-toggle');
  if (!ctrl) return;
  const isCol = ctrl.classList.toggle('ctrl-collapsed');
  if (btn) btn.innerHTML = isCol ? '⮞ Controls' : '⮜ Controls';
  localStorage.setItem('kg_linctrl_collapsed', isCol ? '1' : '0');
}

// Restore Lineage controls collapsed state when the view renders
function applyLinCtrlState() {
  const ctrl = document.querySelector('.lin-ctrl');
  const btn  = document.getElementById('lin-ctrl-toggle');
  if (!ctrl) return;
  if (localStorage.getItem('kg_linctrl_collapsed') === '1') {
    ctrl.classList.add('ctrl-collapsed');
    if (btn) btn.innerHTML = '⮞ Controls';
  }
}

// ══════════════════════════════════════════════════════════════
// COLLAPSIBLE CARDS  (Lineage controls + any .card.col-able)
// Persisted per card via data-col-key
// ══════════════════════════════════════════════════════════════
function makeCardsCollapsible(selector) {
  document.querySelectorAll(selector).forEach(card => {
    if (card.dataset.colInit) return;
    card.dataset.colInit = '1';
    card.classList.add('col-able');
    const title = card.querySelector('.card-title');
    if (!title) return;
    // Restore collapsed state
    const key = 'kg_col_' + (card.dataset.colKey || title.textContent.trim().slice(0, 20));
    card.dataset.colKey = key;
    if (localStorage.getItem(key) === '1') card.classList.add('collapsed');
    title.addEventListener('click', e => {
      // Don't toggle when clicking interactive children
      if (e.target !== title && e.target.tagName !== 'B') return;
      card.classList.toggle('collapsed');
      localStorage.setItem(key, card.classList.contains('collapsed') ? '1' : '0');
    });
  });
}

// Auto-make Lineage controls collapsible whenever they render
const _origRenderLineage = renderLineage;
renderLineage = function() {
  _origRenderLineage();
  // Apply after DOM is in place
  requestAnimationFrame(() => {
    makeCardsCollapsible('.lin-ctrl .card');
    applyLinCtrlState();
  });
};

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
// EMBED = running inside an iframe (pghubtech AdsHub). In that mode the graph
// data arrives via postMessage from the portal (built from LCProblems), not
// from the local CSV server, and problem clicks are handed back to the portal.
const EMBED = (() => { try { return window.parent && window.parent !== window; } catch { return true; } })();

Store.init();
navigate('dashboard');   // empty-safe view; switch to 'lineage' once data arrives

// Apply a portal theme id by mirroring it onto this iframe's <html> so the
// data-theme CSS blocks above take effect. 'dark' is the default palette.
function applyKgTheme(theme) {
  const t = (theme || 'dark');
  document.documentElement.setAttribute('data-theme', t);
}

if (EMBED) {
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.type === 'kg-data' && Array.isArray(d.entities)) {
      Store.entities  = d.entities;
      Store.relations = Array.isArray(d.relations) ? d.relations : [];
      Store._bust();   // no Store.save(): ~6k rows would blow the localStorage quota; the portal re-pushes on each load
      if (d.theme) applyKgTheme(d.theme);   // theme rides along with the data push
      // Land on "Lineage + Algorithms" (its empty-root state shows the atlas landing).
      navigate(curView === 'dashboard' ? 'lineage-algo' : curView);
    } else if (d.type === 'kg-theme') {
      applyKgTheme(d.theme);
    } else if (d.type === 'kg-focus' && d.num != null) {
      const id = 'algo_lc_' + String(d.num).replace(/\D/g, '').padStart(4, '0');
      if (Store.getEntity(id)) { navigate('lineage-algo'); laGoTo(id); }
    }
  });
  // Tell the portal we're ready to receive data (covers the race where the
  // parent's load handler fires before this listener is attached).
  try { parent.postMessage({ type: 'kg-ready' }, '*'); } catch {}
}

// Deep link: #lc=953 (or #953) opens the Lineage + Algorithms view focused on
// that problem — linked from each lc_store problem page's "🌳 Lineage" button.
// Resolves the problem number to its algo_lc_NNNN entity.
function applyLineageDeepLink() {
  const m = location.hash.match(/^#(?:lc=)?0*(\d+)\b/);
  if (!m) return false;
  const id = 'algo_lc_' + m[1].padStart(4, '0');
  if (!Store.getEntity(id)) return false;   // data not loaded yet, or no such problem
  navigate('lineage-algo');
  laGoTo(id);
  return true;
}
window.addEventListener('hashchange', applyLineageDeepLink);

// First-time / empty localStorage → auto-fetch the CSVs from the server.
// Silently no-ops when data already loaded OR when on file:// protocol.
// Skipped entirely when EMBED — the portal pushes data via postMessage.
if (!EMBED) {
  if (Store.entities.length === 0) {
    autoLoadCSVs().then(loaded => {
      if (loaded && !applyLineageDeepLink()) navigate(curView);
    });
  } else {
    applyLineageDeepLink();   // data already in localStorage → honor the hash now
  }
}
