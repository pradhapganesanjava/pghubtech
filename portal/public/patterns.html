<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro-Pattern Reference · PG Hub Tech</title>
<style>
  :root {
    --bg: #0f1115; --bg2: #1a1d24; --bg3: #232730;
    --text: #e6e9ef; --text2: #9ba3b3; --text3: #5e6776;
    --border: #2c313c; --primary: #5b8def;
    --easy: #21c46a; --med: #f0a020; --hard: #e34545;
    --code: #f2c2a1;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafbfc; --bg2: #ffffff; --bg3: #f0f2f5;
      --text: #1f2328; --text2: #57606a; --text3: #8c959f;
      --border: #d8dee4;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  a { color: var(--primary); text-decoration: none; } a:hover { text-decoration: underline; }
  code { background: var(--bg3); padding: 1px 4px; border-radius: 3px; font-size: 90%; color: var(--code); }
  .layout { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  /* Mid widths: shrink the sidebar a bit so the main pane breathes. */
  @media (max-width: 900px) { .layout { grid-template-columns: 220px 1fr; } }
  /* Narrow widths (e.g. squeezed inside AdsHub's Patterns split): hide
     the sidebar, let main go full-width. The .mobile-burger button at
     top-left toggles the sidebar back on demand. */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.open { display: block; position: fixed; inset: 0 30% 0 0; z-index: 50; box-shadow: 4px 0 20px rgba(0,0,0,.5); }
  }
  /* ── Sidebar ─────────────────────────────────────────────────────── */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; }
  .side-hd { padding: 14px 14px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .side-hd h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .3px; }
  .side-hd .sub { font-size: 11px; color: var(--text2); }
  /* Primary axis split — Data Structure (problem-input shape) vs Topic
     (solution technique). Bigger / slightly thicker than the view toggle
     below since it changes WHICH patterns are visible at all. */
  .tab-toggle { display: flex; gap: 4px; margin-top: 8px; }
  .tab-toggle button { flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
                       padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .tab-toggle button.active { background: var(--primary); color: white; border-color: var(--primary); }
  /* Icon-only — render style is a small affordance, not a primary axis
     like the tab toggle above. Fixed-width chips, right-aligned. */
  .view-toggle { display: flex; gap: 4px; margin-top: 6px; justify-content: flex-end; }
  .view-toggle button { width: 28px; height: 22px; padding: 0; background: var(--bg3); border: 1px solid var(--border);
                        color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1;
                        display: inline-flex; align-items: center; justify-content: center; }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button.active { background: var(--primary); color: white; border-color: var(--primary); }
  .nav-search { width: 100%; padding: 6px 8px; margin-top: 8px; background: var(--bg3); border: 1px solid var(--border);
                color: var(--text); border-radius: 4px; font-size: 12px; }
  .nav-list { padding: 8px 6px 40px; font-size: 13px; }
  .tree-group { margin-bottom: 4px; }
  .tree-l1 { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px; cursor: pointer; user-select: none; }
  .tree-l1:hover { background: var(--bg3); }
  .tree-l1.active { background: rgba(91,141,239,.15); color: var(--primary); }
  .tree-l1 .caret { color: var(--text3); transition: transform .15s; }
  .tree-l1.expanded .caret { transform: rotate(90deg); }
  .tree-l1 .count { margin-left: auto; font-size: 10px; color: var(--text3); padding: 1px 5px; background: var(--bg3); border-radius: 10px; }
  .tree-l2-wrap { display: none; padding-left: 22px; margin: 2px 0 4px; border-left: 1px dashed var(--border); margin-left: 12px; }
  .tree-l1.expanded + .tree-l2-wrap { display: block; }
  .tree-l2 { display: block; padding: 3px 8px; color: var(--text2); cursor: pointer; border-radius: 4px; font-size: 12px; }
  .tree-l2:hover { background: var(--bg3); color: var(--text); }
  .tree-l2.active { background: rgba(91,141,239,.18); color: var(--primary); }
  /* ── DS-tab linked topics: header + nested L3 micros ───────────────── */
  .tree-topics-hdr { font-size: 9px; color: var(--text3); padding: 8px 8px 2px; text-transform: uppercase; letter-spacing: .6px; }
  .tree-topic-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; user-select: none; border-radius: 4px; font-size: 12px; color: var(--text2); }
  .tree-topic-row:hover { background: var(--bg3); color: var(--text); }
  .tree-topic-row .caret { color: var(--text3); transition: transform .15s; font-size: 9px; }
  .tree-topic-row.expanded .caret { transform: rotate(90deg); }
  .tree-topic-row .ico { font-size: 12px; }
  .tree-topic-row .count { margin-left: auto; font-size: 9px; color: var(--text3); padding: 1px 4px; background: var(--bg3); border-radius: 8px; }
  .tree-l3-wrap { display: none; padding-left: 18px; border-left: 1px dotted var(--border); margin: 1px 0 2px 10px; }
  .tree-topic-row.expanded + .tree-l3-wrap { display: block; }
  .tree-l3 { display: block; padding: 2px 8px; color: var(--text2); cursor: pointer; border-radius: 4px; font-size: 11px; }
  .tree-l3:hover { background: var(--bg3); color: var(--text); }
  .flat-list { padding: 4px 6px 40px; }
  .flat-list .flat-item { display: block; padding: 5px 8px; border-radius: 4px; cursor: pointer; color: var(--text2); font-size: 12px; }
  .flat-list .flat-item:hover { background: var(--bg3); color: var(--text); }
  .flat-list .flat-item .flat-cat { color: var(--text3); font-size: 10px; }
  .flat-list .flat-item.active { background: rgba(91,141,239,.18); color: var(--primary); }
  /* ── Main ────────────────────────────────────────────────────────── */
  .main { overflow-y: auto; padding: 24px 32px; min-width: 0; }
  @media (max-width: 700px) { .main { padding: 56px 14px 24px; } }
  .main h2 { margin: 0 0 6px; font-size: 22px; }
  .main h3 { margin: 24px 0 10px; font-size: 15px; color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .main h4 { margin: 0 0 6px; font-size: 14px; color: var(--text); }
  .lede { color: var(--text2); font-size: 13px; max-width: 70ch; line-height: 1.55; margin: 0 0 18px; }
  .breadcrumb { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .browse-link { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--bg3); border: 1px solid var(--border);
                 border-radius: 4px; font-size: 11px; color: var(--text2); margin-top: 6px; }
  .browse-link:hover { background: var(--primary); color: white; text-decoration: none; }
  /* Card min lowered from 380 → 280 so the grid still shows multiple
     columns at moderate widths and reflows to one column cleanly when
     the pane is squeezed (e.g. inside AdsHub's Patterns split). */
  .micro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 12px 0 28px; }
  .home-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important; }
  .micro { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .micro h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .micro h4 .id { font-size: 9px; color: var(--text3); padding: 2px 6px; background: var(--bg3); border-radius: 3px; font-family: monospace; text-transform: uppercase; }
  .micro p { margin: 6px 0; font-size: 13px; line-height: 1.5; color: var(--text); }
  .micro p.contrast { color: var(--text2); font-size: 12px; border-left: 2px solid var(--primary); padding-left: 8px; margin-top: 10px; }
  .micro .meta { display: flex; gap: 12px; font-size: 11px; color: var(--text3); margin-top: 6px; }
  .anchor-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .anchor { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; background: var(--bg3); border: 1px solid var(--border);
            border-radius: 3px; font-size: 11px; font-family: -apple-system, monospace; }
  .anchor .num { color: var(--text3); }
  .anchor.easy { border-left: 3px solid var(--easy); }
  .anchor.medium { border-left: 3px solid var(--med); }
  .anchor.hard { border-left: 3px solid var(--hard); }
  .mobile-burger { display: none; position: fixed; top: 8px; left: 8px; z-index: 60; background: var(--bg2); border: 1px solid var(--border);
                   color: var(--text); padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  /* Burger shows when sidebar collapses (sync'd with the 700px breakpoint
     above). The main-pane top padding adjustment now lives in the same
     700px @media block earlier in the file. */
  @media (max-width: 700px) { .mobile-burger { display: block; } }
  .empty { color: var(--text2); padding: 24px; text-align: center; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
  .home-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; cursor: pointer;
               transition: transform .1s, border-color .1s; }
  .home-card:hover { border-color: var(--primary); transform: translateY(-1px); }
  .home-card h4 { margin: 0 0 4px; font-size: 14px; }
  .home-card .meta { color: var(--text3); font-size: 11px; margin-top: 4px; }
  .home-card .micro-count { color: var(--primary); font-size: 12px; font-weight: 600; }
  /* ── DS detail pane: embedded topic blocks ────────────────────────── */
  .ds-topic-block { margin-top: 36px; padding-top: 12px; border-top: 2px solid var(--border); }
  .ds-topic-hd { display: flex !important; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
                 margin: 4px 0 6px !important; border-bottom: none !important; padding-bottom: 0 !important; font-size: 15px !important; }
  .ds-topic-hd .ds-topic-ico { font-size: 16px; margin-right: 4px; }
  .ds-topic-hd .ds-topic-count { color: var(--text3); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .ds-topic-hd .topic-jump { font-size: 11px; color: var(--text3); padding: 3px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; }
  .ds-topic-hd .topic-jump:hover { color: var(--primary); border-color: var(--primary); text-decoration: none; }
  .hd-count { color: var(--text3); font-size: 11px; font-weight: 400; margin-left: 6px; }
  /* ── Topic detail pane: "Applies to N data structures" cards ─────── */
  .topic-ds-block { margin-top: 28px; }
  .topic-ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin: 10px 0 8px; }
  .topic-ds-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
                   cursor: pointer; transition: border-color .1s, transform .1s; }
  .topic-ds-card:hover { border-color: var(--primary); transform: translateY(-1px); }
  .topic-ds-card-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .topic-ds-card-hd .topic-ds-ico { font-size: 16px; }
  .topic-ds-card-hd .topic-ds-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .topic-ds-card-hd .topic-ds-arrow { margin-left: auto; color: var(--text3); }
  .topic-ds-card:hover .topic-ds-arrow { color: var(--primary); }
  .topic-ds-note { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .topic-ds-note em { color: var(--text3); }
  /* Topic-tab sidebar "Applies to" row — small DS chip, no caret. */
  .tree-applies-row { padding-left: 22px; }
</style>
</head>
<body>
<button class="mobile-burger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
<div class="layout">
  <aside class="sidebar">
    <div class="side-hd">
      <h1>📐 Micro-Pattern Reference</h1>
      <div class="sub">DS → clue → micro-pattern → anchors. Links open in AdsHub.</div>
      <!-- ── Tab toggle: DS = input shape; Topic = solution technique ── -->
      <div class="tab-toggle">
        <button id="tab-ds"    class="active" onclick="setTab('ds')">📦 Data Structure</button>
        <button id="tab-topic"           onclick="setTab('topic')">🧰 Topic</button>
      </div>
      <!-- View toggle = render-style only (hierarchy vs flat list) so it
           sits as small icon-only buttons next to the search field, not
           full-width labelled buttons like the tab toggle above. -->
      <div class="view-toggle" title="Sidebar render style">
        <button id="vt-tree" class="active" onclick="setView('tree')"
                title="Tree view (grouped by pattern)" aria-label="Tree view">🗂️</button>
        <button id="vt-flat"             onclick="setView('flat')"
                title="Flat view (all micros A-Z)"    aria-label="Flat view">≡</button>
      </div>
      <input class="nav-search" id="navSearch" placeholder="Filter patterns…" oninput="renderNav()">
    </div>
    <div id="navList" class="nav-list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
// HIGH-LEVEL pattern → micro-patterns. Each micro carries:
//   when: the clue / problem shape that triggers this pattern
//   how:  one-line implementation sketch
//   cost: time + space
//   contrast: how it differs from sibling micros
//   anchors: LC ids — click opens the AdsHub deep-link
//
// `topicTag` (optional) goes into the "Browse all in AdsHub" link as a
// search query so the user can pull the full set of LC-tagged problems
// for that high-level pattern.

const PATTERNS = [
  // ── Array ────────────────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────
  // Each entry carries a `tab` field:
  //   'ds'    — the problem INPUT is this data structure (Array, String,
  //             Tree, Graph, Trie design, Stack design, Matrices…).
  //   'topic' — this is a SOLUTION TECHNIQUE that's used across many input
  //             shapes (Two Pointers, DP, BFS, monotonic-stack-as-tool,
  //             heap-as-tool, hash-table-as-tool…).
  //
  // Some categories appear in BOTH tabs (Stack, Trie) with different
  // micros — see e.g. `stack` (DS: bracket-match, expression-eval) and
  // `stack-topic` (Topic: monotonic-stack used on arrays).
  // ─────────────────────────────────────────────────────────────────────
  { tab: 'ds', id: 'array', name: 'Array', icon: '📦', topicTag: 'Array',
    intro: 'Random-access linear sequence. Most LC problems are at heart array problems — the trick is choosing the right pattern from the clue words.',
    micros: [
      { id: 'two-sum-hash', name: 'Two-Sum Hash Lookup',
        when: 'Two numbers must sum to target; array UNSORTED.',
        how: 'Single pass; map[complement] = index; check before insert.',
        cost: 'O(n) time, O(n) space.',
        contrast: 'vs Two-Pointers Converging — that needs the array sorted but uses O(1) extra space.',
        anchors: [1, 167, 653] },
      { id: 'prefix-sum-hashmap', name: 'Prefix Sum + Hash Map',
        when: 'Count / find subarrays summing to K; array may contain NEGATIVES.',
        how: 'Running prefix; map[prefix] = count; answer += map[prefix − K].',
        cost: 'O(n) time, O(n) space.',
        contrast: 'vs Sliding Window — sliding only works when all values are positive (so the window sum is monotone).',
        anchors: [560, 974, 525, 523, 304, 363] },
      { id: 'kadane', name: 'Kadane (Max Subarray Sum)',
        when: 'Max contiguous-subarray sum; allow negatives.',
        how: 'cur = max(x, cur + x); best = max(best, cur).',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs Prefix Sum — Kadane resets the local running sum; prefix sum tracks every cumulative position.',
        anchors: [53, 152, 918, 1567] },
      { id: 'index-as-hash', name: 'Index as Hash (Cyclic Sort / Sign Flip)',
        when: 'Find missing / duplicate in array of size n with values in [1..n].',
        how: 'Place each value at its index, OR mark visited by negating arr[abs(x)-1].',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs Hash Set — same O(n) but O(1) space. Only works when value range bounds the index.',
        anchors: [41, 268, 287, 442, 448] },
      { id: 'in-place-read-write', name: 'In-place Two Pointers (Read / Write)',
        when: 'Remove / dedupe / move elements in place; output size differs.',
        how: 'write = 0; for read 0..n: if keep(read), arr[write++] = arr[read].',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs filter into new array — same logic but constant extra space.',
        anchors: [26, 27, 80, 283, 75] },
      { id: 'rotate-reverse', name: 'Rotate via Triple-Reverse',
        when: 'Rotate array by K in place.',
        how: 'Reverse [0..n), reverse [0..K), reverse [K..n).',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs auxiliary array — triple reverse is the in-place trick.',
        anchors: [189, 48, 151] },
    ],
  },

  // ── String ───────────────────────────────────────────────────────────
  { tab: 'ds', id: 'string', name: 'String', icon: '📝', topicTag: 'String',
    intro: 'Char sequences. Many problems are sliding-window / two-pointer disguised as string; some need DP or trie.',
    micros: [
      { id: 'anagram-keying', name: 'Anagram by Fingerprint Key',
        when: 'Group / detect anagrams.',
        how: 'Key = sorted(str) OR tuple of 26 letter counts. Bucket by key.',
        cost: 'O(n·k log k) sort key OR O(n·k) count key.',
        contrast: 'Count key beats sort key for long strings; sort key is shorter code.',
        anchors: [242, 49, 438] },
      { id: 'palindrome-two-ptr', name: 'Palindrome via Converging Pointers',
        when: 'Check / build palindrome.',
        how: 'l=0, r=n-1; while l<r: if s[l]!=s[r] fail; else l++, r--.',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs DP — two-pointer for VALIDATION; DP for LONGEST palindromic subseq.',
        anchors: [125, 680, 234] },
      { id: 'expand-around-center', name: 'Expand Around Center',
        when: 'Find longest palindromic SUBSTRING.',
        how: 'For each center i (and i,i+1), expand while s[l]==s[r].',
        cost: 'O(n²) time, O(1) space.',
        contrast: 'vs Manacher (O(n) but tricky) — expand-around-center is the interview-friendly version.',
        anchors: [5, 647, 1312] },
      { id: 'minimum-window', name: 'Minimum Window Substring',
        when: 'Smallest window covering all chars of target.',
        how: 'need map + matched counter; shrink window while matched == |need|.',
        cost: 'O(n + m) time, O(charset) space.',
        contrast: 'Templates extend to "longest with K distinct" / "fruits in basket" — same skeleton.',
        anchors: [76, 567, 438, 30] },
      { id: 'word-ladder-bfs', name: 'Word Ladder BFS',
        when: 'Shortest transform between two words via valid intermediates.',
        how: 'BFS over implicit graph; bi-BFS halves the depth.',
        cost: 'O(N·L·26) time.',
        contrast: 'vs DP — BFS for SHORTEST; DP for COUNT of paths.',
        anchors: [127, 433, 752, 126] },
      { id: 'edit-distance-dp', name: 'Edit Distance 2D DP',
        when: 'Minimum operations to transform one string into another.',
        how: 'dp[i][j] = match? dp[i-1][j-1] : 1 + min(insert, delete, replace).',
        cost: 'O(n·m) time, O(n·m) or O(min) space.',
        contrast: 'Generalizes to LCS, Distinct Subseq, Regex match — all 2D char × char DP.',
        anchors: [72, 583, 1143, 10, 44, 583] },
      { id: 'string-match-kmp', name: 'KMP / Z-Algorithm Substring Match',
        when: 'Find first / all occurrences of a pattern in text; detect periodic structure / shortest covering prefix.',
        how: 'Build LPS (longest-proper-prefix-suffix) array of the pattern in O(m); advance text in O(n), fall back via LPS on mismatch.',
        cost: 'O(n + m) time, O(m) space.',
        contrast: 'vs naive O(n·m) scan — KMP reuses partial matches. Rabin-Karp gets the same asymptotic via rolling hash; Z-algorithm is a simpler equivalent.',
        anchors: [28, 459, 214, 686, 1392, 1408] },
    ],
  },

  // ── Linked List ──────────────────────────────────────────────────────
  { tab: 'ds', id: 'linked-list', name: 'Linked List', icon: '🔗', topicTag: 'Linked List',
    intro: 'Sequential nodes with next-pointer. Two-pointer tricks (slow/fast, offset, alignment) dominate.',
    micros: [
      { id: 'floyd-cycle', name: 'Floyd Tortoise-Hare (Cycle Detection)',
        when: 'Does the list contain a cycle? Where does it start?',
        how: 'slow=1, fast=2 step; if they meet, restart slow from head, both step 1, meet at start.',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs Hash Set of seen nodes — Floyd is O(1) space.',
        anchors: [141, 142, 287, 202] },
      { id: 'slow-fast-middle', name: 'Slow/Fast Find Middle',
        when: 'Need middle node in one pass.',
        how: 'slow=1, fast=2 step; when fast hits null, slow = middle.',
        cost: 'O(n) time, O(1) space.',
        contrast: 'Used before reverse-second-half tricks (palindrome, reorder).',
        anchors: [876, 234, 143] },
      { id: 'nth-from-end', name: 'N-th From End via Offset',
        when: 'Remove / find the N-th node from the end.',
        how: 'fast advances N first; then both advance till fast hits null; slow points to target.',
        cost: 'O(n) time, O(1) space.',
        contrast: 'vs two-pass (count then walk) — same complexity, one fewer pass.',
        anchors: [19] },
      { id: 'iterative-reverse', name: 'Iterative Reverse (3 Pointers)',
        when: 'Reverse list or segment of K nodes.',
        how: 'prev=null; while cur: next=cur.next; cur.next=prev; prev=cur; cur=next.',
        cost: 'O(n) time, O(1) space.',
        contrast: 'Recursive reverse: cleaner code, O(n) stack. Iterative for production.',
        anchors: [206, 92, 25, 234] },
      { id: 'aligned-intersect', name: 'Aligned-Length Walk (List Intersection)',
        when: 'Find intersection node of two singly-linked lists.',
        how: 'a=headA, b=headB; while a!=b: a=a?a.next:headB; b=b?b.next:headA.',
        cost: 'O(m+n) time, O(1) space.',
        contrast: 'Elegant alignment trick — equivalent to "skip the length difference".',
        anchors: [160] },
      { id: 'dummy-head-merge', name: 'Dummy-Head Merge',
        when: 'Merge two (or K) sorted lists.',
        how: 'tail=dummy; pick smaller head, append, advance.',

// up on that DS. The same topic appears under multiple DSes — that's the
// point: when browsing "Array" you see every applicable topic with its
// full micro set, without having to remember to flip to the Topic tab.
//
// The Topic tab still owns the source-of-truth view (one topic, all DSes).
const DS_TOPIC_LINKS = {
  'array':       ['hash', 'two-pointers', 'sliding-window', 'binary-search', 'sorting', 'prefix-sum', 'dp', 'greedy', 'stack-topic', 'deque-topic', 'math', 'bits'],
  'string':      ['hash', 'two-pointers', 'sliding-window', 'dp', 'trie-topic', 'stack-topic', 'bfs', 'backtrack'],
  'linked-list': ['two-pointers', 'hash', 'sorting'],
  'tree':        ['dfs', 'bfs', 'dp'],   // (no backtrack — none of its micros fit cleanly under Tree;
                                          //  tree-path enumeration lives in Tree's own core micros.)
  'bst':         ['dfs', 'binary-search'],
  'graph':       ['dfs', 'bfs', 'union-find', 'heap', 'dp', 'greedy'],
  'matrices':    ['dfs', 'bfs', 'dp', 'prefix-sum'],
  // For Stack / Queue / Trie the topic-as-tool variants don't apply: by
  // definition those techniques run on Array / String / Tree / Grid /
  // Graph inputs, not on a stack / queue / trie. So we leave these three
  // DS pages topic-less — the page is a pure input-shape view. Pointer
  // to the corresponding Topic-tab entry is in each intro.
  'stack':       [],
  'queue':       [],
  'trie':        [],
}

// Prefer the CSV-derived list; fall back to the hand-coded DS_TOPIC_LINKS
// constant (offline file:// or first-load before fetch resolves).
//
// EXCEPTION: an EXPLICITLY EMPTY hand-coded list (e.g. DS_TOPIC_LINKS.stack
// = []) is an intentional input-purity decision — those DS pages should
// stay pure even if the CSV derivation surfaces noise from inferDs
// misclassifications. Respect the empty even when derived is populated.
function linkedTopics(dsId) {
  const handCoded = DS_TOPIC_LINKS[dsId]
  if (Array.isArray(handCoded) && handCoded.length === 0) return []
  const ids = (DERIVED?.dsTopics?.[dsId]) || handCoded || []
  return ids.map(id => PATTERNS.find(p => p.id === id)).filter(Boolean)
}

// For a Topic, which DSes is it applied on? Same preference order: derived
// from tag soup first, hand-coded inverse of DS_TOPIC_LINKS as fallback.
function applicableDses(topicId) {
  if (DERIVED?.topicDses?.[topicId]) {
    return DERIVED.topicDses[topicId]
      .map(id => PATTERNS.find(x => x.id === id)).filter(Boolean)
  }
  const out = []
  for (const dsId of Object.keys(DS_TOPIC_LINKS)) {
    if ((DS_TOPIC_LINKS[dsId] || []).includes(topicId)) {
      const p = PATTERNS.find(x => x.id === dsId)
      if (p) out.push(p)
    }
  }
  return out
}

// Return the topic's micros filtered for embedding under a specific DS.
// Preference order:
//   1) CSV-derived allowlist (DERIVED.dsTopicMicros) — populated from
//      every pat_ds::<ds>::<topic>::<micro> tag that exists in the sheet
//   2) hand-coded TOPIC_DS_MICROS allowlist
//   3) all the topic's micros (no allowlist → uniform fit)
function microsForEmbed(topicId, dsId) {
  const t = PATTERNS.find(p => p.id === topicId)
  if (!t) return []
  const derived = DERIVED?.dsTopicMicros?.[dsId]?.[topicId]
  const allow   = derived || (TOPIC_DS_MICROS[topicId] || {})[dsId]
  if (!allow) return t.micros
  const order = new Map(allow.map((id, i) => [id, i]))
  return t.micros
    .filter(m => order.has(m.id))
    .sort((a, b) => order.get(a.id) - order.get(b.id))
}

// ── Data file (CSV) ──────────────────────────────────────────────────────
// Anchors used to live as inline `anchors: [...]` arrays on each micro.
// They now live in /portal/public/patterns-data.csv so that adding a
// problem in AdsHub + tagging it with `pat_*::*` flows through here on
// the next CSV regen — no patterns.html edit needed. CSV columns:
//   anchor_id, tag
// where tag ∈ {
//   pat_ds::<dsId>::core::<microId>            (DS-core micro anchor)
//   pat_topic::<topicId>::<microId>            (Topic micro, DS unknown)
//   pat_ds::<dsId>::<topicId>::<microId>       (full path — Topic embedded
//                                                under specific DS; lets the
//                                                renderer build DS-specific
//                                                allowlists from data)
// }
// If the fetch fails (offline / not regenerated), we fall back to the
// inline `m.anchors` arrays still present on each micro — UI keeps working.
let ANCHOR_DATA = null    // { coreAnchors[dsId][microId] = [ids],
                          //   topicAnchors[topicId][microId] = [ids],
                          //   dsTopicAnchors[dsId][topicId][microId] = [ids] }
let DERIVED = null        // computed from ANCHOR_DATA after CSV load —
                          // { dsTopics[ds] = [topicIds],          (replaces hand-coded DS_TOPIC_LINKS)
                          //   dsTopicMicros[ds][topic] = [micros],(replaces TOPIC_DS_MICROS)
                          //   topicDses[topic] = [dsIds]   }       (powers applicableDses)
                          // Linked/applicable helpers prefer DERIVED when present
                          // and fall back to the hand-coded constants below.

async function loadAnchorData() {
  try {
    // Relative to where patterns.html is served. Cache-busted so a fresh
    // CSV is picked up without manual reload juggling.
    const r = await fetch('patterns-data.csv?ts=' + Date.now(), { cache: 'no-store' })
    if (!r.ok) return null
    const text = await r.text()
    return parsePatternData(text)
  } catch (e) {
    console.warn('[patterns] CSV fetch failed, using inline anchors:', e)
    return null
  }
}

function parsePatternData(csvText) {
  const lines = csvText.split('\n').filter(l => l.trim())
  if (!lines.length) return null
  // Header assumed: anchor_id,tag (we don't enforce — just skip line 1).
  const out = { core: {}, topic: {}, dsTopic: {} }
  for (let i = 1; i < lines.length; i++) {
    const m = lines[i].match(/^(\d+)\s*,\s*(?:"([^"]*)"|([^\n]*))$/)
    if (!m) continue
    const id  = m[1]
    const tag = (m[2] ?? m[3] ?? '').trim()
    const parts = tag.split('::')
    if (parts[0] === 'pat_ds' && parts.length === 4 && parts[2] === 'core') {
      // pat_ds::<ds>::core::<micro>
      const ds = parts[1], micro = parts[3]
      ;(((out.core[ds] = out.core[ds] || {})[micro] = out.core[ds][micro] || [])).push(id)
    } else if (parts[0] === 'pat_topic' && parts.length === 3) {
      // pat_topic::<topic>::<micro>
      const topic = parts[1], micro = parts[2]
      ;(((out.topic[topic] = out.topic[topic] || {})[micro] = out.topic[topic][micro] || [])).push(id)
    } else if (parts[0] === 'pat_ds' && parts.length === 4 && parts[2] !== 'core') {
      // pat_ds::<ds>::<topic>::<micro>  — Topic micro embedded under DS.
      // Counts under both the Topic-tab view (out.topic) and the DS-tab
      // embedded-section view (out.dsTopic).
      const ds = parts[1], topic = parts[2], micro = parts[3]
      ;(((out.topic[topic] = out.topic[topic] || {})[micro] = out.topic[topic][micro] || [])).push(id)
      const a = (out.dsTopic[ds] = out.dsTopic[ds] || {})
      const b = (a[topic] = a[topic] || {})
      ;((b[micro] = b[micro] || [])).push(id)
    }
  }
  return out
}

// Compute the cross-link maps PURELY from the data file. Adding a new tag
// in the sheet (and re-running build-patterns-csv) now propagates to:
//   • DS-tab tree:           which Topics show under each DS
//   • DS-tab embed sections: which micros appear under each (DS, Topic)
//   • Topic-tab "Applies to": which DSes appear under each Topic
// without any patterns.html code edit.
function computeDerivedMaps(data) {
  if (!data) return null
  const dsTopics      = {}    // dsId    → Set<topicId>
  const dsTopicMicros = {}    // dsId    → topicId → Set<microId>
  const topicDses     = {}    // topicId → Set<dsId>
  for (const dsId of Object.keys(data.dsTopic || {})) {
    dsTopics[dsId]      = new Set()
    dsTopicMicros[dsId] = {}
    for (const topicId of Object.keys(data.dsTopic[dsId])) {
      dsTopics[dsId].add(topicId)
      dsTopicMicros[dsId][topicId] = new Set(Object.keys(data.dsTopic[dsId][topicId]))
      ;(topicDses[topicId] = topicDses[topicId] || new Set()).add(dsId)
    }
  }
  const toArr = (s) => [...s]
  return {
    dsTopics:      Object.fromEntries(Object.entries(dsTopics     ).map(([k, v]) => [k, toArr(v)])),
    dsTopicMicros: Object.fromEntries(Object.entries(dsTopicMicros).map(([k, v]) =>
                     [k, Object.fromEntries(Object.entries(v).map(([t, ms]) => [t, toArr(ms)]))])),
    topicDses:     Object.fromEntries(Object.entries(topicDses    ).map(([k, v]) => [k, toArr(v)])),
  }
}

// Anchor lookup used by renderMicroCard. Order of preference:
//   1) parent is DS  + ANCHOR_DATA has DS-core anchors           → use those
//   2) parent is Topic + ANCHOR_DATA has Topic anchors           → use those
//   3) DS-embed-of-topic + ANCHOR_DATA.dsTopic has the entry     → use those
//   4) fallback: inline m.anchors (back-compat)
function anchorsFor(parentPattern, micro, embeddedUnderDsId = null) {
  if (ANCHOR_DATA) {
    if (embeddedUnderDsId) {
      // Embedded under a DS — prefer DS-specific anchors if available,
      // else fall through to the topic's full anchor union (which is what
      // the user sees if we never tagged per-DS).
      const dsSpec = ANCHOR_DATA.dsTopic?.[embeddedUnderDsId]?.[parentPattern.id]?.[micro.id]
      if (dsSpec && dsSpec.length) return dsSpec
      const topicAll = ANCHOR_DATA.topic?.[parentPattern.id]?.[micro.id]
      if (topicAll) return topicAll
    } else if ((parentPattern.tab || 'ds') === 'ds') {
      const a = ANCHOR_DATA.core?.[parentPattern.id]?.[micro.id]
      if (a) return a
    } else {
      const a = ANCHOR_DATA.topic?.[parentPattern.id]?.[micro.id]
      if (a) return a
    }
  }
  // Back-compat fallback — uses the literal anchors still embedded
  // alongside each micro definition.
  return micro.anchors || []
}

// ── Render ───────────────────────────────────────────────────────────────
let view = 'tree'         // 'tree' | 'flat'
let activeTab = 'ds'      // 'ds' | 'topic' — filters which PATTERNS show
let activePatternId = null
let activeMicroId = null

const $ = sel => document.querySelector(sel)

// Patterns visible under the current tab.
function visiblePatterns() {
  return PATTERNS.filter(p => (p.tab || 'ds') === activeTab)
}

function setTab(t) {
  activeTab = t
  document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
  $('#tab-' + t).classList.add('active')
  // If the currently selected pattern doesn't belong to the new tab, clear
  // selection and return to the tab's home — keeps the URL honest and
  // avoids showing an empty nav with a stale main pane.
  if (activePatternId) {
    const stillVisible = visiblePatterns().some(p => p.id === activePatternId)
    if (!stillVisible) { activePatternId = null; activeMicroId = null }
  }
  // Rewrite the hash so refresh / back lands on the same tab.
  writeHash()
  renderNav()
  renderMain()
}

function setView(v) {
  view = v
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'))
  $('#vt-' + v).classList.add('active')
  renderNav()
}

function renderNav() {
  const filter = $('#navSearch').value.trim().toLowerCase()
  const list   = $('#navList')
  list.className = view === 'tree' ? 'nav-list' : 'flat-list'
  list.innerHTML = ''
  if (view === 'tree') renderTree(list, filter)
  else                  renderFlat(list, filter)
}

function renderTree(root, filter) {
  visiblePatterns().forEach(p => {
    const matchesPattern = !filter
      || p.name.toLowerCase().includes(filter)
      || p.micros.some(m => m.name.toLowerCase().includes(filter))
    if (!matchesPattern) return

    const grp = document.createElement('div')
    grp.className = 'tree-group'

    const l1 = document.createElement('div')
    l1.className = 'tree-l1' + (activePatternId === p.id ? ' active expanded' : '')
    l1.innerHTML = `
      <span class="caret">▶</span>
      <span class="ico">${p.icon}</span>
      <span class="lbl">${p.name}</span>
      <span class="count">${p.micros.length}</span>`
    l1.onclick = () => { selectPattern(p.id); l1.classList.toggle('expanded') }
    grp.appendChild(l1)

    const sub = document.createElement('div')
    sub.className = 'tree-l2-wrap'
    p.micros.forEach(m => {
      if (filter && !m.name.toLowerCase().includes(filter) && !p.name.toLowerCase().includes(filter)) return
      const l2 = document.createElement('a')
      l2.className = 'tree-l2' + (activeMicroId === `${p.id}/${m.id}` ? ' active' : '')
      l2.href = `#${p.id}/${m.id}`
      l2.textContent = m.name
      l2.onclick = e => { e.preventDefault(); selectPattern(p.id, m.id) }
      sub.appendChild(l2)
    })

    // ─── Topic-tab only: list the DSes this topic applies to ─────────
    if (activeTab === 'topic') {
      const dses = applicableDses(p.id)
      if (dses.length) {
        const hdr = document.createElement('div')
        hdr.className = 'tree-topics-hdr'
        hdr.textContent = `Applies to (${dses.length})`
        sub.appendChild(hdr)
        dses.forEach(d => {
          if (filter
              && !d.name.toLowerCase().includes(filter)
              && !p.name.toLowerCase().includes(filter)) return
          const a = document.createElement('a')
          a.className = 'tree-topic-row tree-applies-row'
          a.innerHTML = `
            <span class="ico">${d.icon}</span>
            <span class="lbl">${d.name}</span>`
          a.onclick = () => {
            // If we're already on the topic page, scroll to the matching
            // card inside the Applies-To grid; otherwise jump to the DS.
            if (activePatternId === p.id) {
              const el = document.querySelector(`.topic-ds-card[onclick*="${d.id}"]`)
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
              else selectPattern(d.id)
            } else {
              selectPattern(d.id)
            }
          }
          sub.appendChild(a)
        })
      }
    }

    // ─── DS-tab only: linked topics for this DS as expandable rows ────
    // Each topic chip can be expanded inline to show that topic's micros
    // nested underneath — matches the "every topic might have micro
    // patterns underneath" mental model the user asked for.
    if (activeTab === 'ds') {
      const topics = linkedTopics(p.id)
      if (topics.length) {
        const hdr = document.createElement('div')
        hdr.className = 'tree-topics-hdr'
        hdr.textContent = `Topics that apply (${topics.length})`
        sub.appendChild(hdr)

        topics.forEach(t => {
          // Filter to micros that apply on THIS DS (allowlist) — keeps
          // the tree in sync with what the main pane will actually
          // render. If the allowlist eliminates everything, skip the
          // topic entirely.
          const embedded = microsForEmbed(t.id, p.id)
          if (!embedded.length) return

          // Honour the search filter for embedded topics too.
          const tMatches = !filter
            || t.name.toLowerCase().includes(filter)
            || embedded.some(m => m.name.toLowerCase().includes(filter))
          if (!tMatches) return

          // Topic header row — click toggles inline expansion, anchor link
          // jumps to that section in the DS main pane.
          const tHdr = document.createElement('div')
          tHdr.className = 'tree-topic-row'
          tHdr.innerHTML = `
            <span class="caret">▶</span>
            <span class="ico">${t.icon}</span>
            <span class="lbl">${t.name}</span>
            <span class="count">${embedded.length}</span>`
          tHdr.onclick = () => {
            tHdr.classList.toggle('expanded')
            // Also scroll the main-pane to the matching topic section.
            if (activePatternId === p.id) {
              const el = document.getElementById(`ds-topic-${p.id}-${t.id}`)
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
            }
          }
          sub.appendChild(tHdr)

          // L3 wrap with the topic's own micros (deeper indent).
          const tSub = document.createElement('div')
          tSub.className = 'tree-l3-wrap'
          embedded.forEach(m => {
            if (filter && !m.name.toLowerCase().includes(filter) && !t.name.toLowerCase().includes(filter)) return
            const l3 = document.createElement('a')
            l3.className = 'tree-l3'
            l3.href = `#topic/${t.id}/${m.id}`
            l3.textContent = m.name
            l3.onclick = e => {
              e.preventDefault()
              // Scroll to that card inside the current DS pane (don't
              // navigate away — user said "show the topic UNDER the DS").
              if (activePatternId === p.id) {
                const el = document.getElementById(`m-${t.id}-${m.id}`)
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
              } else {
                selectPattern(p.id)
                setTimeout(() => {
                  const el = document.getElementById(`m-${t.id}-${m.id}`)
                  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
                }, 60)
              }
            }
            tSub.appendChild(l3)
          })
          sub.appendChild(tSub)
        })
      }
    }

    grp.appendChild(sub)
    root.appendChild(grp)
  })
}

function renderFlat(root, filter) {
  const items = []
  visiblePatterns().forEach(p => p.micros.forEach(m => items.push({ p, m })))
  items.sort((a, b) => a.m.name.localeCompare(b.m.name))
  items.forEach(({ p, m }) => {
    if (filter && !m.name.toLowerCase().includes(filter) && !p.name.toLowerCase().includes(filter)) return
    const it = document.createElement('a')
    it.className = 'flat-item' + (activeMicroId === `${p.id}/${m.id}` ? ' active' : '')
    it.href = `#${p.id}/${m.id}`
    it.innerHTML = `${m.name} <span class="flat-cat">· ${p.name}</span>`
    it.onclick = e => { e.preventDefault(); selectPattern(p.id, m.id) }
    root.appendChild(it)
  })
}

function selectPattern(pid, mid = null) {
  // If the target pattern lives under the other tab, jump to that tab
  // first — keeps cross-tab links (e.g. home cards, anchor refs) honest.
  const p = PATTERNS.find(x => x.id === pid)
  if (p && (p.tab || 'ds') !== activeTab) {
    activeTab = p.tab || 'ds'
    document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
    const tb = $('#tab-' + activeTab); if (tb) tb.classList.add('active')
  }
  activePatternId = pid
  activeMicroId   = mid ? `${pid}/${mid}` : null
  writeHash()
  renderNav()
  renderMain()
  if (mid) {
    setTimeout(() => {
      const el = document.getElementById(`m-${pid}-${mid}`)
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }, 40)
  }
}

// URL shape: #<tab>[/pattern[/micro]]  e.g. #topic/dfs/dfs-template
function writeHash() {
  let h = activeTab
  if (activePatternId) {
    h += '/' + activePatternId
    if (activeMicroId) h += '/' + activeMicroId.split('/')[1]
  }
  // Use replace-style: avoid spamming history while clicking around.
  history.replaceState(null, '', '#' + h)
}

const DIFF_HINT = {  // Light-weight difficulty hint, just for the card colour. Exact difficulty is in AdsHub.
  // Most LC problems are medium; we leave class blank where unknown.
}

function renderMain() {
  const main = $('#main')
  if (!activePatternId) { renderHome(main); return }
  const p = PATTERNS.find(x => x.id === activePatternId)
  if (!p) { renderHome(main); return }
  const browseUrl = `adshub?q=${encodeURIComponent(p.topicTag || p.name)}`
  const isDS    = (p.tab || 'ds') === 'ds'
  const tabLabel = isDS ? '📦 Data Structure' : '🧰 Topic'

  // For DS patterns: embed the topics that apply to this DS (with their
  // full micro card grids).
  // For Topic patterns: show which DSes this topic is applied on, each
  // with a one-line "how" note and a click-through to the DS page.
  const topics = isDS ? linkedTopics(p.id) : []
  const dses   = !isDS ? applicableDses(p.id) : []
  const coreLabel = (isDS && topics.length) || (!isDS && dses.length)
    ? `Core ${p.name} micros`
    : `${p.micros.length} micro-patterns`

  const topicSections = topics.map(t => {
    // Filter to micros that ACTUALLY apply to this DS (e.g. don't show
    // tp-fast-slow under String — its anchors are all linked-list).
    const embedded = microsForEmbed(t.id, p.id)
    const filtered = embedded.length !== t.micros.length
    return `
    <div class="ds-topic-block" id="ds-topic-${p.id}-${t.id}">
      <h3 class="ds-topic-hd">
        <span><span class="ds-topic-ico">${t.icon}</span> ${t.name}
          <span class="ds-topic-count">${embedded.length}${filtered ? ` of ${t.micros.length}` : ''} micros${filtered ? ` apply to ${p.name}` : ''}</span>
        </span>
        <a class="topic-jump" href="#topic/${t.id}"
           onclick="event.preventDefault(); selectPattern('${t.id}')">→ open in Topic tab</a>
      </h3>
      <p class="lede" style="margin-top:-2px">${t.intro}</p>
      <div class="micro-grid">
        ${embedded.map(m => renderMicroCard(t, m, p.id /* embeddedUnderDsId */)).join('')}
      </div>
    </div>`
  }).join('')

  // "Applies to" — one card per DS that lists this topic in DS_TOPIC_LINKS.
  // The note explains HOW this topic shows up on that DS (e.g. DFS on
  // Tree = "pre/in/post-order + tree DP"). Where no per-pair note exists
  // we degrade to a generic prompt.
  const dsSection = dses.length ? `
    <div class="topic-ds-block">
      <h3>Applies to ${dses.length} data structure${dses.length>1?'s':''}</h3>
      <p class="lede" style="margin-top:-4px">
        How this topic is typically used on each DS. Click any card to jump to that DS's page,
        where the topic appears embedded under its own section.
      </p>
      <div class="topic-ds-grid">
        ${dses.map(d => {
          const note = topicDsNote(p.id, d.id)
          return `
          <div class="topic-ds-card" onclick="selectPattern('${d.id}')">
            <div class="topic-ds-card-hd">
              <span class="topic-ds-ico">${d.icon}</span>
              <span class="topic-ds-name">${d.name}</span>
              <span class="topic-ds-arrow">→</span>
            </div>
            <div class="topic-ds-note">${note || `<em>Click to see ${p.name} embedded under ${d.name}.</em>`}</div>
          </div>`
        }).join('')}
      </div>
    </div>
  ` : ''

  main.innerHTML = `
    <div class="breadcrumb">${tabLabel}</div>
    <h2>${p.icon} ${p.name}</h2>
    <p class="lede">${p.intro}</p>
    <a class="browse-link" href="${browseUrl}" target="_blank" rel="noopener"
       onclick="onBrowseLinkClick(event, ${JSON.stringify(p.topicTag || p.name)})">
      ↗ Browse all "${p.topicTag || p.name}"-tagged problems in AdsHub
    </a>
    <h3>${coreLabel}${((isDS&&topics.length)||(!isDS&&dses.length)) ? ` <span class="hd-count">(${p.micros.length})</span>` : ''}</h3>
    <div class="micro-grid">
      ${p.micros.map(m => renderMicroCard(p, m)).join('')}
    </div>
    ${topicSections}
    ${dsSection}
  `
}

// True when this page is loaded inside an iframe (e.g. AdsHub's Patterns
// mode embeds /patterns.html). When embedded we postMessage instead of
// navigating so the host can switch its own state to "browse + select
// this problem" — same UX as clicking a row in the AdsHub list.
const EMBEDDED = (() => { try { return window.parent && window.parent !== window } catch { return false } })()

function onAnchorClick(e, id) {
  if (!EMBEDDED) return  // normal target=_blank navigation kicks in
  e.preventDefault()
  window.parent.postMessage({ type: 'pghub-open-problem', id }, '*')
}
function onBrowseLinkClick(e, q) {
  if (!EMBEDDED) return
  e.preventDefault()
  window.parent.postMessage({ type: 'pghub-search', q }, '*')
}

function renderMicroCard(p, m, embeddedUnderDsId = null) {
  const ids = anchorsFor(p, m, embeddedUnderDsId)
  const anchors = ids.map(id => `
    <a class="anchor" href="adshub?id=${id}" target="_blank" rel="noopener"
       onclick="onAnchorClick(event, ${id})">
      <span class="num">#${id}</span>
    </a>`).join('')
  return `
    <div class="micro" id="m-${p.id}-${m.id}">
      <h4><span class="id">${m.id}</span>${m.name}</h4>
      <p><strong>When:</strong> ${m.when}</p>
      <p><strong>How:</strong> ${m.how}</p>
      <div class="meta"><strong>Cost:</strong> ${m.cost}</div>
      <p class="contrast"><strong>Contrast:</strong> ${m.contrast}</p>
      <div class="anchor-list">${anchors}</div>
    </div>
  `
}

function renderHome(main) {
  const here        = visiblePatterns()
  const totalMicros = here.reduce((s, p) => s + p.micros.length, 0)
  const grandTotal  = PATTERNS.reduce((s, p) => s + p.micros.length, 0)
  const isDS        = activeTab === 'ds'
  const tabTitle    = isDS ? '📦 Data Structure'    : '🧰 Topic'
  const tabBlurb    = isDS
    ? `Patterns grouped by the <strong>input data structure</strong> — what shape does the problem GIVE you?
       Look here when the problem is about THE structure itself (e.g. "design a stack", "validate a BST").`
    : `Patterns grouped by <strong>solution technique</strong> — Sliding Window, DP, DFS, BFS, monotonic-stack-as-tool, etc.
       Look here when you know the shape but need the trick that solves it.`
  main.innerHTML = `
    <h2>📐 Micro-Pattern Reference · ${tabTitle}</h2>
    <p class="lede">
      ${here.length} categories in this tab · ${totalMicros} micro-patterns
      <span style="color:var(--text3)">(${PATTERNS.length} categories · ${grandTotal} micros across both tabs)</span>
    </p>
    <p class="lede" style="margin-top:-8px">${tabBlurb}</p>
    <p class="lede" style="margin-top:-8px">
      <strong>How to use:</strong> ${isDS
        ? 'identify the data structure of the input → scan the <em>"When"</em> on each micro-card → the matching one is the canonical move.'
        : 'pick the technique the problem cries out for → scan the <em>"When"</em> → the matching micro is the template to type.'}
      Some categories (Stack, Trie) appear in both tabs with different micros — flip the tab to see the other side.
    </p>
    <div class="home-grid">
      ${here.map(p => {
        const extraCount = isDS ? linkedTopics(p.id).length : applicableDses(p.id).length
        const extraLabel = isDS ? 'topics' : 'DSes'
        return `
        <div class="home-card" onclick="selectPattern('${p.id}')">
          <h4>${p.icon} ${p.name}</h4>
          <div class="micro-count">${p.micros.length} micro${extraCount ? ` <span style="color:var(--text3);font-weight:400">· ${extraCount} ${extraLabel}</span>` : ''}</div>
          <div class="meta">${p.intro.slice(0, 90)}${p.intro.length > 90 ? '…' : ''}</div>
        </div>`
      }).join('')}
    </div>
    <h3>Tie back to AdsHub</h3>
    <p class="lede">
      Each pattern's "Browse all in AdsHub" link uses the existing AdsHub search to surface ALL problems tagged with that topic — typically hundreds, vs the ~5-8 anchors shown per micro-card here.
      Anchor links open the problem directly via <code>?id=NNN</code>.
    </p>
  `
}

// ── URL hash routing ────────────────────────────────────────────────────
// New shape:   #<tab>/<pattern>/<micro>   e.g. #topic/dfs/dfs-template
// Legacy:      #<pattern>/<micro>         (auto-resolves the tab from the
//                                          pattern's `tab` field)
function applyHash() {
  const h = location.hash.replace(/^#/, '')
  if (!h) {
    // Bare URL → keep current tab default ('ds'), no pattern selected.
    syncTabButtons()
    renderNav(); renderMain()
    return
  }
  const parts = h.split('/')
  // Detect new shape: first segment is 'ds' or 'topic'.
  if (parts[0] === 'ds' || parts[0] === 'topic') {
    activeTab       = parts[0]
    activePatternId = parts[1] || null
    activeMicroId   = parts[2] ? `${parts[1]}/${parts[2]}` : null
  } else {
    // Legacy shape — derive tab from pattern.
    const pid = parts[0], mid = parts[1]
    const p   = PATTERNS.find(x => x.id === pid)
    activeTab       = (p && p.tab) || 'ds'
    activePatternId = pid
    activeMicroId   = mid ? `${pid}/${mid}` : null
  }
  syncTabButtons()
  renderNav(); renderMain()
  if (activeMicroId) {
    setTimeout(() => {
      const [pid, mid] = activeMicroId.split('/')
      const el = document.getElementById(`m-${pid}-${mid}`)
      if (el) el.scrollIntoView({ block: 'start' })
    }, 40)
  }
}
function syncTabButtons() {
  document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
  const tb = $('#tab-' + activeTab); if (tb) tb.classList.add('active')
}
window.addEventListener('hashchange', applyHash)

// Boot: try to fetch the CSV first (if served alongside this file). If the
// fetch resolves, ANCHOR_DATA is populated and every renderMicroCard call
// pulls live data; if it rejects (e.g. opening the html via file://) we
// fall through to the inline `m.anchors` arrays still attached to each
// micro — the UI stays functional offline.
loadAnchorData().then(data => {
  ANCHOR_DATA = data
  DERIVED     = computeDerivedMaps(data)
  if (data) {
    const coreCount  = Object.values(data.core   ).reduce((s, o) => s + Object.values(o).reduce((a, b) => a + b.length, 0), 0)
    const topicCount = Object.values(data.topic  ).reduce((s, o) => s + Object.values(o).reduce((a, b) => a + b.length, 0), 0)
    const dsTopCount = Object.values(data.dsTopic).reduce((s, ds) => s + Object.values(ds).reduce((a, t) => a + Object.values(t).reduce((x, ids) => x + ids.length, 0), 0), 0)
    const dsLinks = Object.values(DERIVED?.dsTopics      || {}).reduce((s, a) => s + a.length, 0)
    const tLinks  = Object.values(DERIVED?.topicDses     || {}).reduce((s, a) => s + a.length, 0)
    console.info(`[patterns] CSV loaded — ${coreCount} DS-core, ${topicCount} topic, ${dsTopCount} DS-of-topic anchors  ·  derived: ${dsLinks} DS→topic edges, ${tLinks} topic→DS edges`)
  } else {
    console.info('[patterns] no CSV found, using inline m.anchors arrays + hand-coded link maps')
  }
  applyHash()
})
</script>
</body>
</html>
