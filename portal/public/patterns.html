<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micro-Pattern Reference · PG Hub Tech</title>
<style>
  :root {
    --bg: #0f1115; --bg2: #1a1d24; --bg3: #232730;
    --text: #e6e9ef; --text2: #9ba3b3; --text3: #5e6776;
    --border: #2c313c; --primary: #5b8def;
    --easy: #21c46a; --med: #f0a020; --hard: #e34545;
    --code: #f2c2a1;
  }
  /* ── Portal theme compliance ──────────────────────────────────────────
     The portal sets data-theme on its <html>; AdsHubView forwards it here
     (pghub-theme message → data-theme on this iframe's <html>). These blocks
     remap the reference's vars onto the portal palette so Patterns matches
     the chosen theme. Values mirror portal/src/App.css. Replaces the old
     prefers-color-scheme media query, which ignored the portal setting. */
  html[data-theme="dark"] {
    --bg: #0f0f13; --bg2: #1a1a24; --bg3: #252535;
    --text: #e2e2f0; --text2: #9090b0; --text3: #5e6776;
    --border: #2e2e42; --primary: #6366f1;
  }
  html[data-theme="light"] {
    --bg: #f5f5ff; --bg2: #ffffff; --bg3: #eaeaf8;
    --text: #1a1a2e; --text2: #5252a0; --text3: #8c8cc0;
    --border: #c8c8e8; --primary: #6366f1; --code: #b05a2c;
  }
  html[data-theme="soft"] {
    --bg: #1e1b34; --bg2: #28244a; --bg3: #342f60;
    --text: #ddd8ff; --text2: #8880c8; --text3: #6a6498;
    --border: #3d3870; --primary: #a78bfa;
  }
  html[data-theme="contrast"] {
    --bg: #000000; --bg2: #0f0f0f; --bg3: #1a1a1a;
    --text: #ffffff; --text2: #bbbbbb; --text3: #888888;
    --border: #555555; --primary: #faff00;
    --easy: #00ff88; --med: #ff9900; --hard: #ff3344;
  }
  html[data-theme="glow"] {
    --bg: #050510; --bg2: #0a0a28; --bg3: #0f0f3f;
    --text: #d0e4ff; --text2: #5070d0; --text3: #3a4a90;
    --border: #1e1e80; --primary: #00e5ff;
    --easy: #00ff99; --med: #ffcc00; --hard: #ff2266;
  }
  html[data-theme="cartoon"] {
    --bg: #fff9e6; --bg2: #ffffff; --bg3: #fff3c8;
    --text: #2d2416; --text2: #786030; --text3: #a08850;
    --border: #f0c040; --primary: #7c3aed; --code: #b05a2c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  a { color: var(--primary); text-decoration: none; } a:hover { text-decoration: underline; }
  code { background: var(--bg3); padding: 1px 4px; border-radius: 3px; font-size: 90%; color: var(--code); }
  .layout { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  /* Mid widths: shrink the sidebar a bit so the main pane breathes. */
  @media (max-width: 900px) { .layout { grid-template-columns: 220px 1fr; } }
  /* Narrow widths (e.g. squeezed inside AdsHub's Patterns split): hide
     the sidebar, let main go full-width. The .mobile-burger button at
     top-left toggles the sidebar back on demand. */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.open { display: block; position: fixed; inset: 0 30% 0 0; z-index: 50; box-shadow: 4px 0 20px rgba(0,0,0,.5); }
  }
  /* ── Sidebar ─────────────────────────────────────────────────────── */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; }
  .side-hd { padding: 14px 14px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .side-hd h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .3px; }
  .side-hd .sub { font-size: 11px; color: var(--text2); }
  /* Primary axis split — Data Structure (problem-input shape) vs Topic
     (solution technique). Bigger / slightly thicker than the view toggle
     below since it changes WHICH patterns are visible at all. */
  .tab-toggle { display: flex; gap: 4px; margin-top: 8px; }
  .tab-toggle button { flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
                       padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .tab-toggle button.active { background: var(--primary); color: white; border-color: var(--primary); }
  /* Icon-only — render style is a small affordance, not a primary axis
     like the tab toggle above. Sits inline with the search field. */
  .view-toggle { display: flex; gap: 4px; flex-shrink: 0; }
  .view-toggle button { width: 28px; height: 28px; padding: 0; background: var(--bg3); border: 1px solid var(--border);
                        color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1;
                        display: inline-flex; align-items: center; justify-content: center; }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button.active { background: var(--primary); color: white; border-color: var(--primary); }
  /* Search + view-toggle row. Search flex-grows; toggles right-anchored.
     min-width:0 on the input lets it shrink below its intrinsic size
     so the toggles don't get pushed off-screen at very narrow widths.
     flex-wrap means the toggles drop to a new row only when the input
     can't get any smaller without becoming unusable (~120px). */
  .search-row { display: flex; gap: 4px; align-items: stretch; margin-top: 8px; flex-wrap: wrap; }
  .nav-search { flex: 1 1 120px; min-width: 0; padding: 6px 8px;
                background: var(--bg3); border: 1px solid var(--border);
                color: var(--text); border-radius: 4px; font-size: 12px; height: 28px; box-sizing: border-box; }
  .nav-list { padding: 8px 6px 40px; font-size: 13px; }
  .tree-group { margin-bottom: 4px; }
  /* Sidebar rows are clickable but text stays SELECTABLE so the user
     can copy labels (DS / topic / micro names). cursor:pointer kept;
     user-select left at the browser default (text). Click handlers
     also short-circuit when there's an active text selection (see
     guardTextSelectClick) so dragging across a label doesn't navigate. */
  .tree-l1 { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
  .tree-l1:hover { background: var(--bg3); }
  .tree-l1.active { background: rgba(91,141,239,.15); color: var(--primary); }
  .tree-l1 .caret { color: var(--text3); transition: transform .15s; }
  .tree-l1.expanded .caret { transform: rotate(90deg); }
  .tree-l1 .count { margin-left: auto; font-size: 10px; color: var(--text3); padding: 1px 5px; background: var(--bg3); border-radius: 10px; }
  .tree-l2-wrap { display: none; padding-left: 22px; margin: 2px 0 4px; border-left: 1px dashed var(--border); margin-left: 12px; }
  .tree-l1.expanded + .tree-l2-wrap { display: block; }
  .tree-l2 { display: block; padding: 3px 8px; color: var(--text2); cursor: pointer; border-radius: 4px; font-size: 12px; }
  .tree-l2:hover { background: var(--bg3); color: var(--text); }
  .tree-l2.active { background: rgba(91,141,239,.18); color: var(--primary); }
  /* ── DS-tab linked topics: header + nested L3 micros ───────────────── */
  .tree-topics-hdr { font-size: 9px; color: var(--text3); padding: 8px 8px 2px; text-transform: uppercase; letter-spacing: .6px; }
  .tree-topic-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; color: var(--text2); }
  .tree-topic-row:hover { background: var(--bg3); color: var(--text); }
  .tree-topic-row .caret { color: var(--text3); transition: transform .15s; font-size: 9px; }
  .tree-topic-row.expanded .caret { transform: rotate(90deg); }
  .tree-topic-row .ico { font-size: 12px; }
  .tree-topic-row .count { margin-left: auto; font-size: 9px; color: var(--text3); padding: 1px 4px; background: var(--bg3); border-radius: 8px; }
  .tree-l3-wrap { display: none; padding-left: 18px; border-left: 1px dotted var(--border); margin: 1px 0 2px 10px; }
  .tree-topic-row.expanded + .tree-l3-wrap { display: block; }
  .tree-l3 { display: block; padding: 2px 8px; color: var(--text2); cursor: pointer; border-radius: 4px; font-size: 11px; }
  .tree-l3:hover { background: var(--bg3); color: var(--text); }
  .flat-list { padding: 4px 6px 40px; }
  .flat-list .flat-item { display: block; padding: 5px 8px; border-radius: 4px; cursor: pointer; color: var(--text2); font-size: 12px; }
  .flat-list .flat-item:hover { background: var(--bg3); color: var(--text); }
  .flat-list .flat-item .flat-cat { color: var(--text3); font-size: 10px; }
  .flat-list .flat-item.active { background: rgba(91,141,239,.18); color: var(--primary); }
  /* ── Main ────────────────────────────────────────────────────────── */
  .main { overflow-y: auto; padding: 24px 32px; min-width: 0; }
  @media (max-width: 700px) { .main { padding: 56px 14px 24px; } }
  .main h2 { margin: 0 0 6px; font-size: 22px; }
  .main h3 { margin: 24px 0 10px; font-size: 15px; color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .main h4 { margin: 0 0 6px; font-size: 14px; color: var(--text); }
  .lede { color: var(--text2); font-size: 13px; max-width: 70ch; line-height: 1.55; margin: 0 0 18px; }
  .breadcrumb { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .browse-link { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--bg3); border: 1px solid var(--border);
                 border-radius: 4px; font-size: 11px; color: var(--text2); margin-top: 6px; }
  .browse-link:hover { background: var(--primary); color: white; text-decoration: none; }
  /* Main-pane "expand all notes" toggle — flips every per-micro
     notes-block open at once for fast scanning. */
  .expand-all-notes { display: inline-flex; align-items: center; padding: 4px 8px;
                      background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
                      font-size: 11px; color: var(--text2); cursor: pointer; margin: 6px 0 0 6px;
                      font-family: inherit; }
  .expand-all-notes:hover { color: var(--primary); border-color: var(--primary); }
  /* Card min lowered from 380 → 280 so the grid still shows multiple
     columns at moderate widths and reflows to one column cleanly when
     the pane is squeezed (e.g. inside AdsHub's Patterns split). */
  .micro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 12px 0 28px; }
  .home-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important; }
  .micro { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
           transition: border-color .12s, transform .08s; }
  /* Whole-card click opens the deep-dive drawer (handler checks for
     interactive children + text selection before firing). Subtle hover
     hint so the affordance is discoverable without being shouty. */
  .micro.micro--clickable { cursor: pointer; }
  .micro.micro--clickable:hover { border-color: var(--primary); transform: translateY(-1px); }
  .micro.micro--clickable:hover .micro-info-btn { color: var(--primary); border-color: var(--primary); }
  .micro h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .micro h4 .id { font-size: 9px; color: var(--text3); padding: 2px 6px; background: var(--bg3); border-radius: 3px; font-family: monospace; text-transform: uppercase; }
  .micro h4 .micro-name { flex: 1; }
  /* ⓘ deep-dive button — opens the detail drawer. Subtle by default,
     glows on hover so the user knows it's clickable but it doesn't
     compete with the card content. */
  .micro-info-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text3);
                    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 13px;
                    line-height: 1; display: inline-flex; align-items: center; justify-content: center;
                    padding: 0; font-family: inherit; flex-shrink: 0; }
  .micro-info-btn:hover { color: var(--primary); border-color: var(--primary); transform: scale(1.05); }
  .micro p { margin: 6px 0; font-size: 13px; line-height: 1.5; color: var(--text); }
  .micro p.contrast { color: var(--text2); font-size: 12px; border-left: 2px solid var(--primary); padding-left: 8px; margin-top: 10px; }
  .micro .meta { display: flex; gap: 12px; font-size: 11px; color: var(--text3); margin-top: 6px; }
  .anchor-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .anchor { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; background: var(--bg3); border: 1px solid var(--border);
            border-radius: 3px; font-size: 11px; font-family: -apple-system, monospace; }
  .anchor .num { color: var(--text3); }
  .anchor.easy { border-left: 3px solid var(--easy); }
  .anchor.medium { border-left: 3px solid var(--med); }
  .anchor.hard { border-left: 3px solid var(--hard); }
  /* has-note dot: small visual cue that hovering this chip shows a
     per-problem application note. Subtle on purpose. */
  .anchor.has-note { border-bottom: 1px dotted var(--primary); }
  .anchor-has-note { color: var(--primary); margin-left: 3px; font-size: 9px; }
  /* Per-micro "show notes" toggle + expandable block. Hidden by default
     to keep the card compact; click expands an inline list of every
     anchor's application note. */
  .notes-toggle { background: none; border: none; color: var(--text3); cursor: pointer;
                  font-size: 11px; margin-top: 10px; padding: 2px 0; font-family: inherit; }
  .notes-toggle:hover { color: var(--primary); }
  .notes-block { display: none; margin-top: 6px; padding: 8px 10px; background: var(--bg3);
                 border-radius: 4px; font-size: 11.5px; line-height: 1.55; }
  .micro.notes-open .notes-block { display: block; }
  .note-line { padding: 3px 0; color: var(--text); display: flex; gap: 7px; align-items: baseline; }
  .note-line + .note-line { border-top: 1px dashed var(--border); padding-top: 5px; margin-top: 3px; }
  .note-line .note-id { font-family: monospace; color: var(--primary); font-weight: 600;
                        text-decoration: none; min-width: 44px; }
  .note-line .note-id:hover { text-decoration: underline; }
  .note-line .note-prose { color: var(--text2); }
  .note-line--empty .note-prose { color: var(--text3); font-style: italic; }
  .mobile-burger { display: none; position: fixed; top: 8px; left: 8px; z-index: 60; background: var(--bg2); border: 1px solid var(--border);
                   color: var(--text); padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  /* Burger shows when sidebar collapses (sync'd with the 700px breakpoint
     above). The main-pane top padding adjustment now lives in the same
     700px @media block earlier in the file. */
  @media (max-width: 700px) { .mobile-burger { display: block; } }
  .empty { color: var(--text2); padding: 24px; text-align: center; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
  .home-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; cursor: pointer;
               transition: transform .1s, border-color .1s; }
  .home-card:hover { border-color: var(--primary); transform: translateY(-1px); }
  .home-card h4 { margin: 0 0 4px; font-size: 14px; }
  .home-card .meta { color: var(--text3); font-size: 11px; margin-top: 4px; }
  .home-card .micro-count { color: var(--primary); font-size: 12px; font-weight: 600; }
  /* ── DS detail pane: embedded topic blocks ────────────────────────── */
  .ds-topic-block { margin-top: 36px; padding-top: 12px; border-top: 2px solid var(--border); }
  .ds-topic-hd { display: flex !important; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
                 margin: 4px 0 6px !important; border-bottom: none !important; padding-bottom: 0 !important; font-size: 15px !important; }
  .ds-topic-hd .ds-topic-ico { font-size: 16px; margin-right: 4px; }
  .ds-topic-hd .ds-topic-count { color: var(--text3); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .ds-topic-hd .topic-jump { font-size: 11px; color: var(--text3); padding: 3px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; }
  .ds-topic-hd .topic-jump:hover { color: var(--primary); border-color: var(--primary); text-decoration: none; }
  .hd-count { color: var(--text3); font-size: 11px; font-weight: 400; margin-left: 6px; }
  /* ── Topic detail pane: "Applies to N data structures" cards ─────── */
  .topic-ds-block { margin-top: 28px; }
  /* When ANY card is expanded, flip the grid into a single column so
     the embedded micro-cards have full width to breathe. */
  .topic-ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin: 10px 0 8px; }
  .topic-ds-grid:has(.topic-ds-card.expanded) { grid-template-columns: 1fr; }
  .topic-ds-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
                   transition: border-color .1s; }
  .topic-ds-card:hover { border-color: var(--primary); }
  .topic-ds-card.expanded { border-color: var(--primary); }
  /* Header is a full-width button now (so the whole row is the click
     target for toggling) — strip native button styling. */
  .topic-ds-card-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                      background: none; border: none; padding: 0; width: 100%; font-family: inherit;
                      cursor: pointer; text-align: left; color: var(--text); }
  .topic-ds-card-hd:hover { color: var(--primary); }
  .topic-ds-card-hd .topic-ds-ico { font-size: 16px; }
  .topic-ds-card-hd .topic-ds-name { font-weight: 600; font-size: 14px; }
  .topic-ds-card-hd .topic-ds-applies { font-size: 10px; color: var(--text3); font-weight: 400;
                                        padding: 2px 6px; background: var(--bg3); border-radius: 8px; }
  .topic-ds-card-hd .topic-ds-caret { margin-left: auto; color: var(--text3); transition: transform .15s; }
  .topic-ds-card.expanded .topic-ds-card-hd .topic-ds-caret { color: var(--primary); }
  .topic-ds-note { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .topic-ds-note em { color: var(--text3); }
  /* "↗ open DS page" footer link — only shows when collapsed (no need
     to navigate while expanded — content is already here). */
  .topic-ds-open { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--text3); }
  .topic-ds-open:hover { color: var(--primary); }
  /* Lazily-rendered expanded content (micros for this topic-under-DS). */
  .topic-ds-expanded { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .topic-ds-card.expanded .topic-ds-expanded { display: block; }
  .topic-ds-expanded-hd { font-size: 12px; color: var(--text3); margin-bottom: 8px;
                          text-transform: uppercase; letter-spacing: .4px; }

  /* ── Deep-dive detail drawer ─────────────────────────────────────── */
  .detail-panel { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
  .detail-panel[hidden] { display: none; }
  .detail-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45);
                     animation: detailFadeIn .15s ease-out; pointer-events: auto; }
  /* Flex column: sticky header (always shows which detail) + scrolling body. */
  .detail-drawer { position: absolute; top: 0; right: 0; width: min(820px, 96vw); height: 100vh;
                   background: var(--bg2); border-left: 1px solid var(--border);
                   box-shadow: -4px 0 24px rgba(0,0,0,.5); overflow: hidden;
                   display: flex; flex-direction: column; pointer-events: auto;
                   animation: detailSlideIn .18s ease-out; }
  /* Drag the left edge to resize the drawer width. */
  .detail-resize { position: absolute; left: 0; top: 0; width: 10px; height: 100%; cursor: ew-resize; z-index: 5;
                   touch-action: none; }
  .detail-resize::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%;
                   background: var(--primary); opacity: 0; transition: opacity .12s; }
  .detail-resize:hover::before, body.drawer-resizing .detail-resize::before { opacity: .6; }
  /* Pinned header — stays put while the body scrolls. Double-click toggles width.
     Condenses to a compact one-line title once the body is scrolled (more
     reading space); full header returns at the top. */
  .detail-head { flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px;
                 padding: 14px 22px 10px 26px; border-bottom: 1px solid var(--border);
                 background: var(--bg2); cursor: pointer; user-select: none;
                 transition: padding .15s ease; }
  .detail-head-title { flex: 1; min-width: 0; }
  .detail-head-title h2 { margin: 4px 0 0; font-size: 19px; transition: font-size .15s ease; }
  .detail-head-title .detail-eyebrow { margin: 0; }
  .detail-head-title .detail-id { margin-bottom: 0; }
  .detail-head.condensed { padding-top: 8px; padding-bottom: 7px; align-items: center; }
  .detail-head.condensed .detail-eyebrow,
  .detail-head.condensed .detail-id { display: none; }
  .detail-head.condensed .detail-head-title h2 { font-size: 14px; margin: 0;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-content { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 26px 32px; }
  @keyframes detailFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes detailSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .detail-close { flex-shrink: 0; margin-top: 2px; width: 30px; height: 30px;
                  border-radius: 50%; background: var(--bg3); border: 1px solid var(--border);
                  color: var(--text); cursor: pointer; font-size: 18px; line-height: 1;
                  display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .detail-close:hover { color: var(--danger, #e34545); border-color: var(--danger, #e34545); }
  .detail-content h2 { margin: 8px 0 4px; font-size: 20px; }
  .detail-content .detail-eyebrow { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
  .detail-content .detail-id { font-size: 11px; color: var(--text3); margin-bottom: 16px; }
  .detail-content .detail-id code { background: var(--bg3); padding: 1px 6px; border-radius: 3px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h4 { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .6px;

  .group-combo-card:hover { background: var(--bg3); border-color: var(--primary); }

  /* Engine sub-patterns within a group (pat_group::<g>::<micro>). */

  .group-micro { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--primary);

  .group-micro-name { font-weight: 600; font-size: 13px; flex: 1; }
  .group-micro-hd .cnt { color: var(--text2); font-size: 11px; }

  .combo-block { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; }

  .combo-probs .anchor-list { margin-top: 2px; }

               color: var(--text2); margin: 10px 0 4px; }

  .combo-pseudo { margin: 2px 0 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
               border-left: 3px solid var(--primary); border-radius: 6px;

               color: var(--text); white-space: pre; overflow-x: auto; }
  /* Headline (the "N problems, one engine" line). */
  .combo-headline { font-size: 13px; font-weight: 700; color: var(--text); margin: 2px 0 8px; }
  /* Compact key→detail / comparison tables. */
  .combo-table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; font-size: 12px; }
  .combo-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .4px;

  /* Per-problem mini-cards: header (#id + title + tag) then visual/bullets/note. */
  .combo-prob-list { display: flex; flex-direction: column; gap: 10px; }
  .combo-prob { padding: 8px 0 0; border-top: 1px dashed var(--border); }

  /* Editable "My notes" block (saved/edited via the parent AdsHub app). */

</style>

<body>
<button class="mobile-burger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
<div class="layout">
  <aside class="sidebar">
    <div class="side-hd">
      <h1>📐 Micro-Pattern Reference</h1>
      <div class="sub">DS → clue → micro-pattern → anchors. Links open in AdsHub.</div>
      <!-- ── Tab toggle: DS = input shape; Topic = solution technique ── -->
      <div class="tab-toggle">
        <button id="tab-ds"    class="active" onclick="setTab('ds')">📦 Data Structure</button>
        <button id="tab-topic"           onclick="setTab('topic')">🧰 Topic</button>
        <button id="tab-group"           onclick="setTab('group')">🗂 Group By</button>
      </div>
      <!-- Search + view-toggle live on the same row to save vertical
           space. Search flex-grows; toggle stays a fixed cluster on the
           right. Wraps to two rows on extremely narrow sidebars. -->
      <div class="search-row">
        <input class="nav-search" id="navSearch" placeholder="Filter patterns or prob #…" oninput="renderNav()">
        <div class="view-toggle" title="Sidebar render style">
          <button id="vt-tree" class="active" onclick="setView('tree')"
                  title="Tree view (grouped by pattern)" aria-label="Tree view">🗂️</button>

  <main class="main" id="main"></main>
  <!-- Slide-out detail drawer for deep-dive on a micro pattern.
       Hidden by default; openMicroDetail() populates + reveals. -->
  <div id="micro-detail-panel" class="detail-panel" hidden>
    <div class="detail-backdrop" onclick="closeMicroDetail()"></div>
    <aside class="detail-drawer" role="dialog" aria-labelledby="detail-title">
      <div class="detail-resize" title="Drag to resize"></div>
      <div class="detail-head" id="detail-head" ondblclick="toggleDrawerWidth()" title="Double-click to toggle width">
        <div class="detail-head-title" id="detail-head-title"></div>

<!-- Shared catalog, loaded with the parent's ?v= build id (fallback ts) so it busts per deploy. -->
<script>(function(){var m=location.search.match(/[?&]v=([^&]+)/);document.write('<scr'+'ipt src="patterns-catalog.js?v='+(m?m[1]:Date.now())+'"><\/scr'+'ipt>');})();</script>
<script>
// ── Data ──────────────────────────────────────────────────────────────────
// HIGH-LEVEL pattern → micro-patterns. Each micro carries:
//   when: the clue / problem shape that triggers this pattern
//   how:  one-line implementation sketch
//   cost: time + space
//   contrast: how it differs from sibling micros
//   anchors: LC ids — click opens the AdsHub deep-link
//
// `topicTag` (optional) goes into the "Browse all in AdsHub" link as a
// search query so the user can pull the full set of LC-tagged problems
// for that high-level pattern.

const PATTERNS = window.PG_PATTERNS  // catalog moved to ./patterns-catalog.js (shared with lineage graph)
// Alphabetize the micro-patterns inside every card (in place, once at load).
PATTERNS.forEach(p => { if (Array.isArray(p.micros)) p.micros.sort((a, b) => a.name.localeCompare(b.name)) })

// ── DS ↔ Topic cross-link ────────────────────────────────────────────────
// Each DS pattern lists the Topic patterns whose techniques commonly show
// up on that DS. The same topic appears under multiple DSes — that's the
// point: when browsing "Array" you see every applicable topic with its
// full micro set, without having to remember to flip to the Topic tab.
//
// The Topic tab still owns the source-of-truth view (one topic, all DSes).
const DS_TOPIC_LINKS = {
  'array':       ['hash', 'two-pointers', 'sliding-window', 'binary-search', 'sorting', 'prefix-sum', 'dp', 'greedy', 'stack-topic', 'deque-topic', 'math', 'bits'],
  'string':      ['hash', 'two-pointers', 'sliding-window', 'dp', 'trie-topic', 'stack-topic', 'bfs', 'backtrack'],
  'linked-list': ['two-pointers', 'hash', 'sorting'],
  'tree':        ['dfs', 'bfs', 'dp'],   // (no backtrack — none of its micros fit cleanly under Tree;
                                          //  tree-path enumeration lives in Tree's own core micros.)
  'bst':         ['dfs', 'binary-search'],
  'graph':       ['dfs', 'bfs', 'union-find', 'heap', 'dp', 'greedy'],
  'matrices':    ['dfs', 'bfs', 'dp', 'prefix-sum'],
  // For Stack / Queue / Trie the topic-as-tool variants don't apply: by
  // definition those techniques run on Array / String / Tree / Grid /
  // Graph inputs, not on a stack / queue / trie. So we leave these three
  // DS pages topic-less — the page is a pure input-shape view. Pointer
  // to the corresponding Topic-tab entry is in each intro.
  'stack':       [],
  'queue':       [],
  'trie':        [],
}

// ── Group By: logical problem families ───────────────────────────────────
// A THIRD grouping axis, orthogonal to DS (input shape) and Topic (technique):
// the problem's SUBJECT MATTER. Tagged in the sheet as `pat_group::<id>` and
// surfaced from patterns-data.csv. This list only supplies display metadata
// (name / icon / blurb) + ordering; the actual membership (and which DS /
// Topics each group touches) is derived entirely from the CSV, so adding a
// new pat_group:: tag in the sheet makes the group appear automatically — a
// group missing here just renders with a default icon.
const GROUPS = [
  { id: 'palindrome',   icon: '🔁', name: 'Palindrome',   intro: 'Symmetry around a center / mirrored reads — check, build, partition, or count palindromic spans.' },
  { id: 'parenthesis',  icon: '🪢', name: 'Parenthesis',  intro: 'Balanced-bracket validity, generation, repair, and scoring — usually a stack or a running open-count.' },
  { id: 'sum',          icon: '➕', name: 'Sum / Target',  intro: 'Find or count elements / subarrays / paths / subsets that reach a target sum — k-sum, subarray-sum, combination-sum, path-sum.' },
  { id: 'expression',   icon: '🧮', name: 'Expression',    intro: 'Parse and evaluate arithmetic / nested / encoded expressions — calculators, RPN, operator insertion, string decoding.' },
  { id: 'buy-sell',     icon: '📈', name: 'Buy / Sell',    intro: 'Best-time-to-trade stock DP — single/multi transaction, cooldown, fees; state-machine over hold/sold/rest.' },
  { id: 'word-process', icon: '📖', name: 'Word / Dict',   intro: 'Operate over words / a dictionary — break, ladder, search, abbreviation, pattern bijection, frequency.' },
  // ── proposed (discovered) families ──
  { id: 'anagram',      icon: '🔀', name: 'Anagram',       intro: 'Group / match / locate anagrams via sorted-key or frequency-signature hashing.' },
  { id: 'subsequence',  icon: '〰️', name: 'Subsequence',   intro: 'Order-preserving (non-contiguous) selection — LIS, LCS, is-subsequence, matching/counting variants.' },
  { id: 'subset-selection', icon: '🎯', name: 'Subset Selection', intro: 'Pick an OPTIMAL subset (order-independent) under a constraint — maximize / count / partition. Only membership matters, not order; usually backtracking (include-exclude) or bitmask-DP over subsets.' },
  { id: 'scheduling',   icon: '🗓️', name: 'Scheduling',    intro: 'Order/select tasks under constraints — course prerequisites (topo), meeting rooms, task scheduler, job scheduling.' },
  { id: 'stream',       icon: '🌊', name: 'Stream',         intro: 'Online / streaming — maintain a running statistic (median, k-th largest, moving average) over an unbounded arriving sequence as elements come in, without rescanning. Usually two heaps, a bounded heap, or a moving window.' },
  { id: 'partition',    icon: '✂️', name: 'Partition',      intro: 'Split a sequence into contiguous pieces optimizing or satisfying a constraint — minimize the largest piece, count valid splits, partition by a predicate. Usually binary-search-on-answer (with a greedy feasibility check) or partition DP.' },
  { id: 'min-change',   icon: '🔧', name: 'Minimum Change',  intro: 'Fewest removals / deletions / changes to make a collection CONSISTENT — non-overlapping, all-unique, equalized, or a valid shape. The answer is the operation count; usually greedy (sort + sweep) or DP.' },
  { id: 'pattern-matching', icon: '🔎', name: 'Pattern Matching', intro: 'Match a string/sequence against a pattern, or locate a pattern in text — exact substring search (KMP / Z-algorithm), regex / wildcard matching (DP or trie), and structural pattern↔word isomorphism.' },
  { id: 'shortest-path', icon: '🛣️', name: 'Shortest Path',  intro: 'Pick the shortest-path algorithm by the edge weights — all-equal → BFS; {0,1} → 0-1 BFS; non-negative → Dijkstra; negatives / bounded hops → Bellman-Ford; all-pairs on a small dense graph → Floyd-Warshall.' },
  { id: 'longest-path',  icon: '📏', name: 'Longest Path',   intro: 'Find the LONGEST path / chain — NP-hard in general but tractable on a DAG (topological-order DP / critical path), a tree (diameter via post-order), or a grid where moves go to strictly larger cells (memoized DFS).' },
  { id: 'interactive',   icon: '🎯', name: 'Interactive Queries', intro: 'Hidden input you can only probe via a query oracle within a budget — binary-search by comparison queries, or deduce values/majority via pairwise/reference queries.' },
  { id: 'design',        icon: '🧩', name: 'Data-Structure Design', intro: 'Design a data structure meeting specific operations + complexity bounds — combine primitives (array+hash, heap+map, iterators, ordered structures) to hit the targets.' },
  { id: 'simulation',    icon: '🎲', name: 'Simulation',     intro: 'Directly simulate the described process step by step — grid steps, board/rule validation, line formatting, tiered accumulation.' },
]
function groupMeta(id) {
  return GROUPS.find(g => g.id === id) || { id, icon: '🗂', name: id.replace(/-/g, ' '), intro: '' }
}
// Group ids that actually have problems in the CSV, in GROUPS order, with any
// CSV-only groups (not listed above) appended alphabetically.
function visibleGroups() {
  // Alphabetical by display name (falls back to the id for unmetadata'd groups).
  const present = ANCHOR_DATA && ANCHOR_DATA.group ? Object.keys(ANCHOR_DATA.group) : []
  return present.sort((a, b) => groupMeta(a).name.localeCompare(groupMeta(b).name))
}
function groupProblemIds(g) {
  const ids = (ANCHOR_DATA && ANCHOR_DATA.group && ANCHOR_DATA.group[g]) || []
  // De-dup + numeric sort so the chip list is stable and readable.
  return [...new Set(ids)].sort((a, b) => Number(a) - Number(b))
}
// DS / Topic patterns involved in a group = the union of the pat_ds / pat_topic
// tags carried by the group's problems (collected into ANCHOR_DATA.byId at
// parse time). Each returned entry is { p, count } where count = how many of
// the group's problems touch that DS / Topic, sorted by count desc.
function groupInvolved(g) {
  const dsCount = {}, topicCount = {}
  for (const id of groupProblemIds(g)) {
    const b = ANCHOR_DATA && ANCHOR_DATA.byId && ANCHOR_DATA.byId[id]
    if (!b) continue
    b.ds.forEach(d => { dsCount[d] = (dsCount[d] || 0) + 1 })
    b.topic.forEach(t => { topicCount[t] = (topicCount[t] || 0) + 1 })
  }
  const build = (counts) => Object.entries(counts)
    .map(([id, count]) => ({ p: PATTERNS.find(x => x.id === id) || { id, name: id.replace(/-/g, ' '), icon: '•' }, count }))
    .sort((a, b) => b.count - a.count || a.p.name.localeCompare(b.p.name))
  return { ds: build(dsCount), topic: build(topicCount) }
}
// Engine sub-patterns within a group: micro → sorted unique ids. Driven by the
// 3-level pat_group::<group>::<micro> tags parsed into ANCHOR_DATA.groupMicro.
function groupMicros(g) {
  const gm = (ANCHOR_DATA && ANCHOR_DATA.groupMicro && ANCHOR_DATA.groupMicro[g]) || {}
  const out = {}
  for (const [micro, ids] of Object.entries(gm)) out[micro] = [...new Set(ids)].sort((a, b) => Number(a) - Number(b))
  return out
}
// Display definitions (name/when/mechanism) live in patterns-group-notes.json
// under groups.<group>.micros — content, decoupled from the tag→id mapping.
function groupMicroDefs(g) {
  return (GROUP_NOTES.groups && GROUP_NOTES.groups[g] && GROUP_NOTES.groups[g].micros) || {}
}

// Prefer the CSV-derived list; fall back to the hand-coded DS_TOPIC_LINKS
// constant (offline file:// or first-load before fetch resolves).
//
// EXCEPTION: an EXPLICITLY EMPTY hand-coded list (e.g. DS_TOPIC_LINKS.stack
// = []) is an intentional input-purity decision — those DS pages should
// stay pure even if the CSV derivation surfaces noise from inferDs
// misclassifications. Respect the empty even when derived is populated.
function linkedTopics(dsId) {
  const handCoded = DS_TOPIC_LINKS[dsId]
  if (Array.isArray(handCoded) && handCoded.length === 0) return []
  const ids = (DERIVED?.dsTopics?.[dsId]) || handCoded || []
  return ids.map(id => PATTERNS.find(p => p.id === id)).filter(Boolean)
}

// For a Topic, which DSes is it applied on? Same preference order: derived
// from tag soup first, hand-coded inverse of DS_TOPIC_LINKS as fallback.
function applicableDses(topicId) {
  if (DERIVED?.topicDses?.[topicId]) {
    return DERIVED.topicDses[topicId]
      .map(id => PATTERNS.find(x => x.id === id)).filter(Boolean)
  }
  const out = []
  for (const dsId of Object.keys(DS_TOPIC_LINKS)) {
    if ((DS_TOPIC_LINKS[dsId] || []).includes(topicId)) {
      const p = PATTERNS.find(x => x.id === dsId)
      if (p) out.push(p)
    }
  }
  return out
}

// Per-(topic, DS) one-line prose: how the topic actually shows up on
// that DS. Fills the "what are the ways the topic is applied on the DS"
// gap that pure cross-links can't answer. Pairs missing here fall back
// to a generic "click to see this topic embedded under [DS]" message.
const TOPIC_DS_NOTES = {
  dfs: {
    'tree':     'Pre/in/post-order traversal; tree DP returns subtree results; LCA via subtree containment.',
    'bst':      'In-order yields sorted values (validate, Kth, iterator); bounds-DFS for streaming validation.',
    'graph':    'Standard visit-recurse-mark; 3-color for cycle detection in directed graphs; post-order = topological sort.',
    'matrices': 'Grid flood-fill / island count — mark visited in-place to avoid a side set.',
  },
  bfs: {
    'string':   'Word-ladder shortest transformation; bidirectional BFS halves the search depth.',
    'tree':     'Level-order traversal for right-view, level sums, vertical / zigzag order.',
    'graph':    'Shortest path on unweighted edges; 0-1 BFS via deque when weights are {0,1}.',
    'matrices': 'Shortest path on a grid; multi-source BFS for nearest-source distance to every cell.',
  },
  hash: {
    'array':       'Two-sum complement lookup; prefix-sum hashmap for subarray-sum-K (handles negatives).',
    'string':      'Anagram fingerprint key (sorted or 26-count); freq counter to drive sliding-window invariants.',
    'linked-list': 'Seen-set for cycle detection; node→clone map for deep-copy of linked list with random ptr.',
  },
  'two-pointers': {
    'array':       'Converging from ends (3-sum, water-area, palindrome); in-place read/write (dedupe, move-zeros).',
    'string':      'Palindrome validation; merge-walk between two strings; expand-around-center.',

function topicDsNote(topicId, dsId) {

// Per-(topic, DS) ALLOWLIST of which of the topic's micros actually apply
// to that DS. Fixes the "Two-Pointers shown under String → Fast-Slow Same
// Direction → LC 141 (Linked-List Cycle)" surprise: tp-fast-slow doesn't

// Pairs missing from this map fall back to showing ALL the topic's

  'binary-search': {

  },
  sorting: {

  },
  'prefix-sum': {
    'array':    ['ps-1d', 'ps-hashmap', 'difference-array'],

  },
  dp: {
    'array':    ['dp-1d-linear', 'knapsack-01', 'knapsack-unbounded', 'state-machine-dp', 'bitmask-dp', 'interval-dp'],
    'string':   ['dp-2-strings', 'interval-dp'],
    'tree':     ['tree-dp'],
    'graph':    ['bitmask-dp'],                           // (DAG longest-path lives in Graph core)
    'matrices': ['dp-2d-grid'],
  },
  greedy: {
    'graph': ['sort-and-sweep'],                          // MST = sort edges + UF
  },
  'stack-topic': {
    // String-input problems solved with a stack (parens, brackets,
    // expression eval, decode-string). monotonic-stack is array-shaped.
    'string': ['parens-rewrite', 'bracket-match', 'expression-eval', 'decode-string'],
  },
  // (trie-topic / bfs / dfs entries no longer carry stack/queue/trie
  //  allowlists — DS_TOPIC_LINKS for those DSes is now empty per the

// Return the topic's micros filtered for embedding under a specific DS.
// Preference order:
//   1) CSV-derived allowlist (DERIVED.dsTopicMicros) — populated from
//      every pat_ds::<ds>::<topic>::<micro> tag that exists in the sheet
//   2) hand-coded TOPIC_DS_MICROS allowlist
//   3) all the topic's micros (no allowlist → uniform fit)
function microsForEmbed(topicId, dsId) {
  const t = PATTERNS.find(p => p.id === topicId)
  if (!t) return []
  const derived = DERIVED?.dsTopicMicros?.[dsId]?.[topicId]
  const allow   = derived || (TOPIC_DS_MICROS[topicId] || {})[dsId]
  // allowlist still decides WHICH micros apply under this (DS, topic);
  // display order is alphabetical, like everywhere else (t.micros is pre-sorted).
  if (!allow) return t.micros
  const allowSet = new Set(allow)
  return t.micros.filter(m => allowSet.has(m.id))
}

// ── Data file (CSV) ──────────────────────────────────────────────────────
// Anchors used to live as inline `anchors: [...]` arrays on each micro.
// They now live in /portal/public/patterns-data.csv so that adding a
// problem in AdsHub + tagging it with `pat_*::*` flows through here on
// the next CSV regen — no patterns.html edit needed. CSV columns:
//   anchor_id, tag
// where tag ∈ {
//   pat_ds::<dsId>::core::<microId>            (DS-core micro anchor)
//   pat_topic::<topicId>::<microId>            (Topic micro, DS unknown)
//   pat_ds::<dsId>::<topicId>::<microId>       (full path — Topic embedded
//                                                under specific DS; lets the
//                                                renderer build DS-specific
//                                                allowlists from data)
// }
// If the fetch fails (offline / not regenerated), we fall back to the
// inline `m.anchors` arrays still present on each micro — UI keeps working.
let ANCHOR_DATA = null    // { coreAnchors[dsId][microId] = [ids],
                          //   topicAnchors[topicId][microId] = [ids],
                          //   dsTopicAnchors[dsId][topicId][microId] = [ids] }
let PATTERN_NOTES = {}    // { microId: { lcId: "how the micro applies to this problem" } }
                          // Loaded from patterns-notes.json. Empty object if
                          // fetch fails — anchor chips just don't get a tooltip.
let DERIVED = null        // computed from ANCHOR_DATA after CSV load —
                          // { dsTopics[ds] = [topicIds],          (replaces hand-coded DS_TOPIC_LINKS)
                          //   dsTopicMicros[ds][topic] = [micros],(replaces TOPIC_DS_MICROS)
                          //   topicDses[topic] = [dsIds]   }       (powers applicableDses)
                          // Linked/applicable helpers prefer DERIVED when present
                          // and fall back to the hand-coded constants below.

async function loadAnchorData() {
  try {
    // Relative to where patterns.html is served. Cache-busted so a fresh
    // CSV is picked up without manual reload juggling.
    const r = await fetch('patterns-data.csv?ts=' + Date.now(), { cache: 'no-store' })
    if (!r.ok) return null
    const text = await r.text()
    return parsePatternData(text)
  } catch (e) {
    console.warn('[patterns] CSV fetch failed, using inline anchors:', e)
    return null
  }
}
