function parsePatternData(csvText) {
  const lines = csvText.split('\n').filter(l => l.trim())
  if (!lines.length) return null
  // Header assumed: anchor_id,tag (we don't enforce — just skip line 1).
  //   group: groupId → [ids]                         (pat_group:: rows)
  //   byId:  id → { ds:Set<dsId>, topic:Set<topicId> } reverse map, lets the
  //          Group By tab report which DS / Topics each group's problems touch.
  const out = { core: {}, topic: {}, dsTopic: {}, group: {}, groupMicro: {}, byId: {} }
  const byId = (id) => (out.byId[id] = out.byId[id] || { ds: new Set(), topic: new Set() })
  for (let i = 1; i < lines.length; i++) {
    const m = lines[i].match(/^(\d+)\s*,\s*(?:"([^"]*)"|([^\n]*))$/)
    if (!m) continue
    const id  = m[1]
    const tag = (m[2] ?? m[3] ?? '').trim()
    const parts = tag.split('::')
    if (parts[0] === 'pat_ds' && parts.length === 4 && parts[2] === 'core') {
      // pat_ds::<ds>::core::<micro>
      const ds = parts[1], micro = parts[3]
      ;(((out.core[ds] = out.core[ds] || {})[micro] = out.core[ds][micro] || [])).push(id)
      byId(id).ds.add(ds)
    } else if (parts[0] === 'pat_topic' && parts.length === 3) {
      // pat_topic::<topic>::<micro>
      const topic = parts[1], micro = parts[2]
      ;(((out.topic[topic] = out.topic[topic] || {})[micro] = out.topic[topic][micro] || [])).push(id)
      byId(id).topic.add(topic)
    } else if (parts[0] === 'pat_ds' && parts.length === 4 && parts[2] !== 'core') {
      // pat_ds::<ds>::<topic>::<micro>  — Topic micro embedded under DS.
      // Counts under both the Topic-tab view (out.topic) and the DS-tab
      // embedded-section view (out.dsTopic).
      const ds = parts[1], topic = parts[2], micro = parts[3]
      ;(((out.topic[topic] = out.topic[topic] || {})[micro] = out.topic[topic][micro] || [])).push(id)
      const a = (out.dsTopic[ds] = out.dsTopic[ds] || {})
      const b = (a[topic] = a[topic] || {})
      ;((b[micro] = b[micro] || [])).push(id)
      byId(id).ds.add(ds); byId(id).topic.add(topic)
    } else if (parts[0] === 'pat_group' && parts.length === 2) {
      // pat_group::<group>  — logical problem family (subject matter).
      const group = parts[1]
      ;((out.group[group] = out.group[group] || [])).push(id)
    } else if (parts[0] === 'pat_group' && parts.length === 3) {
      // pat_group::<group>::<micro>  — solution-engine sub-pattern within a
      // family. The id still counts in the flat family (groupProblemIds dedups)
      // and additionally lands under the per-engine bucket.
      const group = parts[1], micro = parts[2]
      ;((out.group[group] = out.group[group] || [])).push(id)
      const gm = (out.groupMicro[group] = out.groupMicro[group] || {})
      ;((gm[micro] = gm[micro] || [])).push(id)
    }
  }
  // De-dup every id list: a problem tagged with BOTH pat_topic::T::M and
  // pat_ds::D::T::M lands in out.topic[T][M] twice (both branches push), which
  // would render the same #id chip twice and inflate counts. Keep unique ids.
  const dedupArrays = (node) => {
    for (const k in node) {
      const v = node[k]
      if (Array.isArray(v)) node[k] = [...new Set(v)]
      else if (v && typeof v === 'object') dedupArrays(v)
    }
  }
  ;[out.core, out.topic, out.dsTopic, out.group, out.groupMicro].forEach(dedupArrays)
  return out
}

// Compute the cross-link maps PURELY from the data file. Adding a new tag
// in the sheet (and re-running build-patterns-csv) now propagates to:
//   • DS-tab tree:           which Topics show under each DS
//   • DS-tab embed sections: which micros appear under each (DS, Topic)
//   • Topic-tab "Applies to": which DSes appear under each Topic
// without any patterns.html code edit.
function computeDerivedMaps(data) {
  if (!data) return null
  const dsTopics      = {}    // dsId    → Set<topicId>
  const dsTopicMicros = {}    // dsId    → topicId → Set<microId>
  const topicDses     = {}    // topicId → Set<dsId>
  for (const dsId of Object.keys(data.dsTopic || {})) {
    dsTopics[dsId]      = new Set()
    dsTopicMicros[dsId] = {}
    for (const topicId of Object.keys(data.dsTopic[dsId])) {
      dsTopics[dsId].add(topicId)
      dsTopicMicros[dsId][topicId] = new Set(Object.keys(data.dsTopic[dsId][topicId]))
      ;(topicDses[topicId] = topicDses[topicId] || new Set()).add(dsId)
    }
  }
  const toArr = (s) => [...s]
  return {
    dsTopics:      Object.fromEntries(Object.entries(dsTopics     ).map(([k, v]) => [k, toArr(v)])),
    dsTopicMicros: Object.fromEntries(Object.entries(dsTopicMicros).map(([k, v]) =>
                     [k, Object.fromEntries(Object.entries(v).map(([t, ms]) => [t, toArr(ms)]))])),
    topicDses:     Object.fromEntries(Object.entries(topicDses    ).map(([k, v]) => [k, toArr(v)])),
  }
}

// Anchor lookup used by renderMicroCard. Order of preference:
//   1) parent is DS  + ANCHOR_DATA has DS-core anchors           → use those
//   2) parent is Topic + ANCHOR_DATA has Topic anchors           → use those
//   3) DS-embed-of-topic + ANCHOR_DATA.dsTopic has the entry     → use those
//   4) fallback: inline m.anchors (back-compat)
function anchorsFor(parentPattern, micro, embeddedUnderDsId = null) {
  if (ANCHOR_DATA) {
    if (embeddedUnderDsId) {
      // Embedded under a DS — prefer DS-specific anchors if available,
      // else fall through to the topic's full anchor union (which is what
      // the user sees if we never tagged per-DS).
      const dsSpec = ANCHOR_DATA.dsTopic?.[embeddedUnderDsId]?.[parentPattern.id]?.[micro.id]
      if (dsSpec && dsSpec.length) return dsSpec
      const topicAll = ANCHOR_DATA.topic?.[parentPattern.id]?.[micro.id]
      if (topicAll) return topicAll
    } else if ((parentPattern.tab || 'ds') === 'ds') {
      const a = ANCHOR_DATA.core?.[parentPattern.id]?.[micro.id]
      if (a) return a
    } else {
      const a = ANCHOR_DATA.topic?.[parentPattern.id]?.[micro.id]
      if (a) return a
    }
  }
  // Back-compat fallback — uses the literal anchors still embedded
  // alongside each micro definition.
  return micro.anchors || []
}

// ── Render ───────────────────────────────────────────────────────────────
let view = 'tree'         // 'tree' | 'flat'
let activeTab = 'ds'      // 'ds' | 'topic' | 'group' — filters which PATTERNS / groups show
let activePatternId = null
let activeMicroId = null
let activeGroupId = null  // selected pat_group:: id when activeTab === 'group'
// Which L1 groups are expanded in the tree. Kept SEPARATE from
// activePatternId so a group can be toggled open/closed independently of
// which pattern is selected/shown in the main pane (re-clicking collapses).
let expandedIds = new Set()

const $ = sel => document.querySelector(sel)

// Patterns visible under the current tab.
function visiblePatterns() {
  // Alphabetical by display name within the active tab (DS / Topic).
  return PATTERNS.filter(p => (p.tab || 'ds') === activeTab)
                 .sort((a, b) => a.name.localeCompare(b.name))
}

function setTab(t) {
  activeTab = t
  document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
  $('#tab-' + t).classList.add('active')
  // If the currently selected pattern doesn't belong to the new tab, clear
  // selection and return to the tab's home — keeps the URL honest and
  // avoids showing an empty nav with a stale main pane.
  if (activePatternId) {
    const stillVisible = visiblePatterns().some(p => p.id === activePatternId)
    if (!stillVisible) { activePatternId = null; activeMicroId = null }
  }
  // Rewrite the hash so refresh / back lands on the same tab.
  writeHash()
  renderNav()
  renderMain()
}

function setView(v) {
  view = v
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'))
  $('#vt-' + v).classList.add('active')
  renderNav()
}

// A micro matches the nav filter when its name, its parent's name, or one of
// its anchor problem-ids contains the query. The prob-id match lets you type
// e.g. "208" to surface the micro(s) that reference LC 208.
// `anchors` must be the SAME list the card will render in this context
// (DS-scoped via anchorsFor) — not the micro's raw inline union — so that
// e.g. searching "84" doesn't surface the Matrices card whose displayed
// anchors are only [85].
function microMatches(m, parent, filter, anchors) {
  if (!filter) return true
  const ids = anchors || m.anchors || []
  return m.name.toLowerCase().includes(filter)
    || (parent && parent.name.toLowerCase().includes(filter))
    || ids.some(a => String(a) === filter)
}

function renderNav() {
  const filter = $('#navSearch').value.trim().toLowerCase()
  const list   = $('#navList')
  // Group By has its own (tree-only) nav — no flat view.
  if (activeTab === 'group') { list.className = 'nav-list'; list.innerHTML = ''; renderGroupNav(list, filter); return }
  list.className = view === 'tree' ? 'nav-list' : 'flat-list'
  list.innerHTML = ''
  if (view === 'tree') renderTree(list, filter)
  else                  renderFlat(list, filter)
}

function renderTree(root, filter) {
  visiblePatterns().forEach(p => {
    const matchesPattern = !filter
      || p.name.toLowerCase().includes(filter)
      || p.micros.some(m => microMatches(m, p, filter, anchorsFor(p, m)))
      || (activeTab === 'ds' && linkedTopics(p.id).some(t =>
            microsForEmbed(t.id, p.id).some(m => microMatches(m, t, filter, anchorsFor(t, m, p.id)))))
    if (!matchesPattern) return

    const grp = document.createElement('div')
    grp.className = 'tree-group'

    const l1 = document.createElement('div')
    // While a filter is active, drill the tree open so the matching micro
    // (which may be nested under an embedded topic) is actually visible.
    l1.className = 'tree-l1'
      + (activePatternId === p.id ? ' active' : '')
      + (expandedIds.has(p.id) || filter ? ' expanded' : '')
    l1.innerHTML = `
      <span class="caret">▶</span>
      <span class="ico">${p.icon}</span>
      <span class="lbl">${p.name}</span>
      <span class="count">${p.micros.length}</span>`
    l1.onclick = () => {
      if (isSelectingText()) return   // let copy-on-drag work
      // Toggle: a second click on an open group collapses it (without
      // changing the main pane). Opening also selects so content shows.
      if (expandedIds.has(p.id)) { expandedIds.delete(p.id); renderNav() }
      else                       { expandedIds.add(p.id); selectPattern(p.id) }
    }
    grp.appendChild(l1)

    const sub = document.createElement('div')
    sub.className = 'tree-l2-wrap'
    p.micros.forEach(m => {
      if (!microMatches(m, p, filter, anchorsFor(p, m))) return
      const l2 = document.createElement('a')
      l2.className = 'tree-l2' + (activeMicroId === `${p.id}/${m.id}` ? ' active' : '')
      l2.href = `#${p.id}/${m.id}`
      l2.textContent = m.name
      l2.onclick = e => {
        e.preventDefault()
        if (isSelectingText()) return
        // Navigate so the main pane reflects the parent + scrolls the
        // card into view, THEN open the deep-dive drawer (same as
        // clicking ⓘ on the card itself). User intent on sidebar click
        // is 'show me details', not just 'scroll there'.
        selectPattern(p.id, m.id)
        openMicroDetail(m.id, p.id, null)
      }
      sub.appendChild(l2)
    })

    // ─── Topic-tab only: list the DSes this topic applies to ─────────
    if (activeTab === 'topic') {
      const dses = applicableDses(p.id)
      if (dses.length) {
        const hdr = document.createElement('div')
        hdr.className = 'tree-topics-hdr'
        hdr.textContent = `Applies to (${dses.length})`
        sub.appendChild(hdr)
        dses.forEach(d => {
          if (filter
              && !d.name.toLowerCase().includes(filter)
              && !p.name.toLowerCase().includes(filter)) return
          const a = document.createElement('a')
          a.className = 'tree-topic-row tree-applies-row'
          a.innerHTML = `
            <span class="ico">${d.icon}</span>
            <span class="lbl">${d.name}</span>`
          a.onclick = () => {
            if (isSelectingText()) return
            // Stay on the Topic page: select the topic if needed, then expand
            // + scroll the matching DS card in place (it carries an explicit
            // "↗ open DS page" link for those who want to flip tabs).
            const fresh = activePatternId !== p.id
            if (fresh) selectPattern(p.id)
            setTimeout(() => openTopicDsCard(d.id), fresh ? 60 : 0)
          }
          sub.appendChild(a)
        })
      }
    }

    // ─── DS-tab only: linked topics for this DS as expandable rows ────
    // Each topic chip can be expanded inline to show that topic's micros
    // nested underneath — matches the "every topic might have micro
    // patterns underneath" mental model the user asked for.
    if (activeTab === 'ds') {
      const topics = linkedTopics(p.id)
      if (topics.length) {
        const hdr = document.createElement('div')
        hdr.className = 'tree-topics-hdr'
        hdr.textContent = `Topics that apply (${topics.length})`
        sub.appendChild(hdr)

        topics.forEach(t => {
          // Filter to micros that apply on THIS DS (allowlist) — keeps
          // the tree in sync with what the main pane will actually
          // render. If the allowlist eliminates everything, skip the
          // topic entirely.
          const embedded = microsForEmbed(t.id, p.id)
          if (!embedded.length) return

          // Honour the search filter for embedded topics too.
          const tMatches = !filter
            || t.name.toLowerCase().includes(filter)
            || embedded.some(m => microMatches(m, t, filter, anchorsFor(t, m, p.id)))
          if (!tMatches) return

          // Topic header row — click toggles inline expansion, anchor link
          // jumps to that section in the DS main pane.
          const tHdr = document.createElement('div')
          tHdr.className = 'tree-topic-row' + (filter ? ' expanded' : '')
          tHdr.innerHTML = `
            <span class="caret">▶</span>
            <span class="ico">${t.icon}</span>
            <span class="lbl">${t.name}</span>
            <span class="count">${embedded.length}</span>`
          tHdr.onclick = () => {
            if (isSelectingText()) return
            tHdr.classList.toggle('expanded')
            // Stay on the DS page: select this DS if needed, then scroll to
            // its embedded topic section (which carries a "→ open in Topic
            // tab" link for an explicit flip).
            const fresh = activePatternId !== p.id
            if (fresh) selectPattern(p.id)
            setTimeout(() => {
              const el = document.getElementById(`ds-topic-${p.id}-${t.id}`)
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
            }, fresh ? 60 : 0)
          }
          sub.appendChild(tHdr)

          // L3 wrap with the topic's own micros (deeper indent).
          const tSub = document.createElement('div')
          tSub.className = 'tree-l3-wrap'
          embedded.forEach(m => {
            if (!microMatches(m, t, filter, anchorsFor(t, m, p.id))) return
            const l3 = document.createElement('a')
            l3.className = 'tree-l3'
            l3.href = `#topic/${t.id}/${m.id}`
            l3.textContent = m.name
            l3.onclick = e => {
              e.preventDefault()
              if (isSelectingText()) return
              // Same shape as L2: navigate (so the main pane shows the
              // DS pane with the topic section), then open the deep-dive
              // drawer. embeddedUnderDsId = p.id because the micro is
              // shown under DS p (not standalone in the Topic tab).
              if (activePatternId !== p.id) selectPattern(p.id)
              setTimeout(() => {
                const el = document.getElementById(`m-${t.id}-${m.id}`)
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
                openMicroDetail(m.id, t.id, p.id)
              }, activePatternId !== p.id ? 60 : 0)
            }
            tSub.appendChild(l3)
          })
          sub.appendChild(tSub)
        })
      }
    }

    grp.appendChild(sub)
    root.appendChild(grp)
  })
}

function renderFlat(root, filter) {
  const items = []
  visiblePatterns().forEach(p => p.micros.forEach(m => items.push({ p, m })))
  items.sort((a, b) => a.m.name.localeCompare(b.m.name))
  items.forEach(({ p, m }) => {
    if (!microMatches(m, p, filter, anchorsFor(p, m))) return
    const it = document.createElement('a')
    it.className = 'flat-item' + (activeMicroId === `${p.id}/${m.id}` ? ' active' : '')
    it.href = `#${p.id}/${m.id}`
    it.innerHTML = `${m.name} <span class="flat-cat">· ${p.name}</span>`
    it.onclick = e => { e.preventDefault(); selectPattern(p.id, m.id) }
    root.appendChild(it)
  })
}

// ── Group By nav ───────────────────────────────────────────────────────────
// L1 = logical group (expandable). Under it, two labelled sections list the
// DS and Topics its problems touch; clicking a row opens that combo's section
// IN the detail pane (expand + scroll), staying on the Group By tab.
function renderGroupNav(root, filter) {
  const groups = visibleGroups()
  if (!groups.length) {
    const empty = document.createElement('div')
    empty.className = 'tree-topics-hdr'
    empty.textContent = ANCHOR_DATA ? 'No pat_group:: tags yet' : 'Loading…'
    root.appendChild(empty)
    return
  }
  groups.forEach(gid => {
    const meta = groupMeta(gid)
    const ids  = groupProblemIds(gid)
    const inv  = groupInvolved(gid)
    if (filter) {
      const hit = meta.name.toLowerCase().includes(filter)
        || ids.some(id => String(id) === filter)
        || inv.ds.concat(inv.topic).some(x => x.p.name.toLowerCase().includes(filter))
      if (!hit) return
    }
    const expanded = expandedIds.has('group:' + gid) || !!filter
    const grp = document.createElement('div')
    grp.className = 'tree-group'

    const l1 = document.createElement('div')
    l1.className = 'tree-l1' + (activeGroupId === gid ? ' active' : '') + (expanded ? ' expanded' : '')
    l1.innerHTML = `
      <span class="caret">▶</span>
      <span class="ico">${meta.icon}</span>
      <span class="lbl">${meta.name}</span>
      <span class="count">${ids.length}</span>`
    l1.onclick = () => {
      if (isSelectingText()) return
      const key = 'group:' + gid
      if (expandedIds.has(key)) { expandedIds.delete(key); renderNav() }
      else                      { expandedIds.add(key); selectGroup(gid) }
    }
    grp.appendChild(l1)

    const sub = document.createElement('div')
    sub.className = 'tree-l2-wrap'
    const addDim = (label, entries, kind) => {
      if (!entries.length) return
      const hdr = document.createElement('div')
      hdr.className = 'tree-topics-hdr'
      hdr.textContent = `${label} (${entries.length})`
      sub.appendChild(hdr)
      entries.forEach(({ p, count }) => {
        if (filter && !p.name.toLowerCase().includes(filter) && !meta.name.toLowerCase().includes(filter)) return
        const a = document.createElement('a')
        a.className = 'tree-topic-row tree-applies-row'
        a.innerHTML = `
          <span class="ico">${p.icon}</span>
          <span class="lbl">${p.name}</span>
          <span class="count">${count}</span>`
        // Open this DS/Topic's breakdown in the side drawer (select the group
        // first if needed so the main list is in sync) — no tab jump.
        a.onclick = () => {
          if (isSelectingText()) return
          if (activeGroupId !== gid) selectGroup(gid)
          openComboDetail(gid, kind, p.id)
        }
        sub.appendChild(a)
      })
    }
    addDim('Data structures', inv.ds, 'ds')
    addDim('Topics', inv.topic, 'topic')
    grp.appendChild(sub)
    root.appendChild(grp)
  })
}

function selectGroup(gid) {
  activeTab       = 'group'
  activeGroupId   = gid
  activePatternId = null
  activeMicroId   = null
  expandedIds.add('group:' + gid)
  syncTabButtons()
  writeHash()
  renderNav()
  renderMain()
}

function selectPattern(pid, mid = null) {
  // If the target pattern lives under the other tab, jump to that tab
  // first — keeps cross-tab links (e.g. home cards, anchor refs) honest.
  const p = PATTERNS.find(x => x.id === pid)
  if (p && (p.tab || 'ds') !== activeTab) {
    activeTab = p.tab || 'ds'
    document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
    const tb = $('#tab-' + activeTab); if (tb) tb.classList.add('active')
  }
  activePatternId = pid
  activeMicroId   = mid ? `${pid}/${mid}` : null
  expandedIds.add(pid)   // selecting a pattern always opens its tree group
  writeHash()
  renderNav()
  renderMain()
  if (mid) {
    setTimeout(() => {
      const el = document.getElementById(`m-${pid}-${mid}`)
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }, 40)
  }
}

// URL shape: #<tab>[/pattern[/micro]]  e.g. #topic/dfs/dfs-template
function writeHash() {
  let h = activeTab
  if (activeTab === 'group') {
    if (activeGroupId) h += '/' + activeGroupId
  } else if (activePatternId) {
    h += '/' + activePatternId
    if (activeMicroId) h += '/' + activeMicroId.split('/')[1]
  }
  // Use replace-style: avoid spamming history while clicking around.
  history.replaceState(null, '', '#' + h)
}

const DIFF_HINT = {  // Light-weight difficulty hint, just for the card colour. Exact difficulty is in AdsHub.
  // Most LC problems are medium; we leave class blank where unknown.
}

function renderMain() {
  const main = $('#main')
  if (activeTab === 'group') { renderGroupMain(main); return }
  if (!activePatternId) { renderHome(main); return }
  const p = PATTERNS.find(x => x.id === activePatternId)
  if (!p) { renderHome(main); return }
  const browseUrl = `adshub?q=${encodeURIComponent(p.topicTag || p.name)}`
  const isDS    = (p.tab || 'ds') === 'ds'
  const tabLabel = isDS ? '📦 Data Structure' : '🧰 Topic'

  // For DS patterns: embed the topics that apply to this DS (with their
  // full micro card grids).
  // For Topic patterns: show which DSes this topic is applied on, each
  // with a one-line "how" note and a click-through to the DS page.
  const topics = isDS ? linkedTopics(p.id) : []
  const dses   = !isDS ? applicableDses(p.id) : []
  const coreLabel = (isDS && topics.length) || (!isDS && dses.length)
    ? `Core ${p.name} micros`
    : `${p.micros.length} micro-patterns`

  const topicSections = topics.map(t => {
    // Filter to micros that ACTUALLY apply to this DS (e.g. don't show
    // tp-fast-slow under String — its anchors are all linked-list).
    const embedded = microsForEmbed(t.id, p.id)
    const filtered = embedded.length !== t.micros.length
    return `
    <div class="ds-topic-block" id="ds-topic-${p.id}-${t.id}">
      <h3 class="ds-topic-hd">
        <span><span class="ds-topic-ico">${t.icon}</span> ${t.name}
          <span class="ds-topic-count">${embedded.length}${filtered ? ` of ${t.micros.length}` : ''} micros${filtered ? ` apply to ${p.name}` : ''}</span>
        </span>
        <a class="topic-jump" href="#topic/${t.id}"
           onclick="event.preventDefault(); selectPattern('${t.id}')">→ open in Topic tab</a>
      </h3>
      <p class="lede" style="margin-top:-2px">${t.intro}</p>
      <div class="micro-grid">
        ${embedded.map(m => renderMicroCard(t, m, p.id /* embeddedUnderDsId */)).join('')}
      </div>
    </div>`
  }).join('')

  // "Applies to" — one card per DS that lists this topic in DS_TOPIC_LINKS.
  // The note explains HOW this topic shows up on that DS (e.g. DFS on
  // Tree = "pre/in/post-order + tree DP"). Where no per-pair note exists
  // we degrade to a generic prompt.
  const dsSection = dses.length ? `
    <div class="topic-ds-block">
      <h3>Applies to ${dses.length} data structure${dses.length>1?'s':''}</h3>
      <p class="lede" style="margin-top:-4px">
        How this topic is typically used on each DS. Click any card's header to
        expand the applicable micros inline (no navigation away). The footer
        link opens the full DS page if you want the broader context.
      </p>
      <div class="topic-ds-grid">
        ${dses.map(d => {
          const note   = topicDsNote(p.id, d.id)
          const apMics = microsForEmbed(p.id, d.id)
          return `
          <div class="topic-ds-card" data-topic-id="${p.id}" data-ds-id="${d.id}">
            <button class="topic-ds-card-hd" onclick="toggleTopicDsCard(this)">
              <span class="topic-ds-ico">${d.icon}</span>
              <span class="topic-ds-name">${d.name}</span>
              <span class="topic-ds-applies">${apMics.length} micro${apMics.length>1?'s':''} apply</span>
              <span class="topic-ds-caret">▾</span>
            </button>
            <div class="topic-ds-note">${note || `<em>Expand to see ${p.name} embedded under ${d.name}.</em>`}</div>
            <a class="topic-ds-open" href="#ds/${d.id}"
               onclick="event.preventDefault(); selectPattern('${d.id}')">
              ↗ open ${d.icon} ${d.name} page
            </a>
            <div class="topic-ds-expanded"><!-- micros injected on first expand --></div>
          </div>`
        }).join('')}
      </div>
    </div>
  ` : ''

  main.innerHTML = `
    <div class="breadcrumb">${tabLabel}</div>
    <h2>${p.icon} ${p.name}</h2>
    <p class="lede">${p.intro}</p>
    <a class="browse-link" href="${browseUrl}"
       onclick="onBrowseLinkClick(event, ${JSON.stringify(p.topicTag || p.name)})">
      ↗ Browse all "${p.topicTag || p.name}"-tagged problems in AdsHub
    </a>
    <button class="expand-all-notes" onclick="toggleAllNotes(this)">▾ expand all notes</button>
    <h3>${coreLabel}${((isDS&&topics.length)||(!isDS&&dses.length)) ? ` <span class="hd-count">(${p.micros.length})</span>` : ''}</h3>
    <div class="micro-grid">
      ${p.micros.map(m => renderMicroCard(p, m)).join('')}
    </div>
    ${topicSections}
    ${dsSection}
  `
}

// True when this page is loaded inside an iframe (e.g. AdsHub's Patterns
// mode embeds /patterns.html). When embedded we postMessage instead of
// navigating so the host can switch its own state to "browse + select
// this problem" — same UX as clicking a row in the AdsHub list.
const EMBEDDED = (() => { try { return window.parent && window.parent !== window } catch { return false } })()

function onAnchorClick(e, id) {
  if (!EMBEDDED) return  // normal target=_blank navigation kicks in
  e.preventDefault()
  window.parent.postMessage({ type: 'pghub-open-problem', id }, '*')
}
function onBrowseLinkClick(e, q) {
  if (!EMBEDDED) return
  e.preventDefault()
  window.parent.postMessage({ type: 'pghub-search', q }, '*')
}

// ── Editable "My notes" (delegated to the AdsHub parent for storage/auth) ────
// The iframe can't persist (no Google auth); it just shows the saved note and
// asks the parent to open its editor. Only meaningful when EMBEDDED.
let currentNoteKey = null
function escAttr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;') }
// A "My notes" block appended to a combo / micro detail. `key` namespaces the
// note (e.g. group/palindrome/ds/string, micro/two-sum-hash).
function noteSectionHtml(key, title) {
  if (!EMBEDDED) return ''   // editing needs the parent app's Google auth
  return `<div class="combo-block mynote-block">
    <div class="combo-lbl mynote-hd">📝 My notes
      <button class="mynote-edit" onclick="editPatternNote('${escAttr(key)}','${escAttr(title)}')">✏️ Edit / Add</button>
    </div>
    <div id="mynote-body" class="mynote-body"><span style="color:var(--text3)">Loading…</span></div>
  </div>`
}
function editPatternNote(key, title) { try { window.parent.postMessage({ type: 'pgnote-open', key, title }, '*') } catch {} }
function requestPatternNote(key) {
  currentNoteKey = key
  if (!EMBEDDED) return
  try { window.parent.postMessage({ type: 'pgnote-get', key }, '*') } catch {}
}

// Portal theme: AdsHubView forwards data-theme on mount and whenever the
// portal theme changes. Mirror it onto this iframe's <html> so the
// html[data-theme="…"] CSS blocks take effect. 'dark' is the default palette.
function applyPortalTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme || 'dark')
}
if (EMBEDDED) {
  window.addEventListener('message', e => {
    const d = e.data
    if (d && d.type === 'pghub-theme') applyPortalTheme(d.theme)
    else if (d && d.type === 'pgnote-data' && d.key === currentNoteKey) {
      const slot = document.getElementById('mynote-body')
      if (slot) slot.innerHTML = d.hasNote ? d.html : '<span style="color:var(--text3)">No note yet — click ✏️ Edit / Add.</span>'
    }
  })
  // Cover the race where the host posts the theme before this listener
  // attaches: ask it to (re)send.
  try { window.parent.postMessage({ type: 'pghub-ready' }, '*') } catch {}
}

// True when the user just released the mouse after dragging across
// some text (i.e. there's a non-empty active selection). Used to
// SHORT-CIRCUIT click navigation in the sidebar so that text-select
// + copy works on row labels without accidentally navigating.
function isSelectingText() {
  const sel = window.getSelection && window.getSelection()
  return !!(sel && sel.toString().trim().length)
}

// Minimal HTML escape — used wherever user-facing prose (notes) goes
// into the DOM. We're already producing HTML strings via template
// literals so this is the right shape.
function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function renderMicroCard(p, m, embeddedUnderDsId = null) {
  const ids   = anchorsFor(p, m, embeddedUnderDsId)
  const notes = PATTERN_NOTES[m.id] || {}
  const anchors = ids.map(id => {
    // Per-(micro, lc) prose note — shown as tooltip on the chip AND
    // expanded inline below when the user clicks "show notes". Notes
    // explain HOW this micro's strategy applies to THIS problem (and
    // call out cases where the tag works but isn't optimal — see
    // seen-set on LC 287/141 where Floyd's is the better answer).
    const note = notes[id]
    const titleAttr = note ? ` title="${escHtml(note)}"` : ''
    const dot = note ? '<span class="anchor-has-note">·</span>' : ''
    return `
    <a class="anchor${note ? ' has-note' : ''}" href="adshub?id=${id}" 
       onclick="onAnchorClick(event, ${id})"${titleAttr}>
      <span class="num">#${id}</span>${dot}
    </a>`
  }).join('')

  // Build an inline notes-block listing every anchor's prose application.
  // Hidden by default; the "show notes" button toggles a .notes-open class
  // on the parent .micro. Each line: bold #LCID + the application note.
  // Anchors without a note are still listed (just dimmer + "—") so the
  // user can see gaps to fill.
  const noted = ids.filter(id => notes[id])
  let notesBlock = ''
  if (noted.length) {
    const lines = ids.map(id => {
      const n = notes[id]
      if (n) return `<div class="note-line"><a class="note-id" href="adshub?id=${id}"  onclick="onAnchorClick(event, ${id})">#${id}</a> <span class="note-prose">${escHtml(n)}</span></div>`
      return `<div class="note-line note-line--empty"><a class="note-id" href="adshub?id=${id}"  onclick="onAnchorClick(event, ${id})">#${id}</a> <span class="note-prose">—</span></div>`
    }).join('')
    notesBlock = `
      <button class="notes-toggle" onclick="toggleNotes(this)" data-show-count="${noted.length}">▾ show ${noted.length} note${noted.length>1?'s':''}</button>
      <div class="notes-block">${lines}</div>`
  }

  // Whole-card click opens the deep-dive drawer — the ⓘ button is now
  // redundant but kept as an explicit affordance for discoverability.
  // The click handler bails when the click originates inside an
  // interactive child (button / anchor / notes-block) or when the user
  // is dragging to select text. embeddedUnderDsId is passed inline as a
  // JS expression (string or null), no extra escaping needed.
  const embed = embeddedUnderDsId ? `'${embeddedUnderDsId}'` : 'null'
  return `
    <div class="micro micro--clickable" id="m-${p.id}-${m.id}"
         onclick="onMicroCardClick(event, '${m.id}', '${p.id}', ${embed})">
      <h4>
        <span class="id">${m.id}</span>
        <span class="micro-name">${m.name}</span>
        <button class="micro-info-btn" title="Open deep-dive panel"
                onclick="openMicroDetail('${m.id}', '${p.id}', ${embed})">
          ⓘ
        </button>
      </h4>
      <p><strong>When:</strong> ${m.when}</p>
      <p><strong>How:</strong> ${m.how}</p>
      <div class="meta"><strong>Cost:</strong> ${m.cost}</div>
      <p class="contrast"><strong>Contrast:</strong> ${m.contrast}</p>
      <div class="anchor-list">${anchors}</div>
      ${notesBlock}
    </div>
  `
}

// Whole-card click handler — opens the deep-dive drawer unless the
// click originated on something interactive (buttons / anchor chips /
// notes-block toggle / note-line LC links) or the user is selecting text.
function onMicroCardClick(ev, microId, parentId, embeddedUnderDsId) {
  // Skip if the target (or any ancestor up to .micro) is itself a
  // button or anchor — those have their own handlers. Also skip if the
  // click landed inside the notes-block (which has expanded prose +
  // clickable anchor links we don't want to swallow).
  if (ev.target.closest('button, a, .notes-block')) return
  if (isSelectingText()) return
  openMicroDetail(microId, parentId, embeddedUnderDsId)
}

// Toggle the .notes-open class on the micro card; flip the button label.
function toggleNotes(btn) {
  const card = btn.closest('.micro')
  card.classList.toggle('notes-open')
  const open  = card.classList.contains('notes-open')
  const count = btn.dataset.showCount
  btn.textContent = open
    ? `▴ hide ${count} note${count>1?'s':''}`
    : `▾ show ${count} note${count>1?'s':''}`
}

// ── Deep-dive detail panel for a micro ─────────────────────────────────
// Opens a slide-out drawer with: full prose, pseudo-code (if any), all
// anchored problems with notes, plus a "Confused with" parsed from the
// micro's contrast field. parentId is the micro's parent pattern id;
// embeddedUnderDsId (optional) is set when the micro card was rendered
// inside a DS-tab embedded section — so we show DS-specific anchors.
function openMicroDetail(microId, parentId, embeddedUnderDsId) {
  const p = PATTERNS.find(x => x.id === parentId)
  const m = p && p.micros.find(mi => mi.id === microId)
  if (!m) return
  const notes  = PATTERN_NOTES[microId] || {}
  const pseudo = PATTERN_PSEUDO[microId]
  const visual = PATTERN_VISUALS[microId]
  const ids    = anchorsFor(p, m, embeddedUnderDsId || null)

  const allProblems = ids.map(id => {
    const note = notes[id]
    return `<li><a class="detail-anchor" href="adshub?id=${id}" 
            onclick="onAnchorClick(event, ${id})">#${id}</a>${note ? ` — <span class="detail-note">${escHtml(note)}</span>` : ''}</li>`
  }).join('')

  const isCore  = (p.tab || 'ds') === 'ds'
  const parentTag = isCore
    ? `📦 ${p.name} (DS core)`
    : `🧰 ${p.name} (Topic)`

  const head = `
    <div class="detail-eyebrow">${parentTag}${embeddedUnderDsId ? ` · embedded under ${embeddedUnderDsId}` : ''}</div>
    <h2 id="detail-title">${m.name}</h2>
    <div class="detail-id"><code>${m.id}</code></div>`

  const html = `
    <div class="detail-section">
      <h4>When</h4><p>${m.when}</p>
    </div>
    <div class="detail-section">
      <h4>How</h4><p>${m.how}</p>
    </div>
    <div class="detail-section">
      <h4>Cost</h4><p>${m.cost}</p>
    </div>
    <div class="detail-section">
      <h4>Often confused with</h4><p>${m.contrast}</p>
    </div>

    ${visual ? `
    <div class="detail-section">
      <h4>Visual</h4>
      <pre class="detail-visual">${escHtml(visual)}</pre>
    </div>` : ''}

    ${pseudo ? `
    <div class="detail-section">
      <h4>Pseudo-code</h4>
      <pre class="detail-pseudo">${escHtml(pseudo)}</pre>
    </div>` : `
    <div class="detail-section detail-section--missing">
      <h4>Pseudo-code</h4>
      <p><em>Not yet added for this micro — see <code>patterns-pseudo.json</code> to contribute.</em></p>
    </div>`}

    <div class="detail-section">
      <h4>${ids.length} problem${ids.length !== 1 ? 's' : ''} solvable with this pattern</h4>
      <ul class="detail-problem-list">${allProblems || '<li><em>No anchors yet.</em></li>'}</ul>
    </div>

  panel.hidden = false
  document.body.classList.add('detail-open')
}

// Set the pinned header + scrolling body of the drawer. Body always resets to

function setDrawerContent(headHtml, bodyHtml) {

// ── Drawer width: drag the left edge, or double-click the header to toggle ──
const DRAWER_MAXVW   = () => Math.round(window.innerWidth * 0.96)
const DRAWER_DEFAULT = () => Math.min(820, DRAWER_MAXVW())
const DRAWER_WIDE    = () => Math.min(1200, DRAWER_MAXVW())
const DRAWER_MIN     = 380
let drawerWide = false
function applyDrawerWidth(px) {
  const el = document.querySelector('.detail-drawer')
  if (el) el.style.width = Math.max(DRAWER_MIN, Math.min(px, DRAWER_MAXVW())) + 'px'
}
function toggleDrawerWidth() {
  drawerWide = !drawerWide
  applyDrawerWidth(drawerWide ? DRAWER_WIDE() : DRAWER_DEFAULT())
}
function initDrawerResize() {
  const handle = document.querySelector('.detail-resize')
  if (!handle) return
  let dragging = false
  handle.addEventListener('pointerdown', e => {
    dragging = true; try { handle.setPointerCapture(e.pointerId) } catch {}
    document.body.classList.add('drawer-resizing'); e.preventDefault()
  })
  handle.addEventListener('pointermove', e => { if (dragging) applyDrawerWidth(window.innerWidth - e.clientX) })
  const end = e => { dragging = false; try { handle.releasePointerCapture(e.pointerId) } catch {} ; document.body.classList.remove('drawer-resizing') }
  handle.addEventListener('pointerup', end)
  handle.addEventListener('pointercancel', end)
  const body = document.getElementById('detail-content')
  if (body) body.addEventListener('scroll', updateHeadCondense, { passive: true })
}
initDrawerResize()

// ── Group By main pane ──────────────────────────────────────────────────────
function groupAnchorChips(ids) {
  if (!ids.length) return '<p class="lede" style="color:var(--text3)">No anchors.</p>'
  return `<div class="anchor-list">${ids.map(id =>
    `<a class="anchor" href="adshub?id=${id}" onclick="onAnchorClick(event, ${id})"><span class="num">#${id}</span></a>`
  ).join('')}</div>`
}
// Engine sub-patterns for a group, rendered as a list of mini-cards. Each shows
// the micro id + name, a when/mechanism line (from notes), and its problems.
// Order follows the notes definition order, then any untyped extras A-Z.
function renderGroupMicros(g) {
  const micros = groupMicros(g)
  const ids = Object.keys(micros)
  if (!ids.length) return ''
  const defs = groupMicroDefs(g)
  const defOrder = Object.keys(defs)
  const ordered = [...defOrder.filter(m => micros[m]), ...ids.filter(m => !defOrder.includes(m)).sort()]
  const cards = ordered.map(mid => {
    const def  = defs[mid] || {}
    const list = micros[mid]
    const name = def.name || mid.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
    const when = def.when      ? `<p class="group-micro-when">${mdLite(def.when)}</p>` : ''
    const mech = def.mechanism ? `<p class="group-micro-mech">⚙ ${mdLite(def.mechanism)}</p>` : ''
    // Reuse the shared per-micro sidecars (keyed by micro id) so a sub-micro
    // shows the same pseudo / ASCII visual a Topic micro card would — content
    // is preserved when a Topic is moved to a Group.
    const pseudo = PATTERN_PSEUDO[mid]  ? `<pre class="combo-pseudo">${escHtml(PATTERN_PSEUDO[mid])}</pre>` : ''
    const visual = PATTERN_VISUALS[mid] ? `<pre class="combo-visual">${escHtml(PATTERN_VISUALS[mid])}</pre>` : ''
    const chips = list.map(id => `<a class="anchor" href="adshub?id=${id}" onclick="onAnchorClick(event, ${id})"><span class="num">#${id}</span></a>`).join('')
    return `<div class="group-micro">
      <div class="group-micro-hd">
        <span class="group-micro-id">${escHtml(mid)}</span>
        <span class="group-micro-name">${escHtml(name)}</span>
        <span class="cnt">${list.length}</span>
      </div>${when}${mech}${pseudo}${visual}
      <div class="anchor-list">${chips}</div>
    </div>`
  }).join('')
  return `<div class="group-micro-list">${cards}</div>`
}
// Problems in a group that touch a given DS / Topic dimension.
function groupComboProblems(g, kind, dimId) {
  return groupProblemIds(g).filter(id => {
    const b = ANCHOR_DATA && ANCHOR_DATA.byId && ANCHOR_DATA.byId[id]
    if (!b) return false
    return kind === 'ds' ? b.ds.has(dimId) : b.topic.has(dimId)
  })
}
// Tiny inline markdown: **bold** and `code` only. HTML-escape FIRST (entries
// contain literal < > inside code spans like `sum<t` / `1 << k`), THEN convert
// the markers — escHtml leaves * and ` untouched so the markup still matches.
function mdLite(s) {
  return escHtml(String(s))
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
}
// 2-column key→detail table (used for "tricks at a glance").
function kvTable(rows) {
  return `<table class="combo-table"><tbody>${rows.map(r =>
    `<tr><td class="k">${mdLite(r.k)}</td><td>${mdLite(r.v)}</td></tr>`).join('')}</tbody></table>`
}
// Comparison table: { cols:[...], rows:[[...], ...] }.
function compareTable(cmp) {
  if (!cmp || !Array.isArray(cmp.cols) || !Array.isArray(cmp.rows)) return ''
  return `<table class="combo-table"><thead><tr>${cmp.cols.map(c => `<th>${mdLite(c)}</th>`).join('')}</tr></thead>`
    + `<tbody>${cmp.rows.map(row => `<tr>${row.map(c => `<td>${mdLite(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
}
// A note entry may be a plain string (legacy) or a rich object:
//   { tldr, headline, insight(string|string[]), points[], tricks([str]|[{k,v}]),
//     compare{cols,rows}, pseudo, visual }
// Scannable order: lead → headline → (short) insight → bullets →
// 🧠 tricks (table or bullets) → ⚖️ compare → ⌨️ pseudo → ASCII visual.
function renderNoteBlock(label, data, cls) {
  if (!data) return ''
  if (typeof data === 'string') data = { tldr: data }
  const out = []
  if (data.tldr)     out.push(`<p class="combo-tldr">${mdLite(data.tldr)}</p>`)
  if (data.headline) out.push(`<p class="combo-headline">${mdLite(data.headline)}</p>`)
  if (data.insight)  (Array.isArray(data.insight) ? data.insight : [data.insight]).forEach(t => out.push(`<p class="combo-insight">${mdLite(t)}</p>`))
  if (data.points && data.points.length) out.push(`<ul class="combo-points">${data.points.map(p => `<li>${mdLite(p)}</li>`).join('')}</ul>`)
  if (data.tricks && data.tricks.length) {
    out.push(`<div class="combo-sublbl">🧠 Tricks at a glance</div>`)
    out.push(typeof data.tricks[0] === 'object'
      ? kvTable(data.tricks)
      : `<ul class="combo-points combo-tricks">${data.tricks.map(t => `<li>${mdLite(t)}</li>`).join('')}</ul>`)
  }
  if (data.compare)  out.push(`<div class="combo-sublbl">⚖️ Compare</div>` + compareTable(data.compare))
  if (data.pseudo)   out.push(`<div class="combo-sublbl">⌨️ Pseudo-code</div><pre class="combo-pseudo">${escHtml(data.pseudo)}</pre>`)
  if (data.visual)   out.push(`<pre class="combo-visual">${escHtml(data.visual)}</pre>`)
  if (!out.length) return ''
  return `<div class="combo-block ${cls || ''}"><div class="combo-lbl">${label}</div>${out.join('')}</div>`
}
// Per-problem breakdown. Each problem may carry { id, title, tag, note,
// visual, points[] } and renders as a mini-card: #id + title + tag, then an
// ASCII visual / bullets / note. Falls back to plain #id chips when no
// per-problem content is authored.
function renderProblemSolutions(g, kind, dimId, inG) {
  const ids = groupComboProblems(g, kind, dimId)
  const authored = inG && Array.isArray(inG.problems) ? inG.problems : null
  if (authored && authored.length) {
    const byId = {}; authored.forEach(x => { byId[String(x.id)] = x })
    const rows = ids.map(id => {
      const pn    = byId[String(id)] || {}
      const title = pn.title ? `<span class="combo-prob-title">${escHtml(pn.title)}</span>` : ''
      const tag   = pn.tag   ? `<span class="combo-prob-tag">${escHtml(pn.tag)}</span>` : ''
      const note  = pn.note  ? `<div class="combo-prob-note">${mdLite(pn.note)}</div>` : ''
      const pts   = (pn.points && pn.points.length) ? `<ul class="combo-points">${pn.points.map(p => `<li>${mdLite(p)}</li>`).join('')}</ul>` : ''
      const vis   = pn.visual ? `<pre class="combo-visual">${escHtml(pn.visual)}</pre>` : ''
      return `<div class="combo-prob">
        <div class="combo-prob-hd">
          <a class="anchor combo-prob-id" href="adshub?id=${id}" onclick="onAnchorClick(event, ${id})"><span class="num">#${id}</span></a>
          ${title}${tag}
        </div>${note}${vis}${pts}
      </div>`
    }).join('')
    return `<div class="combo-block combo-probs">
      <div class="combo-lbl">📌 How these problems are solved (${ids.length})</div>
      <div class="combo-prob-list">${rows}</div></div>`
  }
  const chips = ids.map(id => `<a class="anchor" href="adshub?id=${id}" onclick="onAnchorClick(event, ${id})"><span class="num">#${id}</span></a>`).join('')
  return `<div class="combo-block combo-probs">
    <div class="combo-lbl">📌 Problems (${ids.length})</div>
    <div class="anchor-list">${chips}</div></div>`
}
// Resolve a DS/Topic dimension id to a {id,name,icon,tab} meta (PATTERNS
// entry, or a light fallback for CSV-only dims like 'simulation').
function comboMeta(dimId) {
  return PATTERNS.find(x => x.id === dimId) || { id: dimId, name: dimId.replace(/-/g, ' '), icon: '•' }
}
// Master list: each DS/Topic the group touches is a CLICKABLE CARD that opens
// its full breakdown in the side drawer (no inline expand).
function renderComboList(g, kind, entries) {
  if (!entries.length) return '<p class="lede" style="color:var(--text3)">none</p>'
  return `<div class="group-combo-list">${entries.map(({ p, count }) => {
    // Show each subsection's problems inline (chips) right under its card, so
    // the per-DS / per-Topic breakdown is visible without opening the drawer.
    // The card header still opens the drawer for the how-it's-solved write-up.
    const ids = groupComboProblems(g, kind, p.id)
    const chips = ids.map(id => `<a class="anchor" href="adshub?id=${id}" onclick="onAnchorClick(event, ${id})"><span class="num">#${id}</span></a>`).join('')
    return `<div class="group-combo-row">
      <button class="group-combo-card${activeCombo === (g + '|' + kind + '|' + p.id) ? ' active' : ''}"
              onclick="openComboDetail('${g}','${kind}','${p.id}')" title="Open how-it's-solved write-up">

        <span class="caret">›</span>

}
// Header (pinned) for a (group × dim).
function comboHeadHtml(g, kind, dimId) {
  const gMeta = groupMeta(g), p = comboMeta(dimId)
  return `<div class="detail-eyebrow">🗂 ${gMeta.name} · ${kind === 'ds' ? 'Data structure' : 'Topic'}</div>
    <h2 id="detail-title">${gMeta.icon} ${gMeta.name} <span style="color:var(--text3)">×</span> ${p.icon} ${p.name}</h2>`

// Scrolling body for a (group × dim).
function comboDetailHtml(g, kind, dimId) {
  const gMeta = groupMeta(g)
  const p     = comboMeta(dimId)
  const inG   = (GROUP_NOTES.groups && GROUP_NOTES.groups[g] && GROUP_NOTES.groups[g][kind] && GROUP_NOTES.groups[g][kind][dimId]) || ''
  const gen   = (GROUP_NOTES.general && GROUP_NOTES.general[kind] && GROUP_NOTES.general[kind][dimId]) || ''

    ${noteSectionHtml('group/' + g + '/' + kind + '/' + dimId, gMeta.name + ' × ' + p.name)}

}

// ── URL hash routing ────────────────────────────────────────────────────
// New shape:   #<tab>/<pattern>/<micro>   e.g. #topic/dfs/dfs-template
// Legacy:      #<pattern>/<micro>         (auto-resolves the tab from the
//                                          pattern's `tab` field)
function applyHash() {
  const h = location.hash.replace(/^#/, '')
  if (!h) {
    // Bare URL → keep current tab default ('ds'), no pattern selected.
    syncTabButtons()
    renderNav(); renderMain()
    return
  }
  const parts = h.split('/')
  // Group By route: #group[/<groupId>]
  if (parts[0] === 'group') {
    activeTab       = 'group'
    activeGroupId   = parts[1] || null
    activePatternId = null
    activeMicroId   = null
    if (activeGroupId) expandedIds.add('group:' + activeGroupId)
    syncTabButtons()
    renderNav(); renderMain()
    return
  }
  // Detect new shape: first segment is 'ds' or 'topic'.
  if (parts[0] === 'ds' || parts[0] === 'topic') {
    activeTab       = parts[0]
    activePatternId = parts[1] || null
    activeMicroId   = parts[2] ? `${parts[1]}/${parts[2]}` : null
  } else {
    // Legacy shape — derive tab from pattern.
    const pid = parts[0], mid = parts[1]
    const p   = PATTERNS.find(x => x.id === pid)
    activeTab       = (p && p.tab) || 'ds'
    activePatternId = pid
    activeMicroId   = mid ? `${pid}/${mid}` : null
  }
  if (activePatternId) expandedIds.add(activePatternId)  // open the deep-linked group
  syncTabButtons()
  renderNav(); renderMain()
  if (activeMicroId) {
    setTimeout(() => {
      const [pid, mid] = activeMicroId.split('/')
      const el = document.getElementById(`m-${pid}-${mid}`)
      if (el) el.scrollIntoView({ block: 'start' })
    }, 40)
  }
}
function syncTabButtons() {
  document.querySelectorAll('.tab-toggle button').forEach(b => b.classList.remove('active'))
  const tb = $('#tab-' + activeTab); if (tb) tb.classList.add('active')
}
window.addEventListener('hashchange', applyHash)

// Boot: try to fetch the CSV first (if served alongside this file). If the
// fetch resolves, ANCHOR_DATA is populated and every renderMicroCard call
// pulls live data; if it rejects (e.g. opening the html via file://) we
// fall through to the inline `m.anchors` arrays still attached to each
// micro — the UI stays functional offline.
Promise.all([loadAnchorData(), loadPatternNotes(), loadPatternPseudo(), loadPatternVisuals(), loadGroupNotes()]).then(([data, notes, pseudo, visuals, groupNotes]) => {
  ANCHOR_DATA     = data
  DERIVED         = computeDerivedMaps(data)
  PATTERN_NOTES   = notes
  PATTERN_PSEUDO  = pseudo
  PATTERN_VISUALS = visuals
  GROUP_NOTES     = groupNotes || {}
  const noteCount = Object.values(notes).reduce((s, m) => s + Object.keys(m).length, 0)
  console.info(`[patterns] ${noteCount} per-problem application notes loaded`)
  if (data) {
    const coreCount  = Object.values(data.core   ).reduce((s, o) => s + Object.values(o).reduce((a, b) => a + b.length, 0), 0)
    const topicCount = Object.values(data.topic  ).reduce((s, o) => s + Object.values(o).reduce((a, b) => a + b.length, 0), 0)
    const dsTopCount = Object.values(data.dsTopic).reduce((s, ds) => s + Object.values(ds).reduce((a, t) => a + Object.values(t).reduce((x, ids) => x + ids.length, 0), 0), 0)
    const dsLinks = Object.values(DERIVED?.dsTopics      || {}).reduce((s, a) => s + a.length, 0)
    const tLinks  = Object.values(DERIVED?.topicDses     || {}).reduce((s, a) => s + a.length, 0)
    console.info(`[patterns] CSV loaded — ${coreCount} DS-core, ${topicCount} topic, ${dsTopCount} DS-of-topic anchors  ·  derived: ${dsLinks} DS→topic edges, ${tLinks} topic→DS edges`)
  } else {
    console.info('[patterns] no CSV found, using inline m.anchors arrays + hand-coded link maps')
  }
  applyHash()
})
</script>
